<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 배경 다크 슬레이트-틸 그라데이션 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09141f"/>
      <stop offset="45%" stop-color="#0b2326"/>
      <stop offset="100%" stop-color="#041619"/>
    </linearGradient>

    <!-- 테두리 서브틀 글로우 -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0.15"/>
    </linearGradient>

    <!-- PDF 블록: 선명하고 단정한 코랄 레드 그라데이션 -->
    <linearGradient id="pdfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- IMAGE 블록: 청량하고 깊이 있는 에메랄드 틸 그라데이션 -->
    <linearGradient id="imgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>

    <!-- 볼륨감 그림자 -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 둥근 스퀘어 베이스 (Squircle) -->
  <rect x="20" y="20" width="472" height="472" rx="100" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- 상단 카드: PDF -->
  <g filter="url(#cardShadow)">
    <rect x="68" y="76" width="376" height="156" rx="26" fill="url(#pdfGrad)"/>
    <!-- 상단 반투명 하이라이트 -->
    <path d="M68 102 C68 87.6 79.6 76 94 76 L418 76 C432.4 76 444 87.6 444 102 L444 140 L68 140 Z" fill="#ffffff" fill-opacity="0.08"/>
    <!-- PDF 텍스트 -->
    <text x="256" y="185" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="82" 
          font-weight="900" 
          letter-spacing="6" 
          fill="#ffffff" 
          text-anchor="middle">PDF</text>
  </g>

  <!-- 중앙 미니멀 양방향 스왑 배지 -->
  <g transform="translate(256, 256)">
    <!-- 캡슐 -->
    <rect x="-48" y="-23" width="96" height="46" rx="23" fill="#0f172a" stroke="#334155" stroke-width="2.5"/>
    <!-- 위 화살표 (좌->우 틸) -->
    <path d="M-22 -5 L14 -5 M8 -11 L16 -5 L8 1" stroke="#2dd4bf" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- 아래 화살표 (우->좌 로즈) -->
    <path d="M22 6 L-14 6 M-8 0 L-16 6 L-8 12" stroke="#fb7185" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- 하단 카드: IMAGE -->
  <g filter="url(#cardShadow)">
    <rect x="68" y="280" width="376" height="156" rx="26" fill="url(#imgGrad)"/>
    <!-- 상단 반투명 하이라이트 -->
    <path d="M68 306 C68 291.6 79.6 280 94 280 L418 280 C432.4 280 444 291.6 444 306 L444 344 L68 344 Z" fill="#ffffff" fill-opacity="0.08"/>
    <!-- IMAGE 텍스트 -->
    <text x="256" y="386" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="68" 
          font-weight="900" 
          letter-spacing="5" 
          fill="#ffffff" 
          text-anchor="middle">IMAGE</text>
  </g>
</svg>
