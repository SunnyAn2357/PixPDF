    // 표준 용지 밀리미터(mm) 및 300DPI 기준 픽셀(px) 규격표
    const PAPER_SPECS = {
      a3: { name: 'A3 (297×420mm)', wMm: 297, hMm: 420, ratio: 1.414, pxW: 3508, pxH: 4960 },
      a4: { name: 'A4 (210×297mm)', wMm: 210, hMm: 297, ratio: 1.414, pxW: 2480, pxH: 3508 },
      a5: { name: 'A5 (148×210mm)', wMm: 148, hMm: 210, ratio: 1.414, pxW: 1748, pxH: 2480 },
      b3: { name: 'B3 (353×500mm)', wMm: 353, hMm: 500, ratio: 1.416, pxW: 4169, pxH: 5906 },
      b4: { name: 'B4 (250×353mm)', wMm: 250, hMm: 353, ratio: 1.412, pxW: 2953, pxH: 4169 },
      b5: { name: 'B5 (176×250mm)', wMm: 176, hMm: 250, ratio: 1.420, pxW: 2079, pxH: 2953 }
    };

    function handlePaperSizeChange(mode) {
      if (mode === 'pdf2img') {
        const val = document.getElementById('selPageFit').value;
        document.getElementById('groupCustomPxPdf').style.display = val === 'custom' ? 'flex' : 'none';
      } else {
        const val = document.getElementById('selPdfPageSize').value;
        document.getElementById('groupCustomPxImg').style.display = val === 'custom' ? 'flex' : 'none';
      }
      updateMiniPreview();
    }

    // 용지 규격 해석 유틸리티 (규격명, 방향, 원본 크기 등을 기반으로 최적 치수 산출)
    function resolvePaperGeometry(key, isLandscape, origW, origH, customW, customH) {
      if (key === 'original') {
        return {
          name: '원본 규격',
          ratio: origW / origH,
          widthPx: origW,
          heightPx: origH,
          isLandscape: origW > origH
        };
      }
      if (key === 'custom') {
        const cw = Math.max(100, customW || 1920);
        const ch = Math.max(100, customH || 1080);
        return {
          name: `사용자 정의 (${cw}×${ch}px)`,
          ratio: cw / ch,
          widthPx: cw,
          heightPx: ch,
          isLandscape: cw > ch
        };
      }
      const spec = PAPER_SPECS[key] || PAPER_SPECS.a4;
      const w = isLandscape ? Math.max(spec.pxW, spec.pxH) : Math.min(spec.pxW, spec.pxH);
      const h = isLandscape ? Math.min(spec.pxW, spec.pxH) : Math.max(spec.pxW, spec.pxH);
      return {
        name: `${spec.name.split(' ')[0]} ${isLandscape ? '가로' : '세로'}`,
        ratio: w / h,
        widthPx: w,
        heightPx: h,
        isLandscape: isLandscape
      };
    }

    // [핵심] 단일 통합 작업 공간 상태 관리 (PDF와 이미지 구분 없이 섞어서 편집)
    const docState = {
      items: [], // [{ type: 'pdf'|'image', doc, pageNum, name, width, height, imgObj, file, settings: { fit, pageSize, quality, scale, rot, rotTarget, contentScale, scaleX, trapezoid, brightness, contrast, offsetX, offsetY, orient, margin, format, transparentBg, customW, customH } }]
      checkList: [],
      currentIndex: 0,
      zoom: 1.0,
      fileName: 'PixPDF_Document',
      globalSettings: {
        fit: 'original',
        pageSize: 'original',
        quality: 'ultra',
        scale: 3.0,
        rot: 0,
        rotPage: 0,
        rotImg: 0,
        rotTarget: { page: true, image: true },
        contentScale: 1.0,
        scaleX: 1.0,
        trapezoid: 0,
        brightness: 100,
        contrast: 100,
        offsetX: 0,
        offsetY: 0,
        format: 'png',
        transparentBg: true,
        orient: 'auto',
        margin: 0,
        customW: 1920,
        customH: 1080
      }
    };

    // 하위 호환성 및 기존 함수 연동을 위한 양방향 Proxy
    const pdfState = {
      get doc() { return docState.items[docState.currentIndex]?.doc || null; },
      set doc(d) {},
      get fileName() { return docState.fileName; },
      set fileName(v) { docState.fileName = v; },
      get pages() { return docState.items; },
      set pages(v) { docState.items = v; },
      get checkList() { return docState.checkList; },
      set checkList(v) { docState.checkList = v; },
      get currentIndex() { return docState.currentIndex; },
      set currentIndex(v) { docState.currentIndex = v; },
      get zoom() { return docState.zoom; },
      set zoom(v) { docState.zoom = v; },
      get globalSettings() { return docState.globalSettings; }
    };

    const pickerState = {
      doc: null,
      file: null,
      total: 0,
      selected: [],
      targetInsertIndex: -1
    };
    let pendingInsertIndex = -1;

    const imgState = {
      get items() { return docState.items; },
      set items(v) { docState.items = v; },
      get checkList() { return docState.checkList; },
      set checkList(v) { docState.checkList = v; },
      get currentIndex() { return docState.currentIndex; },
      set currentIndex(v) { docState.currentIndex = v; },
      get zoom() { return docState.zoom; },
      set zoom(v) { docState.zoom = v; },
      get fileName() { return docState.fileName; },
      set fileName(v) { docState.fileName = v; },
      get globalSettings() { return docState.globalSettings; }
    };

    let appMode = 'unified'; // 단일 통합 모드
    let isAborted = false;
    let zipBlobs = [];
    let draggedCardIndex = null;

    // 삽입 이미지 페이지를 PDF 페이지(A4 x3 기준 1785x2526)와 동일한 스케일로 맞추는 배율
    function getImagePageFactor(w, h) {
      const longSide = Math.max(w, h), shortSide = Math.min(w, h);
      return Math.min(2526 / longSide, 1785 / shortSide);
    }

    // 회전 타겟(페이지, 이미지) 해석 헬퍼 함수
    function getResolvedRotations(cfg) {
      const rotPage = parseInt(cfg.rotPage !== undefined ? cfg.rotPage : (cfg.rot || 0), 10) || 0;
      const rotImg = parseInt(cfg.rotImg !== undefined ? cfg.rotImg : (cfg.rot || 0), 10) || 0;
      const target = cfg.rotTarget || { page: true, image: true };
      const pageStep90 = Math.round(rotPage / 90);
      const imgStep90 = Math.round(rotImg / 90);
      const isPageRot90 = (Math.abs(pageStep90) % 2 === 1);
      const isImgRot90 = (Math.abs(imgStep90) % 2 === 1);
      // rot는 슬라이더 및 UI 라벨 표시용 대표 각도 (선택된 타겟 기준)
      const rot = target.image ? rotImg : (target.page ? rotPage : 0);
      return { rot, rotPage, rotImg, isPageRot90, isImgRot90, target };
    }

    // 사다리꼴 변형 상단/하단 확장량 해석 헬퍼 함수 (상단과 하단이 독립적으로 유지·확장)
    function resolveTrapezoidExpands(trapezoid, dw, scalePxX = 1) {
      let topExp = 0, botExp = 0;
      if (typeof trapezoid === 'object' && trapezoid !== null) {
        topExp = (trapezoid.top || 0) * scalePxX;
        botExp = (trapezoid.bot || 0) * scalePxX;
      } else if (typeof trapezoid === 'number' && trapezoid !== 0) {
        if (trapezoid > 0) {
          topExp = dw * trapezoid;
        } else {
          botExp = dw * Math.abs(trapezoid);
        }
      }
      return { topExp, botExp };
    }

    // [핵심] 사다리꼴 변형 (상단 폭 / 하단 폭 독립적 확장 지원)
    function drawImageWithTrapezoid(ctx, imgSource, dx, dy, dw, dh, trapezoid) {
      const srcW = imgSource.naturalWidth || imgSource.width || dw;
      const srcH = imgSource.naturalHeight || imgSource.height || dh;
      const scalePxX = dw / srcW;
      const { topExp, botExp } = resolveTrapezoidExpands(trapezoid, dw, scalePxX);

      if (topExp === 0 && botExp === 0) {
        ctx.drawImage(imgSource, dx, dy, dw, dh);
        return;
      }
      const slices = 60;
      const sliceSrcH = srcH / slices;
      const sliceDstH = dh / slices;

      const topW = dw + topExp;
      const botW = dw + botExp;

      for (let i = 0; i < slices; i++) {
        const t = i / (slices - 1); // 0 (상단) ~ 1 (하단)
        const curW = topW * (1 - t) + botW * t;
        const curX = dx + (dw - curW) / 2;
        const curY = dy + i * sliceDstH;

        ctx.drawImage(
          imgSource,
          0, i * sliceSrcH, srcW, sliceSrcH,
          curX, curY, curW, sliceDstH + 0.5
        );
      }
    }

    // [핵심] 사각 투시 변환(Perspective Warp / 4-Corner Pinning) 12x12 메쉬 아핀 매핑 렌더링
    function drawPerspectiveQuad(ctx, imgSource, dx, dy, dw, dh, corners, trapezoid) {
      const srcW = imgSource.naturalWidth || imgSource.width || dw;
      const srcH = imgSource.naturalHeight || imgSource.height || dh;
      const scalePxX = dw / srcW;
      const scalePxY = dh / srcH;
      const { topExp, botExp } = resolveTrapezoidExpands(trapezoid, dw, scalePxX);

      const c = corners || { tl: { x: 0, y: 0 }, tr: { x: 0, y: 0 }, br: { x: 0, y: 0 }, bl: { x: 0, y: 0 } };
      const isZeroCorners = (!c.tl || (c.tl.x === 0 && c.tl.y === 0 && c.tr.x === 0 && c.tr.y === 0 && c.br.x === 0 && c.br.y === 0 && c.bl.x === 0 && c.bl.y === 0));

      if (isZeroCorners && topExp === 0 && botExp === 0) {
        ctx.drawImage(imgSource, dx, dy, dw, dh);
        return;
      }
      if (isZeroCorners && (topExp !== 0 || botExp !== 0)) {
        drawImageWithTrapezoid(ctx, imgSource, dx, dy, dw, dh, trapezoid);
        return;
      }

      // 사다리꼴 오프셋 계산 (상단 및 하단 각각 독립적 좌우 확장)
      const trapTopOffset = topExp / 2;
      const trapBotOffset = botExp / 2;

      // 4개 코너 목적지 좌표 (dx, dy 기준 + 원본 픽셀 단위 1:1 오프셋 매핑)
      const pTL = {
        x: dx - trapTopOffset + ((c.tl?.x || 0) * scalePxX),
        y: dy + ((c.tl?.y || 0) * scalePxY)
      };
      const pTR = {
        x: dx + dw + trapTopOffset + ((c.tr?.x || 0) * scalePxX),
        y: dy + ((c.tr?.y || 0) * scalePxY)
      };
      const pBR = {
        x: dx + dw + trapBotOffset + ((c.br?.x || 0) * scalePxX),
        y: dy + dh + ((c.br?.y || 0) * scalePxY)
      };
      const pBL = {
        x: dx - trapBotOffset + ((c.bl?.x || 0) * scalePxX),
        y: dy + dh + ((c.bl?.y || 0) * scalePxY)
      };

      const gridX = 12;
      const gridY = 12;

      function getDestPoint(u, v) {
        const invU = 1 - u;
        const invV = 1 - v;
        return {
          x: invU * invV * pTL.x + u * invV * pTR.x + u * v * pBR.x + invU * v * pBL.x,
          y: invU * invV * pTL.y + u * invV * pTR.y + u * v * pBR.y + invU * v * pBL.y
        };
      }

      function renderTriangle(s0, s1, s2, d0, d1, d2) {
        const denom = (s0.x - s2.x) * (s1.y - s2.y) - (s1.x - s2.x) * (s0.y - s2.y);
        if (Math.abs(denom) < 1e-8) return;

        const a = ((d0.x - d2.x) * (s1.y - s2.y) - (d1.x - d2.x) * (s0.y - s2.y)) / denom;
        const b = ((d0.y - d2.y) * (s1.y - s2.y) - (d1.y - d2.y) * (s0.y - s2.y)) / denom;
        const cMat = ((s0.x - s2.x) * (d1.x - d2.x) - (s1.x - s2.x) * (d0.x - d2.x)) / denom;
        const dMat = ((s0.x - s2.x) * (d1.y - d2.y) - (s1.x - s2.x) * (d0.y - d2.y)) / denom;
        const e = d0.x - a * s0.x - cMat * s0.y;
        const f = d0.y - b * s0.x - dMat * s0.y;

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(d0.x, d0.y);
        ctx.lineTo(d1.x, d1.y);
        ctx.lineTo(d2.x, d2.y);
        ctx.closePath();
        ctx.clip();
        ctx.transform(a, b, cMat, dMat, e, f);
        ctx.drawImage(imgSource, 0, 0, srcW, srcH);
        ctx.restore();
      }

      for (let gy = 0; gy < gridY; gy++) {
        const v0 = gy / gridY;
        const v1 = (gy + 1) / gridY;
        const sy0 = v0 * srcH;
        const sy1 = v1 * srcH;

        for (let gx = 0; gx < gridX; gx++) {
          const u0 = gx / gridX;
          const u1 = (gx + 1) / gridX;
          const sx0 = u0 * srcW;
          const sx1 = u1 * srcW;

          const dTL = getDestPoint(u0, v0);
          const dTR = getDestPoint(u1, v0);
          const dBR = getDestPoint(u1, v1);
          const dBL = getDestPoint(u0, v1);

          renderTriangle(
            { x: sx0, y: sy0 },
            { x: sx1, y: sy0 },
            { x: sx0, y: sy1 },
            dTL, dTR, dBL
          );

          renderTriangle(
            { x: sx1, y: sy0 },
            { x: sx1, y: sy1 },
            { x: sx0, y: sy1 },
            dTR, dBR, dBL
          );
        }
      }
    }

    // PDF 페이지의 비트맵 캔버스를 보장하여 이미지와 100% 동일한 편집 파이프라인(회전, 용지 맞춤, 대두/소두, 투시변환) 제공
    async function ensureItemCanvas(item) {
      if (!item) return null;
      if (item.type === 'image') return item.imgObj;
      if (item.type === 'pdf') {
        if (!item.imgObj) {
          const page = await item.doc.getPage(item.pageNum);
          const origVp = page.getViewport({ scale: 1.0 });
          item.width = origVp.width;
          item.height = origVp.height;
          // 고화질 2.0x 오프스크린 캔버스 렌더링
          const offCanvas = document.createElement('canvas');
          const vp = page.getViewport({ scale: 2.0 });
          offCanvas.width = vp.width;
          offCanvas.height = vp.height;
          const offCtx = offCanvas.getContext('2d');
          offCtx.fillStyle = '#ffffff';
          offCtx.fillRect(0, 0, vp.width, vp.height);
          await page.render({ canvasContext: offCtx, viewport: vp }).promise;
          item.imgObj = offCanvas;
        }
        return item.imgObj;
      }
      return null;
    }

    // [핵심] 바탕 용지(Paper) 규격/방향/여백 위에 내용물(Image)의 위치/회전/스케일/필터/투시변환을 합성하여 캔버스에 렌더링
    function drawPaperWithImage(canvas, item, cfg, options = {}) {
      if (!canvas || !item || !item.imgObj) return null;
      const ctx = canvas.getContext('2d');

      const { rotImg, isPageRot90, isImgRot90 } = getResolvedRotations(cfg);
      const rotRad = (rotImg * Math.PI) / 180;

      // 1. 이미지 자체 회전 적용 후 치수
      const origW = item.width || item.imgObj.width;
      const origH = item.height || item.imgObj.height;
      const rotImgW = isImgRot90 ? origH : origW;
      const rotImgH = isImgRot90 ? origW : origH;

      // 2. 용지(Paper) 규격 계산
      const isOrigLandscape = (origW > origH);
      const orientOpt = cfg.orient || 'auto';
      const baseLandscape = orientOpt === 'l' || (orientOpt === 'auto' && isOrigLandscape);
      const isLandscape = isPageRot90 ? !baseLandscape : baseLandscape;
      const marginPx = cfg.margin || 0;
      const sizeKey = cfg.pageSize || cfg.fit || 'original';

      // [핵심 무결성] 용지 규격은 페이지 회전(rotPage / isPageRot90)과 방향(orient)에 의해서만 결정되며
      // 내용물인 이미지 자체의 회전(rotImg)에 의해 바탕 용지가 회전되는 일이 원천 차단됩니다.
      const basePaperW = (isPageRot90 ? origH : origW) + marginPx * 2;
      const basePaperH = (isPageRot90 ? origW : origH) + marginPx * 2;
      const paper = resolvePaperGeometry(sizeKey, isLandscape, basePaperW, basePaperH, cfg.customW, cfg.customH);

      // 3. 대상 캔버스 해상도 결정
      let canvasW, canvasH;
      if (options.isThumbnail) {
        const baseW = 280;
        canvasW = baseW;
        canvasH = Math.max(40, Math.round(baseW / paper.ratio));
      } else {
        const baseDim = 1200;
        if (paper.ratio >= 1) {
          canvasW = baseDim;
          canvasH = Math.max(50, Math.round(baseDim / paper.ratio));
        } else {
          canvasH = baseDim;
          canvasW = Math.max(50, Math.round(baseDim * paper.ratio));
        }
      }

      canvas.width = canvasW;
      canvas.height = canvasH;

      // 4. 종이 바탕 그리기
      const isTransparent = ((cfg.format || 'png') === 'png') && (cfg.transparentBg !== false);
      if (isTransparent) {
        ctx.clearRect(0, 0, canvasW, canvasH);
      } else {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvasW, canvasH);
      }

      // 5. 여백 및 내부 영역 계산
      const scaleFactor = canvasW / paper.widthPx;
      const viewMargin = Math.round(marginPx * scaleFactor);
      const innerW = Math.max(10, canvasW - (viewMargin * 2));
      const innerH = Math.max(10, canvasH - (viewMargin * 2));

      // 6. 이미지 맞춤 및 편집 배율/오프셋 계산
      const fitScale = Math.min(innerW / rotImgW, innerH / rotImgH);
      const baseDrawW = rotImgW * fitScale;
      const baseDrawH = rotImgH * fitScale;

      const cScale = cfg.contentScale || 1.0;
      const scaleX = cfg.scaleX !== undefined ? cfg.scaleX : 1.0;
      const finalW = baseDrawW * cScale * scaleX;
      const finalH = baseDrawH * cScale;

      const shiftX = canvasW * ((cfg.offsetX || 0) / 100);
      const shiftY = canvasH * ((cfg.offsetY || 0) / 100);
      const posX = (canvasW - finalW) / 2 + shiftX;
      const posY = (canvasH - finalH) / 2 + shiftY;

      // 7. 클리핑 및 이미지 그리기
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, canvasW, canvasH);
      ctx.clip();

      const brightness = cfg.brightness !== undefined ? cfg.brightness : 100;
      const contrast = cfg.contrast !== undefined ? cfg.contrast : 100;
      if (brightness !== 100 || contrast !== 100) {
        ctx.filter = `brightness(${brightness}%) contrast(${contrast}%)`;
      }

      ctx.translate(posX + finalW / 2, posY + finalH / 2);
      ctx.rotate(rotRad);

      const origDrawW = isImgRot90 ? (baseDrawH * cScale) : (baseDrawW * cScale * scaleX);
      const origDrawH = isImgRot90 ? (baseDrawW * cScale * scaleX) : (baseDrawH * cScale);
      drawPerspectiveQuad(ctx, item.imgObj, -origDrawW / 2, -origDrawH / 2, origDrawW, origDrawH, cfg.corners, cfg.trapExp || cfg.trapezoid);
      ctx.restore();

      return paper;
    }

    // PDF 페이지를 주어진 배율과 임의 각도(미세 회전 포함)로 캔버스에 정밀 렌더링
    async function renderPdfPageToCanvas(page, scale, rotImg, targetCanvas) {
      const base90 = ((Math.round(rotImg / 90) * 90) % 360 + 360) % 360;
      const fineAngle = rotImg - Math.round(rotImg / 90) * 90;
      const vp = page.getViewport({ scale: scale, rotation: base90 });

      targetCanvas.width = vp.width;
      targetCanvas.height = vp.height;
      const ctx = targetCanvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, vp.width, vp.height);

      if (fineAngle === 0) {
        await page.render({ canvasContext: ctx, viewport: vp }).promise;
      } else {
        const offCanvas = document.createElement('canvas');
        offCanvas.width = vp.width;
        offCanvas.height = vp.height;
        const offCtx = offCanvas.getContext('2d');
        offCtx.fillStyle = '#ffffff';
        offCtx.fillRect(0, 0, vp.width, vp.height);
        await page.render({ canvasContext: offCtx, viewport: vp }).promise;

        ctx.save();
        ctx.translate(vp.width / 2, vp.height / 2);
        ctx.rotate((fineAngle * Math.PI) / 180);
        ctx.drawImage(offCanvas, -vp.width / 2, -vp.height / 2);
        ctx.restore();
        offCanvas.width = 0; offCanvas.height = 0;
      }
      return vp;
    }

    // [통합] 현재 페이지 설정값 조회 (항상 해당 페이지의 고유 설정값 반환)
    function getEffectiveItemSettings(pageIndex) {
      const item = docState.items[pageIndex];
      if (!item) {
        return {
          ...docState.globalSettings,
          rotTarget: { ...docState.globalSettings.rotTarget }
        };
      }
      if (!item.settings) {
        item.settings = {
          ...docState.globalSettings,
          rotTarget: { ...docState.globalSettings.rotTarget }
        };
      }
      if (item.settings.pageSize === undefined) item.settings.pageSize = item.settings.fit || docState.globalSettings.pageSize || 'original';
      if (item.settings.fit === undefined) item.settings.fit = item.settings.pageSize;
      if (item.settings.orient === undefined) item.settings.orient = docState.globalSettings.orient || 'auto';
      if (item.settings.scaleX === undefined) item.settings.scaleX = 1.0;
      if (item.settings.trapezoid === undefined) item.settings.trapezoid = 0;
      if (item.settings.brightness === undefined) item.settings.brightness = 100;
      if (item.settings.contrast === undefined) item.settings.contrast = 100;
      if (item.settings.offsetX === undefined) item.settings.offsetX = 0;
      if (item.settings.offsetY === undefined) item.settings.offsetY = 0;
      if (item.settings.transparentBg === undefined) item.settings.transparentBg = (docState.globalSettings.transparentBg !== undefined ? docState.globalSettings.transparentBg : true);
      if (item.settings.isPerspectiveActive === undefined) item.settings.isPerspectiveActive = false;
      if (!item.settings.trapExp) {
        item.settings.trapExp = { top: 0, bot: 0 };
      }
      if (!item.settings.corners) {
        item.settings.corners = {
          tl: { x: 0, y: 0 },
          tr: { x: 0, y: 0 },
          br: { x: 0, y: 0 },
          bl: { x: 0, y: 0 }
        };
      }
      return item.settings;
    }
    const getEffectivePdfSettings = getEffectiveItemSettings;
    const getEffectiveImgSettings = getEffectiveItemSettings;

    // 오른쪽 컨트롤 패널을 현재 선택된 페이지의 설정값으로 100% 실시간 동기화
    function syncControlsForCurrentPage() {
      const cur = docState.currentIndex;
      const cfg = getEffectiveItemSettings(cur);
      const curItem = docState.items[cur];

      // 1. 용지 규격 (fit or pageSize)
      const pageSizeVal = cfg.pageSize || cfg.fit || 'original';
      const selPageSize = document.getElementById('selPageSize');
      if (selPageSize) selPageSize.value = pageSizeVal;

      // 사용자 정의 크기 표시 여부
      const groupCustom = document.getElementById('groupCustomPx');
      if (groupCustom) groupCustom.style.display = pageSizeVal === 'custom' ? 'flex' : 'none';
      const txtCustomW = document.getElementById('txtCustomWidth');
      const txtCustomH = document.getElementById('txtCustomHeight');
      if (txtCustomW) txtCustomW.value = cfg.customW || 1920;
      if (txtCustomH) txtCustomH.value = cfg.customH || 1080;

      // 2. 용지 방향
      const selOrient = document.getElementById('selOrientation');
      if (selOrient) selOrient.value = cfg.orient || 'auto';

      // 3. 여백 설정: PDF 원본 페이지인 경우 여백이 고정되므로 비활성화 안내
      const selMargin = document.getElementById('selMargin');
      const lblMargin = document.getElementById('lblMargin');
      if (selMargin) {
        if (curItem && curItem.type === 'pdf') {
          selMargin.disabled = true;
          selMargin.value = '0';
          if (lblMargin) lblMargin.title = 'PDF 원본 페이지는 문서 고유 여백이 유지됩니다.';
        } else {
          selMargin.disabled = false;
          selMargin.value = String(cfg.margin !== undefined ? cfg.margin : 0);
          if (lblMargin) lblMargin.title = '';
        }
      }

      // 4. 해상도 / 화질
      const scaleVal = parseFloat(cfg.scale) || (cfg.quality === 'standard' ? 1.5 : cfg.quality === 'high' ? 2.0 : 3.0);
      const selScale = document.getElementById('selScale');
      if (selScale) {
        let matched = false;
        for (let i = 0; i < selScale.options.length; i++) {
          if (Math.abs(parseFloat(selScale.options[i].value) - scaleVal) < 0.05) {
            selScale.selectedIndex = i;
            matched = true;
            break;
          }
        }
        if (!matched) selScale.value = "3.0";
      }

      // 5. 출력 포맷
      const selFormat = document.getElementById('selFormat');
      if (selFormat) selFormat.value = cfg.format || 'png';
      syncTransparentBgVisibility();

      // 6. 회전 타겟 및 슬라이더 동기화
      const target = cfg.rotTarget || { page: true, image: true };
      const chkPage = document.getElementById('chkRotPage');
      const chkImg = document.getElementById('chkRotImg');
      if (chkPage) chkPage.checked = Boolean(target.page);
      if (chkImg) chkImg.checked = Boolean(target.image);

      const sliderRot = document.getElementById('sliderRotation');
      if (sliderRot) sliderRot.value = cfg.rot || 0;
      const lblRot = document.getElementById('lblRotationVal');
      if (lblRot) lblRot.textContent = `${cfg.rot || 0}°`;

      // 7. 투시 변환 활성화 여부 동기화 (페이지별 독립 유지)
      syncPerspectiveUI(Boolean(cfg.isPerspectiveActive));
    }

    // PNG 포맷 선택 시에만 [배경 투명화] 체크박스 동적 노출/숨김 (가운데 툴바 및 우측/모바일 패널 동시 지원)
    function syncTransparentBgVisibility() {
      const cur = docState.currentIndex;
      const cfg = getEffectiveItemSettings(cur);
      const isPng = (cfg.format || 'png') === 'png';
      const isTrans = cfg.transparentBg !== false;

      // 1. 가운데 메인 뷰어 툴바 체크박스 (데스크톱)
      const wrap = document.getElementById('chkTransparentBgWrap');
      const chk = document.getElementById('chkTransparentBg');
      if (wrap) wrap.style.display = isPng ? 'inline-flex' : 'none';
      if (chk) chk.checked = isTrans;

      // 2. 우측/모바일 컨트롤 패널 체크박스
      const grpControl = document.getElementById('grpTransparentBgControl');
      const chkControl = document.getElementById('chkTransparentBgControl');
      if (grpControl) grpControl.style.display = isPng ? 'flex' : 'none';
      if (chkControl) chkControl.checked = isTrans;
    }

    // [배경 투명화] 체크박스 변경 핸들러 (데스크톱 툴바와 모바일 패널 양방향 동기화)
    async function onTransparentBgChange(checked) {
      const cur = docState.currentIndex;
      const cfg = getEffectiveItemSettings(cur);
      cfg.transparentBg = Boolean(checked);

      const chk = document.getElementById('chkTransparentBg');
      const chkControl = document.getElementById('chkTransparentBgControl');
      if (chk) chk.checked = cfg.transparentBg;
      if (chkControl) chkControl.checked = cfg.transparentBg;

      await renderMainViewerCanvas(cur);
      updateThumbnailCanvas(cur);
      updateMiniPreview();
    }

    // 회전 대상(페이지 vs 이미지) 체크박스 변경 핸들러
    // [핵심 원칙] 체크박스는 회전 제어 타겟(Target Selector)일 뿐이며,
    // 체크를 해제하더라도 이미 적용된 회전 각도는 절대 초기화되지 않고 온전히 보존됩니다.
    async function onRotTargetChange() {
      const chkPage = document.getElementById('chkRotPage');
      const chkImg = document.getElementById('chkRotImg');
      const pageChecked = Boolean(chkPage && chkPage.checked);
      const imgChecked = Boolean(chkImg && chkImg.checked);

      const cur = docState.currentIndex;
      const cfg = getEffectiveItemSettings(cur);
      cfg.rotTarget = { page: pageChecked, image: imgChecked };

      // 슬라이더 및 라벨 표시만 현재 선택된 타겟의 값으로 동기화
      const { rot } = getResolvedRotations(cfg);
      const slider = document.getElementById('sliderRotation');
      if (slider) slider.value = rot;
      const lblRot = document.getElementById('lblRotationVal');
      if (lblRot) lblRot.textContent = `${rot}°`;

      // 미니 프리뷰 상태 텍스트 업데이트
      updateMiniPreview();
    }

    // 오른쪽 설정 변경 리스너: 현재 보고 있는 페이지에 즉시 저장 및 좌/중/우 3개 창 동시 실시간 반영!
    async function onSettingChange(key, value) {
      const cur = docState.currentIndex;
      const cfg = getEffectiveItemSettings(cur);

      if (key === 'pageSize' || key === 'fit') {
        cfg.pageSize = value;
        cfg.fit = value;
        const groupCustom = document.getElementById('groupCustomPx');
        if (groupCustom) groupCustom.style.display = value === 'custom' ? 'flex' : 'none';
      } else if (key === 'scale' || key === 'quality') {
        const numScale = parseFloat(value) || 3.0;
        cfg.scale = numScale;
        cfg.quality = numScale >= 3.0 ? 'ultra' : numScale >= 2.0 ? 'high' : 'standard';
      } else if (key === 'rot' || key === 'rot_updated') {
        const num = parseInt(value, 10) || 0;
        if (key === 'rot') {
          const target = cfg.rotTarget || { page: true, image: true };
          if (target.page) cfg.rotPage = num;
          if (target.image) cfg.rotImg = num;
        }
        cfg.rot = num;
        const lblRot = document.getElementById('lblRotationVal');
        if (lblRot) lblRot.textContent = `${num}°`;
      } else if (key === 'orient') {
        cfg.orient = value;
      } else if (key === 'margin') {
        cfg.margin = parseInt(value, 10) || 0;
      } else if (key === 'format') {
        cfg.format = value;
        syncTransparentBgVisibility();
      } else if (key === 'customW') {
        cfg.customW = parseInt(value, 10) || 1920;
      } else if (key === 'customH') {
        cfg.customH = parseInt(value, 10) || 1080;
      }

      await renderMainViewerCanvas(cur);
      updateThumbnailCanvas(cur);
      updateMiniPreview();
    }

    // 개별 페이지 썸네일 캔버스 고해상도 실시간 갱신 (용지 규격 + 여백 + 회전 + 맞춤 비율 즉각 반영)
    async function updateThumbnailCanvas(index) {
      const item = docState.items[index];
      if (!item) return;
      const canvas = document.getElementById(`thumb-canvas-${index}`);
      if (!canvas) return;
      const cfg = getEffectiveItemSettings(index);

      if (item.type === 'pdf') {
        await ensureItemCanvas(item);
      }
      canvas.style.filter = 'none';
      canvas.style.transform = 'none';
      drawPaperWithImage(canvas, item, cfg, { isThumbnail: true });
      const wrap = canvas.closest('.thumb-canvas-wrap');
      const isTransparent = ((cfg.format || 'png') === 'png') && (cfg.transparentBg !== false);
      if (wrap) wrap.classList.toggle('checkerboard-bg', isTransparent);
    }

    // 슬라이더 바 직접 드래그 시 선택된 타겟(페이지 및/또는 이미지)에 각도 즉시 독립 적용
    function onSliderRotationInput(val) {
      const num = parseInt(val, 10) || 0;
      const cur = docState.currentIndex;
      const cfg = getEffectiveItemSettings(cur);
      const target = cfg.rotTarget || { page: true, image: true };

      if (!target.page && !target.image) return;

      if (target.page) cfg.rotPage = num;
      if (target.image) cfg.rotImg = num;
      cfg.rot = num;

      const lblRot = document.getElementById('lblRotationVal');
      if (lblRot) lblRot.textContent = `${num}°`;

      onSettingChange('rot_updated', num);
    }

    // 회전 각도 퀵 조절 유틸리티 (-90°, 0° 초기화, +90°)
    function rotateCurrentByDelta(delta) {
      const cur = docState.currentIndex;
      const cfg = getEffectiveItemSettings(cur);
      const target = cfg.rotTarget || { page: true, image: true };

      if (!target.page && !target.image) return;

      if (target.page) {
        let curPage = parseInt(cfg.rotPage !== undefined ? cfg.rotPage : (cfg.rot || 0), 10) || 0;
        let nextPage = curPage + delta;
        if (nextPage > 180) nextPage -= 360;
        if (nextPage < -180) nextPage += 360;
        cfg.rotPage = nextPage;
      }
      if (target.image) {
        let curImg = parseInt(cfg.rotImg !== undefined ? cfg.rotImg : (cfg.rot || 0), 10) || 0;
        let nextImg = curImg + delta;
        if (nextImg > 180) nextImg -= 360;
        if (nextImg < -180) nextImg += 360;
        cfg.rotImg = nextImg;
      }

      const { rot } = getResolvedRotations(cfg);
      cfg.rot = rot;
      const slider = document.getElementById('sliderRotation');
      if (slider) slider.value = rot;
      const lblRot = document.getElementById('lblRotationVal');
      if (lblRot) lblRot.textContent = `${rot}°`;

      onSettingChange('rot_updated', rot);
    }

    // 0° 초기화 버튼: 오직 사용자가 초기화 버튼을 눌렀을 때만 선택된 대상을 0으로 리셋
    function rotateCurrentTo(val) {
      const cur = docState.currentIndex;
      const cfg = getEffectiveItemSettings(cur);
      const target = cfg.rotTarget || { page: true, image: true };

      if (target.page) cfg.rotPage = val;
      if (target.image) cfg.rotImg = val;

      const { rot } = getResolvedRotations(cfg);
      cfg.rot = rot;
      const slider = document.getElementById('sliderRotation');
      if (slider) slider.value = rot;
      const lblRot = document.getElementById('lblRotationVal');
      if (lblRot) lblRot.textContent = `${rot}°`;

      onSettingChange('rot_updated', rot);
    }

    function onGlobalPageSizeChange(val) {
      const grp = document.getElementById('groupGlobalCustomPx');
      if (grp) grp.style.display = val === 'custom' ? 'flex' : 'none';
    }

    function onGlobalFormatChange(val) {
      const grp = document.getElementById('grpGlobalTransparentBg');
      if (grp) grp.style.display = val === 'png' ? 'flex' : 'none';
    }

    // 삼선 햄버거 메뉴 ➡️ [기본 페이지 설정] 모달 제어 함수
    // 오른쪽 제어창의 5개 설정 항목과 100% 동일한 순서·명칭·옵션으로 연동
    function openGlobalSettingsModal() {
      menuDropdown.classList.remove('show');

      const g = docState.globalSettings;

      // 1. 용지 규격
      const selSize = document.getElementById('selGlobalPageSize');
      const pageSizeVal = g.pageSize || g.fit || 'original';
      if (selSize) selSize.value = pageSizeVal;
      onGlobalPageSizeChange(pageSizeVal);

      const txtW = document.getElementById('txtGlobalCustomWidth');
      const txtH = document.getElementById('txtGlobalCustomHeight');
      if (txtW) txtW.value = g.customW || 1920;
      if (txtH) txtH.value = g.customH || 1080;

      // 2. 용지 방향
      const selOrient = document.getElementById('selGlobalOrientation');
      if (selOrient) selOrient.value = g.orient || 'auto';

      // 3. 여백 설정
      const selMargin = document.getElementById('selGlobalMargin');
      if (selMargin) selMargin.value = String(g.margin !== undefined ? g.margin : 0);

      // 4. 해상도 / 화질
      const scaleVal = parseFloat(g.scale) || 3.0;
      const selScale = document.getElementById('selGlobalScale');
      if (selScale) {
        let matched = false;
        for (let i = 0; i < selScale.options.length; i++) {
          if (Math.abs(parseFloat(selScale.options[i].value) - scaleVal) < 0.05) {
            selScale.selectedIndex = i;
            matched = true;
            break;
          }
        }
        if (!matched) selScale.value = "3.0";
      }

      // 5. 출력 포맷 (이미지 저장 시)
      const fmtVal = g.format || 'png';
      const selFmt = document.getElementById('selGlobalFormat');
      if (selFmt) selFmt.value = fmtVal;
      onGlobalFormatChange(fmtVal);

      const chkTrans = document.getElementById('chkGlobalTransparentBg');
      if (chkTrans) chkTrans.checked = g.transparentBg !== false;

      document.getElementById('modalGlobalSettings').classList.add('show');
      try { history.pushState({ appLayer: 'globalSettings' }, ''); } catch (e) {}
    }

    let isClosingLayerProgrammatically = false;

    function closeGlobalSettingsModal(syncHistory = true) {
      const modal = document.getElementById('modalGlobalSettings');
      if (modal && modal.classList.contains('show')) {
        modal.classList.remove('show');
        if (syncHistory && history.state && (history.state.appLayer === 'globalSettings' || history.state.modal === 'globalSettings')) {
          isClosingLayerProgrammatically = true;
          history.back();
        }
      }
    }

    function onModalBackdropClick(e) {
      if (e.target.id === 'modalGlobalSettings') {
        closeGlobalSettingsModal(true);
      }
    }

    // 기본 페이지 설정 적용: 일괄 적용 체크 시 열린 모든 페이지에 5대 설정 전면 반영
    async function applyGlobalSettingsModal() {
      const applyAll = document.getElementById('chkApplyToAllPages').checked;

      const pageSizeVal = document.getElementById('selGlobalPageSize').value;
      const customWVal = parseInt(document.getElementById('txtGlobalCustomWidth').value, 10) || 1920;
      const customHVal = parseInt(document.getElementById('txtGlobalCustomHeight').value, 10) || 1080;
      const orientVal = document.getElementById('selGlobalOrientation').value;
      const marginVal = parseInt(document.getElementById('selGlobalMargin').value, 10) || 0;
      const scaleVal = parseFloat(document.getElementById('selGlobalScale').value) || 3.0;
      const qualityVal = scaleVal >= 3.0 ? 'ultra' : (scaleVal >= 2.0 ? 'high' : 'standard');
      const formatVal = document.getElementById('selGlobalFormat').value;
      const chkTrans = document.getElementById('chkGlobalTransparentBg');
      const transparentVal = chkTrans ? chkTrans.checked : true;

      // docState.globalSettings에 최신 기본값 저장
      docState.globalSettings.pageSize = pageSizeVal;
      docState.globalSettings.fit = pageSizeVal;
      docState.globalSettings.customW = customWVal;
      docState.globalSettings.customH = customHVal;
      docState.globalSettings.orient = orientVal;
      docState.globalSettings.margin = marginVal;
      docState.globalSettings.scale = scaleVal;
      docState.globalSettings.quality = qualityVal;
      docState.globalSettings.format = formatVal;
      docState.globalSettings.transparentBg = transparentVal;

      if (applyAll && docState.items.length > 0) {
        for (let i = 0; i < docState.items.length; i++) {
          if (!docState.items[i].settings) {
            docState.items[i].settings = { ...docState.globalSettings, rotTarget: { ...docState.globalSettings.rotTarget } };
          } else {
            const s = docState.items[i].settings;
            s.pageSize = pageSizeVal;
            s.fit = pageSizeVal;
            s.customW = customWVal;
            s.customH = customHVal;
            s.orient = orientVal;
            s.margin = marginVal;
            s.scale = scaleVal;
            s.quality = qualityVal;
            s.format = formatVal;
            s.transparentBg = transparentVal;
          }
        }
        await renderThumbnailList();
        loadMainViewer(docState.currentIndex);
      } else {
        syncControlsForCurrentPage();
        const cur = docState.currentIndex;
        await renderMainViewerCanvas(cur);
        updateThumbnailCanvas(cur);
        updateMiniPreview();
      }

      closeGlobalSettingsModal();
      syncControlsForCurrentPage();
      updateMiniPreview();
    }

    // 햄버거 메뉴 토글
    const btnHamburger = document.getElementById('btnHamburger');
    const menuDropdown = document.getElementById('menuDropdown');

    function closeMenuDropdown() {
      if (menuDropdown && menuDropdown.classList.contains('show')) {
        menuDropdown.classList.remove('show');
      }
    }

    btnHamburger.addEventListener('click', (e) => {
      e.stopPropagation();
      closeInsertDropdown();
      menuDropdown.classList.toggle('show');
    });

    // [+ 삽입] 드롭다운 메뉴 제어
    function toggleInsertDropdown(e) {
      if (e) e.stopPropagation();
      closeMenuDropdown();
      const menu = document.getElementById('menuInsertDropdown');
      if (menu) menu.classList.toggle('show');
    }

    function closeInsertDropdown() {
      const menu = document.getElementById('menuInsertDropdown');
      if (menu && menu.classList.contains('show')) {
        menu.classList.remove('show');
      }
    }

    function triggerInsertFileAction(e) {
      if (e) e.stopPropagation();
      closeInsertDropdown();
      const total = docState.items.length;
      const curIdx = docState.currentIndex;
      const insertAt = (total > 0 && curIdx >= 0 && curIdx < total) ? curIdx + 1 : -1;
      triggerInsertFileDialog(insertAt);
    }

    async function insertBlankPageAction(e) {
      if (e) e.stopPropagation();
      closeInsertDropdown();

      const total = docState.items.length;
      const curIdx = docState.currentIndex;
      const insertAt = (total > 0 && curIdx >= 0 && curIdx < total) ? curIdx + 1 : total;

      const cfg = getEffectiveItemSettings(curIdx >= 0 ? curIdx : 0);
      const sizeKey = cfg.pageSize || cfg.fit || 'original';
      const orientOpt = cfg.orient || 'auto';
      const isLandscape = orientOpt === 'l';

      // 참조 크기 (original일 경우 현재 선택된 이미지 크기, 없으면 1200x1600)
      let refW = 1200, refH = 1600;
      if (total > 0 && curIdx >= 0 && docState.items[curIdx]) {
        refW = docState.items[curIdx].width || 1200;
        refH = docState.items[curIdx].height || 1600;
      }

      const paper = resolvePaperGeometry(sizeKey, isLandscape, refW, refH, cfg.customW, cfg.customH);
      const canvasW = Math.max(200, Math.min(2400, Math.round(paper.widthPx || 1200)));
      const canvasH = Math.max(200, Math.min(2400, Math.round(paper.heightPx || (canvasW / (paper.ratio || 1)))));

      // 순백색 캔버스 생성
      const blankCanvas = document.createElement('canvas');
      blankCanvas.width = canvasW;
      blankCanvas.height = canvasH;
      const bctx = blankCanvas.getContext('2d');
      bctx.fillStyle = '#ffffff';
      bctx.fillRect(0, 0, canvasW, canvasH);

      const dataUrl = blankCanvas.toDataURL('image/png');
      const imgObj = new Image();
      imgObj.src = dataUrl;
      await new Promise(r => { imgObj.onload = r; });

      const newItemSettings = {
        pageSize: sizeKey,
        fit: sizeKey,
        quality: 'ultra',
        rot: 0,
        rotPage: 0,
        rotImg: 0,
        rotTarget: { page: true, image: true },
        contentScale: 1.0,
        scaleX: 1.0,
        trapezoid: 0,
        brightness: 100,
        contrast: 100,
        offsetX: 0,
        offsetY: 0,
        orient: orientOpt,
        margin: cfg.margin || 0,
        format: cfg.format || 'png',

    async function triggerPrint() {
      closeMenuDropdown();

      // 선택된 페이지/이미지 인덱스 추출 (유효한 아이템만 엄격 필터링)
      const selectedIndices = [];
      if (docState.items.length === 0) {
        alert('인쇄할 문서 또는 이미지가 없습니다.');
        return;
      }
      docState.checkList.forEach((chk, i) => { if (chk && docState.items[i]) selectedIndices.push(i); });

      if (selectedIndices.length === 0) {
        alert('인쇄할 페이지(항목)를 1개 이상 선택해 주세요.');
        return;
      }

      const printContainer = document.getElementById('printContainer');
      printContainer.innerHTML = '';
      let printStyleEl = document.getElementById('printPageStyles');
      if (!printStyleEl) {
        printStyleEl = document.createElement('style');
        printStyleEl.id = 'printPageStyles';
        document.head.appendChild(printStyleEl);
      }
      printStyleEl.textContent = '';
      let printPageSeq = 0;
      document.getElementById('statusText').textContent = `인쇄 데이터 준비 중 (${selectedIndices.length}페이지)...`;

      try {
        for (let step = 0; step < selectedIndices.length; step++) {
          const pageIndex = selectedIndices[step];
          const p = docState.items[pageIndex];
          if (!p) continue;
          const cfg = getEffectiveItemSettings(pageIndex);
          const cScale = cfg.contentScale || 1.0;
          const { rotImg, isPageRot90, isImgRot90 } = getResolvedRotations(cfg);

          const tempCanvas = document.createElement('canvas');
          let origW = 0, origH = 0;
          let baseScaleW = 0, baseScaleH = 0;

          if (p.type === 'pdf') {
            const page = await p.doc.getPage(p.pageNum);
            const vp = await renderPdfPageToCanvas(page, 3.0, rotImg, tempCanvas);

            const origVp = page.getViewport({ scale: 1.0, rotation: 0 });
            origW = origVp.width;
            origH = origVp.height;
            baseScaleW = vp.width;
            baseScaleH = vp.height;
          } else {
            const rotRad = (rotImg * Math.PI) / 180;
            const srcRotW = isImgRot90 ? p.height : p.width;
            const srcRotH = isImgRot90 ? p.width : p.height;
            tempCanvas.width = srcRotW;
            tempCanvas.height = srcRotH;
            const tctx = tempCanvas.getContext('2d');
            tctx.fillStyle = '#ffffff';
            tctx.fillRect(0, 0, srcRotW, srcRotH);
            tctx.translate(srcRotW / 2, srcRotH / 2);
            tctx.rotate(rotRad);
            tctx.drawImage(p.imgObj, -p.width / 2, -p.height / 2);

            origW = p.width;
            origH = p.height;
            baseScaleW = srcRotW;
            baseScaleH = srcRotH;
          }

          const imgF = (p.type === 'pdf') ? 1 : getImagePageFactor(origW, origH);
          const baseOrigW = isPageRot90 ? origH : origW;
          const baseOrigH = isPageRot90 ? origW : origH;
          const scaleMul = (p.type === 'pdf') ? 3.0 : imgF;
          const refW = baseOrigW * scaleMul, refH = baseOrigH * scaleMul;
          const isOrigLandscape = origW > origH;
          const orientOpt = cfg.orient || 'auto';
          const baseLandscape = orientOpt === 'l' || (orientOpt === 'auto' && isOrigLandscape);
          const isLandscape = isPageRot90 ? !baseLandscape : baseLandscape;
          const paper = resolvePaperGeometry(cfg.fit || cfg.pageSize || 'original', isLandscape, refW, refH, cfg.customW, cfg.customH);

          let paperW, paperH;
          if (cfg.fit === 'original' || cfg.pageSize === 'original') {
            paperW = baseOrigW * scaleMul;
            paperH = baseOrigH * scaleMul;
          } else if (cfg.fit === 'custom' || cfg.pageSize === 'custom') {
            paperW = paper.widthPx;
            paperH = paper.heightPx;
          } else {
            if (paper.isLandscape) {
              paperW = Math.max(refW, Math.round(refH * paper.ratio));
              paperH = Math.round(paperW / paper.ratio);
            } else {
              paperH = Math.max(refH, Math.round(refW / paper.ratio));
              paperW = Math.round(paperH * paper.ratio);
            }
          }

          let finalCanvas = document.createElement('canvas');
          let fctx = finalCanvas.getContext('2d');
          finalCanvas.width = paperW;
          finalCanvas.height = paperH;
          fctx.fillStyle = '#ffffff';
          fctx.fillRect(0, 0, paperW, paperH);

          const scaleX = cfg.scaleX !== undefined ? cfg.scaleX : 1.0;
          const brightness = cfg.brightness !== undefined ? cfg.brightness : 100;
          const contrast = cfg.contrast !== undefined ? cfg.contrast : 100;
          const offsetX = cfg.offsetX !== undefined ? cfg.offsetX : 0;
          const offsetY = cfg.offsetY !== undefined ? cfg.offsetY : 0;

          const baseScale = Math.min(paperW / baseScaleW, paperH / baseScaleH);
          const drawW = baseScaleW * baseScale * cScale * scaleX;
          const drawH = baseScaleH * baseScale * cScale;
          const shiftX = paperW * (offsetX / 100);
          const shiftY = paperH * (offsetY / 100);
          const posX = (paperW - drawW) / 2 + shiftX;
          const posY = (paperH - drawH) / 2 + shiftY;

          fctx.save();
          fctx.beginPath();
          fctx.rect(0, 0, paperW, paperH);
          fctx.clip();
          if (brightness !== 100 || contrast !== 100) {
            fctx.filter = `brightness(${brightness}%) contrast(${contrast}%)`;
          }
          drawPerspectiveQuad(fctx, tempCanvas, posX, posY, drawW, drawH, cfg.corners, cfg.trapExp || cfg.trapezoid);
          fctx.restore();
          tempCanvas.width = 0; tempCanvas.height = 0;

          const pageItem = document.createElement('div');
          pageItem.className = 'print-page-item';
          {
            // 페이지별 고정 mm 용지 크기 지정 (vh 단위 오차로 인한 빈 페이지/축소 방지)
            const pgLong = 297;
            const cw = finalCanvas.width, ch = finalCanvas.height;
            const pgW = cw >= ch ? pgLong : Math.round(pgLong * cw / ch * 100) / 100;
            const pgH = cw >= ch ? Math.round(pgLong * ch / cw * 100) / 100 : pgLong;
            const pgName = 'pg' + printPageSeq++;
            printStyleEl.textContent += '@page ' + pgName + ' { size: ' + pgW + 'mm ' + pgH + 'mm; margin: 0; }\n';
            pageItem.style.page = pgName;
            pageItem.style.width = pgW + 'mm';
            pageItem.style.height = pgH + 'mm';
            pageItem.style.overflow = 'hidden';
            finalCanvas.style.width = '100%';
            finalCanvas.style.height = '100%';
            finalCanvas.style.maxWidth = 'none';
            finalCanvas.style.maxHeight = 'none';
          }
          finalCanvas.className = 'print-page-canvas';
          pageItem.appendChild(finalCanvas);
          printContainer.appendChild(pageItem);
        }

        document.getElementById('statusText').textContent = '인쇄 대화상자 호출 중...';
        await new Promise(r => setTimeout(r, 100)); // DOM 렌더링 완료 대기

        window.print();

        // 인쇄창이 닫힌 후 메모리 해제
        setTimeout(() => {
          printContainer.innerHTML = '';
          printStyleEl.textContent = '';
          document.getElementById('statusText').textContent = '준비 완료';
        }, 1000);

      } catch (err) {
        console.error(err);
        alert(`인쇄 처리 중 오류: ${err.message}`);
        printContainer.innerHTML = '';
        document.getElementById('statusText').textContent = '인쇄 오류 발생';
      }
    }

    // 커스텀 바이너리 인코더
    const CustomEncoders = {
      canvasToBMP(ctx, w, h) {
        const imgData = ctx.getImageData(0, 0, w, h).data;
        const rowSize = Math.floor((24 * w + 31) / 32) * 4;
        const pixelArraySize = rowSize * h;
        const buffer = new ArrayBuffer(54 + pixelArraySize);
        const view = new DataView(buffer);

        view.setUint16(0, 0x424D, false); // 'B', 'M'
        view.setUint32(2, 54 + pixelArraySize, true);
        view.setUint32(10, 54, true);

        view.setUint32(14, 40, true);
        view.setInt32(18, w, true);
        view.setInt32(22, h, true);
        view.setUint16(26, 1, true);
        view.setUint16(28, 24, true);
        view.setUint32(34, pixelArraySize, true);

        let offset = 54;
        for (let y = h - 1; y >= 0; y--) {
          for (let x = 0; x < w; x++) {
            const idx = (y * w + x) * 4;
            view.setUint8(offset++, imgData[idx + 2]);
            view.setUint8(offset++, imgData[idx + 1]);
            view.setUint8(offset++, imgData[idx]);
          }
          while ((offset - 54) % 4 !== 0) view.setUint8(offset++, 0);
        }
        return new Blob([buffer], { type: 'image/bmp' });
      },

      async canvasToICO(canvas) {
        const size = Math.min(256, Math.max(canvas.width, canvas.height));
        const icoCanvas = document.createElement('canvas');
        icoCanvas.width = size;
        icoCanvas.height = size;
        const ictx = icoCanvas.getContext('2d');
        ictx.drawImage(canvas, 0, 0, size, size);

        const pngBlob = await new Promise(r => icoCanvas.toBlob(r, 'image/png'));
        const pngBuf = await pngBlob.arrayBuffer();

        const totalSize = 22 + pngBuf.byteLength;
        const icoBuffer = new ArrayBuffer(totalSize);
        const view = new DataView(icoBuffer);

        view.setUint16(0, 0, true);
        view.setUint16(2, 1, true);
        view.setUint16(4, 1, true);

        view.setUint8(6, size >= 256 ? 0 : size);
        view.setUint8(7, size >= 256 ? 0 : size);
        view.setUint8(8, 0);
        view.setUint8(9, 0);
        view.setUint16(10, 1, true);
        view.setUint16(12, 32, true);
        view.setUint32(14, pngBuf.byteLength, true);
        view.setUint32(18, 22, true);

        new Uint8Array(icoBuffer, 22).set(new Uint8Array(pngBuf));
        return new Blob([icoBuffer], { type: 'image/x-icon' });
      },

      canvasToTIFF(ctx, w, h) {
        const imgData = ctx.getImageData(0, 0, w, h).data;
        const tiffBytes = UTIF.encodeImage(imgData.buffer, w, h);
        return new Blob([tiffBytes], { type: 'image/tiff' });
      }
    };
