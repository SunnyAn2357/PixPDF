      }
    });

    // 통합 파일 처리기 (PDF & 이미지 구분 없이 섞어서 자유자재로 불러오기 및 삽입)
    async function processFiles(files, customInsertIndex = -1, targetArea = 'center-area') {
      initHistoryAnchor();
      if (!files || files.length === 0) return;

      const pdfFiles = files.filter(f => f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf'));
      const imgFiles = files.filter(f => f.type.startsWith('image/') || /\.(png|jpe?g|webp|bmp)$/i.test(f.name));

      if (pdfFiles.length === 0 && imgFiles.length === 0) return;

      const isFirstLoad = (docState.items.length === 0);
      let insertAt = customInsertIndex >= 0 ? customInsertIndex : (isFirstLoad ? 0 : docState.currentIndex + 1);

      // 1. PDF 파일 처리
      for (const pdfFile of pdfFiles) {
        document.getElementById('statusText').textContent = `${pdfFile.name} 로드 중...`;
        try {
          const arrayBuf = await pdfFile.arrayBuffer();
          const loadedDoc = await pdfjsLib.getDocument({ data: arrayBuf }).promise;
          const totalPages = loadedDoc.numPages;

          if (isFirstLoad && pdfFiles.length === 1 && imgFiles.length === 0) {
            // 최초 단일 PDF 로드 시: 전체 페이지를 기본 순서대로 등록
            docState.fileName = pdfFile.name.replace(/\.[^/.]+$/, "");
            const newPages = Array.from({ length: totalPages }, (_, i) => ({
              type: 'pdf',
              doc: loadedDoc,
              pageNum: i + 1,
              name: `${pdfFile.name} (p.${i + 1})`,
              settings: {
                ...docState.globalSettings,
                rotTarget: { ...docState.globalSettings.rotTarget }
              }
            }));
            docState.items.push(...newPages);
            docState.checkList.push(...new Array(totalPages).fill(true));
            docState.currentIndex = 0;
            document.getElementById('chkSelectAll').checked = true;
          } else if (totalPages === 1) {
            // 1페이지 PDF는 피커 없이 즉시 삽입!
            const newPage = {
              type: 'pdf',
              doc: loadedDoc,
              pageNum: 1,
              name: `${pdfFile.name} (p.1)`,
              settings: {
                ...docState.globalSettings,
                rotTarget: { ...docState.globalSettings.rotTarget }
              }
            };
            docState.items.splice(insertAt, 0, newPage);
            docState.checkList.splice(insertAt, 0, true);
            docState.currentIndex = insertAt;
            insertAt++;
          } else {
            // 다중 페이지 PDF 문서는 사용자가 필요한 페이지를 선택할 수 있도록 피커 모달 오픈
            openPdfPicker(loadedDoc, pdfFile, insertAt);
            return;
          }
        } catch (err) {
          console.error('PDF 로드 오류:', err);
          document.getElementById('statusText').textContent = 'PDF 문서를 읽을 수 없습니다.';
        }
      }

      // 2. 이미지 파일 처리
      if (imgFiles.length > 0) {
        document.getElementById('statusText').textContent = '이미지를 불러오는 중...';
        const newItems = [];
        for (const file of imgFiles) {
          try {
            const imgObj = await loadImageSafe(file);
            newItems.push({
              type: 'image',
              file: file,
              imgObj: imgObj,
              name: file.name,
              width: imgObj.width,
              height: imgObj.height,
              settings: {
                ...docState.globalSettings,
                rotTarget: { ...docState.globalSettings.rotTarget }
              }
            });
          } catch (err) {
            console.error('이미지 로드 오류:', file.name, err);
          }
        }

        if (newItems.length > 0) {
          if (docState.items.length === 0) {
            docState.fileName = imgFiles[0].name.replace(/\.[^/.]+$/, "");
            docState.items.push(...newItems);
            docState.checkList.push(...new Array(newItems.length).fill(true));
            docState.currentIndex = 0;
          } else {
            docState.items.splice(insertAt, 0, ...newItems);
            docState.checkList.splice(insertAt, 0, ...new Array(newItems.length).fill(true));
            docState.currentIndex = insertAt;
          }
        }
      }

      await refreshWorkspaceDisplay();
      if (docState.items.length > 0) {
        await loadMainViewer(docState.currentIndex);
        document.getElementById('statusText').textContent = `${docState.items.length}개 항목이 준비되었습니다.`;
      }
    }

    async function loadImageSafe(file) {
      if (typeof createImageBitmap === 'function') {
        try {
          const bmp = await createImageBitmap(file);
          return bmp;
        } catch (e) {
          console.warn('createImageBitmap failed, fallback to FileReader', e);
        }
      }
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = (err) => reject(err || new Error("이미지 로드 실패"));
          img.src = reader.result;
        };
        reader.onerror = (err) => reject(err || new Error("파일 읽기 실패"));
        reader.readAsDataURL(file);
      });
    }

    // 1열 PDF 썸네일 렌더링 (순서 변경, 개별 삭제, 드래그 드롭 위치 삽입 지원)
    // [통합] 1열 썸네일 렌더링 (순서 변경, 개별 삭제, 드래그 드롭 위치 삽입 지원)
    async function renderThumbnailList() {
      const container = document.getElementById('thumbList');
      container.innerHTML = '';
      if (docState.items.length === 0) {
        updateThumbCounts();
        return;
      }

      docState.items.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = `thumb-card ${idx === docState.currentIndex ? 'active' : ''}`;
        card.id = `thumb-card-${idx}`;
        card.draggable = true;
        card.onclick = (e) => {
          if (e.target.closest('input[type="checkbox"]') || e.target.closest('button')) return;
          loadMainViewer(idx);
          if (window.innerWidth <= 768) {
            toggleMobileControl(true);
          }
        };

        card.addEventListener('dragstart', (e) => {
          draggedCardIndex = idx;
          card.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', idx);
        });

        card.addEventListener('dragend', () => {
          card.classList.remove('dragging');
          clearThumbDropLines();
        });

        card.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.stopPropagation();
          const rect = card.getBoundingClientRect();
          const relY = e.clientY - rect.top;
          clearThumbDropLines();
          if (relY < rect.height / 2) {
            card.classList.add('drag-over-top');
          } else {
            card.classList.add('drag-over-bottom');
          }
        });

        card.addEventListener('dragleave', (e) => {
          e.stopPropagation();
          card.classList.remove('drag-over-top', 'drag-over-bottom');
        });

        // 카드 사이에 드롭 (새 파일 삽입 또는 순서 이동)
        card.addEventListener('drop', async (e) => {
          e.preventDefault();
          e.stopPropagation();
          const rect = card.getBoundingClientRect();
          const isTop = (e.clientY - rect.top) < rect.height / 2;
          let insertAt = isTop ? idx : idx + 1;
          clearThumbDropLines();

          if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
            await processFiles(Array.from(e.dataTransfer.files), insertAt, 'thumb-slot');
          } else if (draggedCardIndex !== null && draggedCardIndex !== idx) {
            const movedItem = docState.items.splice(draggedCardIndex, 1)[0];
            const movedChk = docState.checkList.splice(draggedCardIndex, 1)[0];
            if (draggedCardIndex < insertAt) insertAt--;
            docState.items.splice(insertAt, 0, movedItem);
            docState.checkList.splice(insertAt, 0, movedChk);
            docState.currentIndex = insertAt;
            await renderThumbnailList();
            loadMainViewer(insertAt);
          }
          draggedCardIndex = null;
        });

        const header = document.createElement('div');
        header.className = 'thumb-card-header';

        const titleSpan = document.createElement('span');
        const badgeType = item.type === 'image' ? ' 🖼️' : ' 📄';
        titleSpan.textContent = `#${idx + 1}${badgeType}`;
        header.appendChild(titleSpan);

        const headerRight = document.createElement('div');
        headerRight.style.display = 'flex';
        headerRight.style.alignItems = 'center';
        headerRight.style.gap = '8px';

        const btnRow = document.createElement('div');
        btnRow.className = 'thumb-btn-row';

        const btnUp = document.createElement('button');
        btnUp.className = 'btn-icon-sm';
        btnUp.textContent = '▲';
        btnUp.title = '위로 이동';
        btnUp.onclick = (e) => { e.stopPropagation(); moveItemOrder(idx, -1); };

        const btnDown = document.createElement('button');
        btnDown.className = 'btn-icon-sm';
        btnDown.textContent = '▼';
        btnDown.title = '아래로 이동';
        btnDown.onclick = (e) => { e.stopPropagation(); moveItemOrder(idx, 1); };

        const btnDel = document.createElement('button');
        btnDel.className = 'btn-icon-sm';
        btnDel.textContent = '✕';
        btnDel.title = '삭제';
        btnDel.onclick = (e) => { e.stopPropagation(); removeItem(idx); };

        btnRow.appendChild(btnUp);
        btnRow.appendChild(btnDown);
        btnRow.appendChild(btnDel);
        headerRight.appendChild(btnRow);

        const touchWrap = document.createElement('label');
        touchWrap.className = 'chk-touch-wrap';
        touchWrap.onclick = (e) => e.stopPropagation();

        const chk = document.createElement('input');
        chk.type = 'checkbox';
        chk.checked = docState.checkList[idx] !== false;
        chk.onchange = () => {
          docState.checkList[idx] = chk.checked;
          updateThumbCounts();
        };
        touchWrap.appendChild(chk);
        headerRight.appendChild(touchWrap);

        header.appendChild(headerRight);
        card.appendChild(header);

        const thumbCanvasWrap = document.createElement('div');
        thumbCanvasWrap.className = 'thumb-canvas-wrap';
        const thumbCanvas = document.createElement('canvas');
        thumbCanvas.id = `thumb-canvas-${idx}`;
        thumbCanvasWrap.appendChild(thumbCanvas);
        card.appendChild(thumbCanvasWrap);
        container.appendChild(card);

        // 비동기 경량 썸네일 렌더링
        (async () => {
          const cfg = getEffectiveItemSettings(idx);
          const { rotImg } = getResolvedRotations(cfg);
          if (item.type === 'pdf') {
            const page = await item.doc.getPage(item.pageNum);
            await renderPdfPageToCanvas(page, 0.65, rotImg, thumbCanvas);
          } else {
            drawPaperWithImage(thumbCanvas, item, cfg, { isThumbnail: true });
            const isTransparent = ((cfg.format || 'png') === 'png') && (cfg.transparentBg !== false);
            if (thumbCanvasWrap) thumbCanvasWrap.classList.toggle('checkerboard-bg', isTransparent);
          }
          updateViewerEdits(idx);
        })();
      });

      updateThumbCounts();
    }
    const renderPdfThumbnailList = renderThumbnailList;
    const renderImageThumbnailList = renderThumbnailList;

    async function moveItemOrder(index, delta) {
      const target = index + delta;
      if (target < 0 || target >= docState.items.length) return;
      const movedItem = docState.items.splice(index, 1)[0];
      const movedChk = docState.checkList.splice(index, 1)[0];
      docState.items.splice(target, 0, movedItem);
      docState.checkList.splice(target, 0, movedChk);
      docState.currentIndex = target;
      await renderThumbnailList();
      loadMainViewer(target);
    }
    const movePdfPageOrder = moveItemOrder;
    const moveImageOrder = moveItemOrder;

    async function removeItem(index) {
      docState.items.splice(index, 1);
      docState.checkList.splice(index, 1);
      if (docState.currentIndex >= docState.items.length) {
        docState.currentIndex = Math.max(0, docState.items.length - 1);
      }
      await renderThumbnailList();
      if (docState.items.length > 0) {
        loadMainViewer(docState.currentIndex);
      } else {
        refreshWorkspaceDisplay();
      }
    }
    const removePdfPageItem = removeItem;
    const removeImageItem = removeItem;

    // -------------------------------------------------------------
    // [PDF 페이지 선택 모달 (Picker Modal) 제어 함수들]
    // -------------------------------------------------------------
    function openPdfPicker(pdfDoc, file, targetInsertIndex = -1) {
      pickerState.doc = pdfDoc;
      pickerState.file = file;
      pickerState.total = pdfDoc.numPages;
      pickerState.selected = new Array(pdfDoc.numPages).fill(true);
      pickerState.targetInsertIndex = targetInsertIndex;

      const modal = document.getElementById('modalPdfPicker');
      const title = document.getElementById('pickerModalTitle');
      const posText = document.getElementById('pickerTargetPosText');
      const chkAll = document.getElementById('chkPickerSelectAll');
      const txtRange = document.getElementById('txtPickerRange');

      title.textContent = `📑 [${file.name}] 페이지 선택 (${pdfDoc.numPages}페이지)`;
      chkAll.checked = true;
      txtRange.value = '';

      if (targetInsertIndex >= 0 && targetInsertIndex < pdfState.pages.length) {
        posText.textContent = `삽입 위치: #${targetInsertIndex + 1} 앞`;
      } else {
        posText.textContent = `삽입 위치: 문서 끝`;
      }

      modal.classList.add('show');
      updatePickerCount();
      renderPickerThumbnails();
      try { history.pushState({ appLayer: 'pdfPicker' }, ''); } catch (e) {}
    }

    function closePdfPickerModal(syncHistory = true) {
      const modal = document.getElementById('modalPdfPicker');
      if (modal && modal.classList.contains('show')) {
        modal.classList.remove('show');
        if (syncHistory && history.state && (history.state.appLayer === 'pdfPicker' || history.state.modal === 'pdfPicker')) {
          isClosingLayerProgrammatically = true;
          history.back();
        }
      }
      pickerState.doc = null;
      pickerState.file = null;
    }

    function onPickerModalBackdropClick(e) {
      if (e.target.id === 'modalPdfPicker') {
        closePdfPickerModal(true);
      }
    }

    function updatePickerCount() {
      const selectedCount = pickerState.selected.filter(Boolean).length;
      const countText = document.getElementById('pickerCountText');
      const chkAll = document.getElementById('chkPickerSelectAll');
      if (countText) countText.textContent = `(${selectedCount} / ${pickerState.total} 선택됨)`;
      if (chkAll) chkAll.checked = (pickerState.total > 0 && selectedCount === pickerState.total);
    }

    const chkPickerSelectAllElem = document.getElementById('chkPickerSelectAll');
    if (chkPickerSelectAllElem) {
      chkPickerSelectAllElem.addEventListener('change', (e) => {
        const checked = e.target.checked;
        pickerState.selected = pickerState.selected.map(() => checked);
        const chks = document.querySelectorAll('.picker-card input[type="checkbox"]');
        chks.forEach((c, idx) => {
          c.checked = checked;
          const card = document.getElementById(`picker-card-${idx}`);
          if (card) card.classList.toggle('selected', checked);
        });
        updatePickerCount();
      });
    }

    function applyPickerRangeFilter() {
      const input = document.getElementById('txtPickerRange');
      if (!input) return;
      const val = input.value.trim();
      if (!val) return;

      const selectedSet = new Set();
      const parts = val.split(',');
      for (const part of parts) {
        const trimmed = part.trim();
        if (!trimmed) continue;
        if (trimmed.includes('-')) {
          const [startStr, endStr] = trimmed.split('-');
          const start = parseInt(startStr, 10);
          const end = parseInt(endStr, 10);
          if (!isNaN(start) && !isNaN(end)) {
            const min = Math.max(1, Math.min(start, end));
            const max = Math.min(pickerState.total, Math.max(start, end));
            for (let p = min; p <= max; p++) selectedSet.add(p);
          }
        } else {
          const p = parseInt(trimmed, 10);
          if (!isNaN(p) && p >= 1 && p <= pickerState.total) {
            selectedSet.add(p);
          }
        }
      }

      pickerState.selected = pickerState.selected.map((_, i) => selectedSet.has(i + 1));
      pickerState.selected.forEach((isSelected, idx) => {
        const chk = document.getElementById(`picker-chk-${idx}`);
        if (chk) chk.checked = isSelected;
        const card = document.getElementById(`picker-card-${idx}`);
        if (card) card.classList.toggle('selected', isSelected);
      });
      updatePickerCount();
    }

    async function renderPickerThumbnails() {
      const grid = document.getElementById('pickerGrid');
      grid.innerHTML = '';
      const total = pickerState.total;
      const doc = pickerState.doc;
      if (!doc) return;

      for (let i = 1; i <= total; i++) {
        const card = document.createElement('div');
        card.className = `picker-card ${pickerState.selected[i - 1] ? 'selected' : ''}`;
        card.id = `picker-card-${i - 1}`;

        const numBadge = document.createElement('span');
        numBadge.className = 'picker-card-num';
        numBadge.textContent = `#${i}`;
        card.appendChild(numBadge);

        const chk = document.createElement('input');
        chk.type = 'checkbox';
        chk.id = `picker-chk-${i - 1}`;
        chk.className = 'picker-card-chk';
        chk.checked = pickerState.selected[i - 1];
        chk.onclick = (e) => e.stopPropagation();
        chk.onchange = () => {
          pickerState.selected[i - 1] = chk.checked;
          card.classList.toggle('selected', chk.checked);
          updatePickerCount();
        };
        card.appendChild(chk);

        card.onclick = () => {
          chk.checked = !chk.checked;
          pickerState.selected[i - 1] = chk.checked;
          card.classList.toggle('selected', chk.checked);
          updatePickerCount();
        };

        // 경량 썸네일 캔버스 (scale 0.25 로 메모리 보호)
        const canvas = document.createElement('canvas');
        canvas.className = 'picker-thumb-canvas';
        card.appendChild(canvas);
        grid.appendChild(card);

        // 비동기 렌더링
        (async () => {
          try {
            const page = await doc.getPage(i);
            const vp = page.getViewport({ scale: 0.25 });
            canvas.width = vp.width;
            canvas.height = vp.height;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, vp.width, vp.height);
            await page.render({ canvasContext: ctx, viewport: vp }).promise;
          } catch (e) {
            console.error(e);
          }
        })();

        if (i % 6 === 0) {
          await new Promise(r => setTimeout(r, 0));
        }
      }
    }

    async function confirmPickerInsert() {
      const selectedNums = [];
      pickerState.selected.forEach((sel, i) => {
        if (sel) selectedNums.push(i + 1);
      });

      if (selectedNums.length === 0) {
        alert('삽입할 페이지를 1개 이상 선택해 주세요.');
        return;
      }

      const newPages = selectedNums.map(pageNum => ({
        type: 'pdf',
        doc: pickerState.doc,
        pageNum: pageNum,
        name: `${pickerState.file.name} (p.${pageNum})`,
        settings: {
          ...pdfState.globalSettings,
          rotTarget: { ...pdfState.globalSettings.rotTarget }
        }
      }));

      const newChecks = new Array(newPages.length).fill(true);
      const targetPos = pickerState.targetInsertIndex;

      if (targetPos >= 0 && targetPos <= pdfState.pages.length) {
        pdfState.pages.splice(targetPos, 0, ...newPages);
        pdfState.checkList.splice(targetPos, 0, ...newChecks);
        pdfState.currentIndex = targetPos;
      } else {
        const insertPos = pdfState.pages.length;
        pdfState.pages.splice(insertPos, 0, ...newPages);
        pdfState.checkList.splice(insertPos, 0, ...newChecks);
        pdfState.currentIndex = insertPos;
      }

      closePdfPickerModal();
      await refreshWorkspaceDisplay();
      await loadMainViewer(pdfState.currentIndex);
      document.getElementById('statusText').textContent = `${newPages.length}개 페이지가 삽입되었습니다.`;
    }

    document.getElementById('chkSelectAll').addEventListener('change', (e) => {
      const checked = e.target.checked;
      docState.checkList = docState.checkList.map(() => checked);
      document.querySelectorAll('#thumbList input[type="checkbox"]').forEach(c => c.checked = checked);
      updateThumbCounts();
    });

    function updateThumbCounts() {
      const btnSavePdf = document.getElementById('btnSavePdf');
      const btnSaveImg = document.getElementById('btnSaveImg');
      const btnAction = document.getElementById('btnAction');

      if (docState.items.length === 0) {
        document.getElementById('thumbCount').textContent = '0/0';
        document.getElementById('chkSelectAll').checked = false;
        if (btnSavePdf) btnSavePdf.disabled = true;
        if (btnSaveImg) btnSaveImg.disabled = true;
        if (btnAction) btnAction.disabled = true;
      } else {
        const selected = docState.checkList.filter(Boolean).length;
        const total = docState.items.length;
        document.getElementById('thumbCount').textContent = `${selected}/${total}`;
        document.getElementById('chkSelectAll').checked = (total > 0 && selected === total);
        const isDisabled = selected === 0;
        if (btnSavePdf) btnSavePdf.disabled = isDisabled;
        if (btnSaveImg) btnSaveImg.disabled = isDisabled;
        if (btnAction) btnAction.disabled = isDisabled;
      }

      // 모바일 플로팅 버튼(FAB) 상태 갱신 (데스크톱에서는 CSS display: none !important 유지)
      const totalCount = docState.items.length;
      const fab = document.getElementById('mobileFab');
      if (fab) {
        fab.classList.toggle('has-files', totalCount > 0);
        fab.style.display = '';
        fab.textContent = '⚙️ 편집 & 저장';
      }
    }

    function clearThumbDropLines() {
      document.querySelectorAll('.thumb-card').forEach(c => {
        c.classList.remove('drag-over-top', 'drag-over-bottom');
      });
    }

    // 2열 메인 뷰어 캔버스 렌더링 (용지 규격 + 여백 + 회전 + 맞춤 비율 정밀 반영)
    let currentRenderTask = null;
    async function renderMainViewerCanvas(index) {
      const canvas = document.getElementById('mainViewerCanvas');
      if (!canvas) return;
      const wrap = document.getElementById('viewerWrap');
      const item = docState.items[index];
      if (!item) return;

      const cfg = getEffectiveItemSettings(index);

      if (item.type === 'pdf') {
        await ensureItemCanvas(item);
      }
      canvas.style.filter = 'none';
      canvas.style.transform = 'none';
      drawPaperWithImage(canvas, item, cfg, { isThumbnail: false });
      const isTransparent = ((cfg.format || 'png') === 'png') && (cfg.transparentBg !== false);
      if (wrap) wrap.classList.toggle('checkerboard-bg', isTransparent);
    }

    // 2열 메인 뷰어 로드
    async function loadMainViewer(index) {
      const total = docState.items.length;
      if (total === 0) return;

      docState.currentIndex = index;

      const pageText = `${index + 1} / ${total}`;
      const vpi = document.getElementById('viewerPageIndicator');
      if (vpi) vpi.textContent = pageText;
      const mpi = document.getElementById('mobilePageIndicator');
      if (mpi) mpi.textContent = pageText;

      document.querySelectorAll('.thumb-card').forEach((c, i) => c.classList.toggle('active', i === index));
      const targetCard = document.getElementById(`thumb-card-${index}`);
      if (targetCard) targetCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

      document.getElementById('viewerEmptyMsg').style.display = 'none';
      const wrap = document.getElementById('viewerWrap');
      wrap.style.display = 'block';

      // 1. 메인 뷰어 캔버스 렌더링 (회전 각도 정밀 반영)
      await renderMainViewerCanvas(index);

      // 2. 우측 컨트롤을 현재 페이지 상태(개별 or 글로벌)로 완전 동기화 (투시변환 페이지별 상태 포함)
      syncControlsForCurrentPage();

      // 3. 줌 및 미니 프리뷰 갱신
      applyZoom();
      updateViewerEdits(index);
      updateMiniPreview();
      if (isPerspectiveActive) {
        updateCornerPins();
      } else {
        const overlay = document.getElementById('perspectiveOverlay');
        if (overlay) overlay.style.display = 'none';
      }
    }

    function navigateViewer(delta) {
      const max = docState.items.length;
      if (max === 0) return;
      let next = docState.currentIndex + delta;
      if (next < 0) next = 0;
      if (next >= max) next = max - 1;
      loadMainViewer(next);
    }

    function adjustZoom(delta) {
      const nextZoom = Math.max(0.3, Math.min(3.0, docState.zoom + delta));
      docState.zoom = nextZoom;
      applyZoom();
    }
    function resetZoom() {
      docState.zoom = 1.0;
      applyZoom();
    }
    function applyZoom() {
      const wrap = document.getElementById('viewerWrap');
      if (wrap) wrap.style.transform = `scale(${docState.zoom})`;
      if (isPerspectiveActive) updateCornerPins();
    }

    function updateViewerEdits(targetIdx) {
      const curIdx = targetIdx !== undefined ? targetIdx : docState.currentIndex;
      const item = docState.items[curIdx];
      if (!item) return;
      const cfg = getEffectiveItemSettings(curIdx);
      if (!cfg) return;

      const activeCurIdx = docState.currentIndex;
      const mvc = document.getElementById('mainViewerCanvas');
      const tc = document.getElementById(`thumb-canvas-${curIdx}`);

      if (curIdx === activeCurIdx && mvc) {
        mvc.style.filter = 'none';
        mvc.style.transform = 'none';
        renderMainViewerCanvas(curIdx);
      }
      if (tc) {
        tc.style.filter = 'none';
        tc.style.transform = 'none';
        updateThumbnailCanvas(curIdx);
      }
      if (isPerspectiveActive && curIdx === activeCurIdx) {
        updateCornerPins();
      }
    }

    function updateMainViewerFilters() {
      updateViewerEdits();
    }

    function adjustPreviewScale(delta) {
      const curIdx = docState.currentIndex;
      const cfg = getEffectiveItemSettings(curIdx);
      const curScale = cfg.contentScale || 1.0;
      cfg.contentScale = Math.max(0.2, Math.min(3.0, Math.round((curScale + delta) * 100) / 100));
      updateViewerEdits();
      updateMiniPreview();
    }

    function resetPreviewScale() {
      const curIdx = docState.currentIndex;
      const cfg = getEffectiveItemSettings(curIdx);
      cfg.contentScale = 1.0;
      updateViewerEdits();
      updateMiniPreview();
    }

    function adjustScaleX(delta) {
      const curIdx = docState.currentIndex;
      const cfg = getEffectiveItemSettings(curIdx);
      const cur = cfg.scaleX !== undefined ? cfg.scaleX : 1.0;
      cfg.scaleX = Math.max(0.2, Math.min(3.0, Math.round((cur + delta) * 100) / 100));
      updateViewerEdits();
      updateMiniPreview();
    }

    function resetScaleX() {
      const curIdx = docState.currentIndex;
      const cfg = getEffectiveItemSettings(curIdx);
      cfg.scaleX = 1.0;
      updateViewerEdits();
      updateMiniPreview();
    }

    function adjustTrapezoid(mode) {
      const curIdx = docState.currentIndex;
      const item = docState.items[curIdx];
      if (!item) return;
      const cfg = getEffectiveItemSettings(curIdx);
      if (!cfg.trapExp) {
        cfg.trapExp = { top: 0, bot: 0 };
      }

      // 원본 이미지/PDF 가로 크기 기준 1% 고정 스텝 (최소 1px)
      const baseW = item.width || item.imgObj?.naturalWidth || item.imgObj?.width || 1000;
      const stepPx = Math.max(1, Math.round(baseW * 0.01));

      if (mode === 'top' || mode > 0) {
        // 대두: 윗변 길이 확대 (밑변은 기존 크기 그대로 유지)
        cfg.trapExp.top = (cfg.trapExp.top || 0) + stepPx;
      } else if (mode === 'bot' || mode < 0) {
        // 소두: 밑변 길이 확대 (윗변은 기존 크기 그대로 유지)
        cfg.trapExp.bot = (cfg.trapExp.bot || 0) + stepPx;
      }

      updateViewerEdits();
      updateMiniPreview();
      if (isPerspectiveActive) updateCornerPins();
    }

    function resetTrapezoid() {
      const curIdx = docState.currentIndex;
      const cfg = getEffectiveItemSettings(curIdx);
      cfg.trapExp = { top: 0, bot: 0 };
      cfg.trapezoid = 0;
      updateViewerEdits();
      updateMiniPreview();
      if (isPerspectiveActive) updateCornerPins();
    }

    function adjustBrightness(delta) {
      const curIdx = docState.currentIndex;
      const cfg = getEffectiveItemSettings(curIdx);
      const cur = cfg.brightness !== undefined ? cfg.brightness : 100;
      cfg.brightness = Math.max(20, Math.min(250, cur + delta));
      updateViewerEdits();
      updateMiniPreview();
    }

    function resetBrightness() {
      const curIdx = docState.currentIndex;
      const cfg = getEffectiveItemSettings(curIdx);
      cfg.brightness = 100;
      updateViewerEdits();
      updateMiniPreview();
    }

    function adjustContrast(delta) {
      const curIdx = docState.currentIndex;
      const cfg = getEffectiveItemSettings(curIdx);
      const cur = cfg.contrast !== undefined ? cfg.contrast : 100;
      cfg.contrast = Math.max(20, Math.min(250, cur + delta));
      updateViewerEdits();
      updateMiniPreview();
    }

    function resetContrast() {
      const curIdx = docState.currentIndex;
      const cfg = getEffectiveItemSettings(curIdx);
      cfg.contrast = 100;
      updateViewerEdits();
      updateMiniPreview();
    }

    // [핵심] 사각 투시 변환(4-Corner Pinning) 대화형 편집 상태
    let isPerspectiveActive = false;
    let selectedCornerKey = null; // 'tl' | 'tr' | 'br' | 'bl'
    let isPinDragging = false;
    let isDraggingMiniPin = false;
    let activeDraggingPinKey = null;
    let pinDragStartMouseX = 0;
    let pinDragStartMouseY = 0;
    let pinDragStartCornerVal = { x: 0, y: 0 };

    // 메인 뷰어 캔버스 상의 이미지 4개 코너 절대 좌표(캔버스 픽셀 단위) 산출
    function getCornerCanvasPoints(item, cfg, canvasW, canvasH) {
      if (!item || !item.imgObj) return null;
      const { rotImg, isPageRot90, isImgRot90 } = getResolvedRotations(cfg);
      const rotRad = (rotImg * Math.PI) / 180;

      const origW = item.width || item.imgObj.width;
      const origH = item.height || item.imgObj.height;
      const rotImgW = isImgRot90 ? origH : origW;
      const rotImgH = isImgRot90 ? origW : origH;

      const isOrigLandscape = (origW > origH);
      const orientOpt = cfg.orient || 'auto';
      const baseLandscape = orientOpt === 'l' || (orientOpt === 'auto' && isOrigLandscape);
      const isLandscape = isPageRot90 ? !baseLandscape : baseLandscape;
      const marginPx = cfg.margin || 0;
      const sizeKey = cfg.pageSize || cfg.fit || 'original';

      // [핵심 무결성] 용지 규격은 페이지 회전(rotPage / isPageRot90)과 방향(orient)에 의해서만 결정되며
      // 내용물인 이미지 자체의 회전(rotImg)에 의해 바탕 용지가 회전되는 일이 원천 차단됩니다.
      const basePaperW = (isPageRot90 ? origH : origW) + marginPx * 2;
      const basePaperH = (isPageRot90 ? origW : origH) + marginPx * 2;
      const paper = resolvePaperGeometry(sizeKey, isLandscape, basePaperW, basePaperH, cfg.customW, cfg.customH);

      const scaleFactor = canvasW / paper.widthPx;
      const viewMargin = Math.round(marginPx * scaleFactor);
      const innerW = Math.max(10, canvasW - (viewMargin * 2));
      const innerH = Math.max(10, canvasH - (viewMargin * 2));

      const fitScale = Math.min(innerW / rotImgW, innerH / rotImgH);
      const baseDrawW = rotImgW * fitScale;
      const baseDrawH = rotImgH * fitScale;

      const cScale = cfg.contentScale || 1.0;
      const scaleX = cfg.scaleX !== undefined ? cfg.scaleX : 1.0;
      const finalW = baseDrawW * cScale * scaleX;
      const finalH = baseDrawH * cScale;

      const shiftX = canvasW * ((cfg.offsetX || 0) / 100);
      const shiftY = canvasH * ((cfg.offsetY || 0) / 100);
      const posX = (canvasW - finalW) / 2 + shiftX;
      const posY = (canvasH - finalH) / 2 + shiftY;

      const origDrawW = isImgRot90 ? (baseDrawH * cScale) : (baseDrawW * cScale * scaleX);
      const origDrawH = isImgRot90 ? (baseDrawW * cScale * scaleX) : (baseDrawH * cScale);

      const dx = -origDrawW / 2;
      const dy = -origDrawH / 2;
      const dw = origDrawW;
      const dh = origDrawH;

      const trap = cfg.trapezoid || 0;
      const trapTopOffset = trap > 0 ? (dw * trap) / 2 : 0;
      const trapBotOffset = trap < 0 ? (dw * Math.abs(trap)) / 2 : 0;

      const srcW = item.imgObj.naturalWidth || item.imgObj.width || dw;
      const srcH = item.imgObj.naturalHeight || item.imgObj.height || dh;
      const scalePxX = dw / srcW;
      const scalePxY = dh / srcH;

      const c = cfg.corners || { tl: { x: 0, y: 0 }, tr: { x: 0, y: 0 }, br: { x: 0, y: 0 }, bl: { x: 0, y: 0 } };

      const pLocal = {
        tl: {
          x: dx - trapTopOffset + ((c.tl?.x || 0) * scalePxX),
          y: dy + ((c.tl?.y || 0) * scalePxY)
        },
        tr: {
          x: dx + dw + trapTopOffset + ((c.tr?.x || 0) * scalePxX),
          y: dy + ((c.tr?.y || 0) * scalePxY)
        },
        br: {
          x: dx + dw + trapBotOffset + ((c.br?.x || 0) * scalePxX),
          y: dy + dh + ((c.br?.y || 0) * scalePxY)
        },
        bl: {
          x: dx - trapBotOffset + ((c.bl?.x || 0) * scalePxX),
          y: dy + dh + ((c.bl?.y || 0) * scalePxY)
        }
      };

      const cx = posX + finalW / 2;
      const cy = posY + finalH / 2;
      const cos = Math.cos(rotRad);
      const sin = Math.sin(rotRad);

      function toCanv(pt) {
        return {
          x: cx + (pt.x * cos - pt.y * sin),
          y: cy + (pt.x * sin + pt.y * cos)
        };
      }

      return {
        tl: toCanv(pLocal.tl),
        tr: toCanv(pLocal.tr),
        br: toCanv(pLocal.br),
        bl: toCanv(pLocal.bl),
        dw,
        dh,
        cx,
        cy,
        rotRad
      };
    }

    // 메인 뷰어 및 우측/모바일 미니 프리뷰의 4개 핀 핸들과 SVG 가이드 다각형 위치 실시간 동기화
    function updateCornerPins() {
      const overlay = document.getElementById('perspectiveOverlay');
      const miniOverlay = document.getElementById('miniPerspectiveOverlay');

      if (!isPerspectiveActive) {
        if (overlay) overlay.style.display = 'none';
        if (miniOverlay) miniOverlay.style.display = 'none';
        return;
      }

      const canvas = document.getElementById('mainViewerCanvas');
      const curIdx = docState.currentIndex;
      const item = docState.items[curIdx];
      if (!canvas || !item || !item.imgObj || canvas.width === 0 || canvas.height === 0) {
        if (overlay) overlay.style.display = 'none';
        if (miniOverlay) miniOverlay.style.display = 'none';
        return;
      }

      const cfg = getEffectiveItemSettings(curIdx);
      const pts = getCornerCanvasPoints(item, cfg, canvas.width, canvas.height);
      if (!pts) {
        if (overlay) overlay.style.display = 'none';
        if (miniOverlay) miniOverlay.style.display = 'none';
        return;
      }

      // 1. 가운데 메인 뷰어 핀 & 다각형 위치 동기화
      if (overlay) {
        overlay.style.display = 'block';
        const dispW = canvas.clientWidth || canvas.offsetWidth;
        const dispH = canvas.clientHeight || canvas.offsetHeight;
        if (dispW && dispH) {
          const scaleX = dispW / canvas.width;
          const scaleY = dispH / canvas.height;

          const sTL = { x: pts.tl.x * scaleX, y: pts.tl.y * scaleY };
          const sTR = { x: pts.tr.x * scaleX, y: pts.tr.y * scaleY };
          const sBR = { x: pts.br.x * scaleX, y: pts.br.y * scaleY };
          const sBL = { x: pts.bl.x * scaleX, y: pts.bl.y * scaleY };

          const poly = document.getElementById('perspectivePolygon');
          if (poly) {
            poly.setAttribute('points', `${sTL.x},${sTL.y} ${sTR.x},${sTR.y} ${sBR.x},${sBR.y} ${sBL.x},${sBL.y}`);
          }

          const pinTL = document.getElementById('pinTL');
          const pinTR = document.getElementById('pinTR');
          const pinBR = document.getElementById('pinBR');
          const pinBL = document.getElementById('pinBL');

          if (pinTL) { pinTL.style.left = `${sTL.x}px`; pinTL.style.top = `${sTL.y}px`; }
          if (pinTR) { pinTR.style.left = `${sTR.x}px`; pinTR.style.top = `${sTR.y}px`; }
          if (pinBR) { pinBR.style.left = `${sBR.x}px`; pinBR.style.top = `${sBR.y}px`; }
          if (pinBL) { pinBL.style.left = `${sBL.x}px`; pinBL.style.top = `${sBL.y}px`; }
        }
      }

      // 2. 우측/모바일 미니 프리뷰 핀 & 다각형 위치 동기화 (모바일에서 실시간 핸들 드래그 지원)
      if (miniOverlay) {
        const miniSheet = document.getElementById('miniSheet');
        if (miniSheet && miniSheet.offsetWidth > 0 && miniSheet.offsetHeight > 0) {
          miniOverlay.style.display = 'block';
          const mScaleX = miniSheet.offsetWidth / canvas.width;
          const mScaleY = miniSheet.offsetHeight / canvas.height;

          const mTL = { x: pts.tl.x * mScaleX, y: pts.tl.y * mScaleY };
          const mTR = { x: pts.tr.x * mScaleX, y: pts.tr.y * mScaleY };
          const mBR = { x: pts.br.x * mScaleX, y: pts.br.y * mScaleY };
          const mBL = { x: pts.bl.x * mScaleX, y: pts.bl.y * mScaleY };

          const miniPoly = document.getElementById('miniPerspectivePolygon');
          if (miniPoly) {
            miniPoly.setAttribute('points', `${mTL.x},${mTL.y} ${mTR.x},${mTR.y} ${mBR.x},${mBR.y} ${mBL.x},${mBL.y}`);
          }

          const miniPinTL = document.getElementById('miniPinTL');
          const miniPinTR = document.getElementById('miniPinTR');
          const miniPinBR = document.getElementById('miniPinBR');
          const miniPinBL = document.getElementById('miniPinBL');

          if (miniPinTL) { miniPinTL.style.left = `${mTL.x}px`; miniPinTL.style.top = `${mTL.y}px`; }
          if (miniPinTR) { miniPinTR.style.left = `${mTR.x}px`; miniPinTR.style.top = `${mTR.y}px`; }
          if (miniPinBR) { miniPinBR.style.left = `${mBR.x}px`; miniPinBR.style.top = `${mBR.y}px`; }
          if (miniPinBL) { miniPinBL.style.left = `${mBL.x}px`; miniPinBL.style.top = `${mBL.y}px`; }
        } else {
          miniOverlay.style.display = 'none';
        }
      }

      document.querySelectorAll('.corner-pin').forEach(pin => {
        pin.classList.toggle('active', pin.dataset.corner === selectedCornerKey);
      });
    }

    // 현재 선택된 페이지의 투시 변환 UI 동기화 (페이지별 독립 활성화 상태 보장)
    function syncPerspectiveUI(active) {
      isPerspectiveActive = Boolean(active);
      const overlay = document.getElementById('perspectiveOverlay');
      const miniOverlay = document.getElementById('miniPerspectiveOverlay');
      const btnToggle = document.getElementById('btnTogglePerspective');

      if (overlay) overlay.style.display = isPerspectiveActive ? 'block' : 'none';
      if (miniOverlay) miniOverlay.style.display = isPerspectiveActive ? 'block' : 'none';
      if (btnToggle) {
        btnToggle.classList.toggle('active', isPerspectiveActive);
        btnToggle.style.background = isPerspectiveActive ? '#0f766e' : '';
        btnToggle.style.color = isPerspectiveActive ? '#ffffff' : '';
      }

      if (isPerspectiveActive) {
        updateCornerPins();
      } else {
        selectedCornerKey = null;
        document.querySelectorAll('.corner-pin').forEach(p => p.classList.remove('active'));
      }
    }

    // 투시 변환 모드 온/오프 토글 (현재 페이지에만 독립 적용)
    function togglePerspectiveMode() {
      const curIdx = docState.currentIndex;
      const item = docState.items[curIdx];
      if (!item) return;
      const cfg = getEffectiveItemSettings(curIdx);
      cfg.isPerspectiveActive = !cfg.isPerspectiveActive;
      syncPerspectiveUI(cfg.isPerspectiveActive);
    }

    // 모서리 핀 선택 (D-Pad 및 시각 강조 연동)
    function selectCorner(key) {
      selectedCornerKey = key;
      ['tl', 'tr', 'bl', 'br'].forEach(k => {
        const pin = document.getElementById('pin' + k.toUpperCase());
        if (pin) pin.classList.toggle('active', k === key);
        const miniPin = document.getElementById('miniPin' + k.toUpperCase());
        if (miniPin) miniPin.classList.toggle('active', k === key);
      });
    }

    // 모서리 핀 좌표 초기화 (0% 0%)
    function resetCorners() {
      const curIdx = docState.currentIndex;
      const cfg = getEffectiveItemSettings(curIdx);
      cfg.corners = {
        tl: { x: 0, y: 0 },
        tr: { x: 0, y: 0 },
        br: { x: 0, y: 0 },
        bl: { x: 0, y: 0 }
      };
      updateViewerEdits();
      updateMiniPreview();
      if (isPerspectiveActive) {
        updateCornerPins();
      }
    }

    function adjustImageOffset(dx, dy) {
      const curIdx = docState.currentIndex;
      const cfg = getEffectiveItemSettings(curIdx);
      const curX = cfg.offsetX !== undefined ? cfg.offsetX : 0;
      const curY = cfg.offsetY !== undefined ? cfg.offsetY : 0;
      cfg.offsetX = Math.max(-50, Math.min(50, curX + dx));
      cfg.offsetY = Math.max(-50, Math.min(50, curY + dy));
      updateViewerEdits();
      updateMiniPreview();
      if (isPerspectiveActive) updateCornerPins();
    }

    function resetImageOffset() {
      const curIdx = docState.currentIndex;
      const cfg = getEffectiveItemSettings(curIdx);
      cfg.offsetX = 0;
      cfg.offsetY = 0;
      updateViewerEdits();
      updateMiniPreview();
      if (isPerspectiveActive) updateCornerPins();
    }

    // [핵심] 정해진 용지 크기를 고정 유지하고 내부 내용물만 확대/축소/비율/필터/오프셋 편집
    // 3열 우측 '미리보기 / 이미지 편집' 창: 2열 메인 뷰어와 100% WYSIWYG 일체화 동기화
    function updateMiniPreview() {
      const miniCanvas = document.getElementById('miniCanvas');
      if (!miniCanvas) return;
      const mctx = miniCanvas.getContext('2d');
      const miniSheet = document.getElementById('miniSheet');
      const miniEmpty = document.getElementById('miniEmpty');
      const info = document.getElementById('miniInfo');

      const srcCanvas = document.getElementById('mainViewerCanvas');
      if (!srcCanvas || srcCanvas.width === 0 || srcCanvas.height === 0) {
        if (miniSheet) miniSheet.style.display = 'none';
        if (miniEmpty) miniEmpty.style.display = 'flex';
        if (info) info.textContent = '선택 항목 기준 윤곽';
        return;
      }

      if (miniSheet) miniSheet.style.display = 'block';
      if (miniEmpty) miniEmpty.style.display = 'none';

      const maxBoxW = 125;
      const maxBoxH = 150;

      const curIdx = docState.currentIndex;
      const cfg = getEffectiveItemSettings(curIdx);
      const { rot, rotPage, rotImg, isPageRot90, isImgRot90, target } = getResolvedRotations(cfg);
      const fitKey = cfg.pageSize || cfg.fit || 'original';
      const cScale = cfg.contentScale || 1.0;
      const scaleX = cfg.scaleX !== undefined ? cfg.scaleX : 1.0;
      const brightness = cfg.brightness !== undefined ? cfg.brightness : 100;
      const contrast = cfg.contrast !== undefined ? cfg.contrast : 100;
      const offsetX = cfg.offsetX !== undefined ? cfg.offsetX : 0;
      const offsetY = cfg.offsetY !== undefined ? cfg.offsetY : 0;
      const marginPx = cfg.margin || 0;

      const item = docState.items[curIdx];
      const origW = item ? (item.width || (item.imgObj ? item.imgObj.width : 1200)) : 1200;
      const origH = item ? (item.height || (item.imgObj ? item.imgObj.height : 1600)) : 1600;

      const basePaperW = (isPageRot90 ? origH : origW) + marginPx * 2;
      const basePaperH = (isPageRot90 ? origW : origH) + marginPx * 2;
      const isOrigLandscape = origW > origH;
      const orientOpt = cfg.orient || 'auto';
      const baseLandscape = orientOpt === 'l' || (orientOpt === 'auto' && isOrigLandscape);
      const isLandscape = isPageRot90 ? !baseLandscape : baseLandscape;
      const paper = resolvePaperGeometry(fitKey, isLandscape, basePaperW, basePaperH, cfg.customW, cfg.customH);

      // 미리보기 박스(maxBoxW x maxBoxH) 안에 들어갈 시트 크기 계산
      let sheetW, sheetH;
      if (paper.ratio >= (maxBoxW / maxBoxH)) {
        sheetW = maxBoxW;
        sheetH = Math.max(20, Math.round(maxBoxW / paper.ratio));
      } else {
        sheetH = maxBoxH;
        sheetW = Math.max(20, Math.round(maxBoxH * paper.ratio));
      }

      // 종이 용지 CSS 크기 확정 (용지는 확대/축소에도 절대 변하지 않음!)
      miniSheet.style.width = `${sheetW}px`;
      miniSheet.style.height = `${sheetH}px`;
      miniSheet.style.aspectRatio = `${paper.widthPx} / ${paper.heightPx}`;

      const rotParts = [];
      if (rotPage !== 0) rotParts.push(`페이지 ${rotPage}°`);
      if (rotImg !== 0) rotParts.push(`이미지 ${rotImg}°`);
      const rotLabelStr = rotParts.length > 0 ? ` [${rotParts.join(', ')}]` : ` [0°]`;

      // 1줄: 용지 규격 및 독립 회전 현황
      const line1 = `${paper.name}${rotLabelStr}`;

      // 2줄: 사용자가 이미지에 적용한 편집 내용 압축 요약
      const line2Parts = [];
      line2Parts.push(`크기${Math.round(cScale * 100)}%`);
      if (scaleX !== 1.0) line2Parts.push(`가로${Math.round(scaleX * 100)}%`);
      if (cfg.trapExp && (cfg.trapExp.top || cfg.trapExp.bot)) {
        if (cfg.trapExp.top) line2Parts.push(`대두+${cfg.trapExp.top}px`);
        if (cfg.trapExp.bot) line2Parts.push(`소두+${cfg.trapExp.bot}px`);
      } else if (cfg.trapezoid) {
        const trapVal = Math.round(cfg.trapezoid * 100);
        line2Parts.push(trapVal > 0 ? `대두+${trapVal}%` : `소두+${Math.abs(trapVal)}%`);
      }
      const c = cfg.corners;
      if (c && (c.tl?.x || c.tl?.y || c.tr?.x || c.tr?.y || c.br?.x || c.br?.y || c.bl?.x || c.bl?.y)) {
        line2Parts.push(`투시📐`);
      }
      if (brightness !== 100) line2Parts.push(`밝기${brightness}%`);
      if (contrast !== 100) line2Parts.push(`명암${contrast}%`);
      if (offsetX !== 0 || offsetY !== 0) line2Parts.push(`위치(${offsetX},${offsetY})`);
      const line2 = line2Parts.join(' · ');

      info.innerHTML = `<div class="mini-info-line1" title="${line1}">${line1}</div><div class="mini-info-line2" title="${line2}">${line2}</div>`;
      info.title = `${line1}\n${line2}`;

      // 초고화질 Canvas 렌더링 (모바일 손가락 핀치 줌 열람 시에도 왼쪽 썸네일 이상의 초고화질 유지)
      const dpr = Math.max(3.5, (window.devicePixelRatio || 2) * 1.5);
      miniCanvas.width = Math.round(sheetW * dpr);
      miniCanvas.height = Math.round(sheetH * dpr);
      mctx.setTransform(1, 0, 0, 1, 0, 0);
      mctx.scale(dpr, dpr);

      // 하얀색 용지 바탕 또는 투명 처리
      const isTransparent = ((cfg.format || 'png') === 'png') && (cfg.transparentBg !== false);
      if (isTransparent) {
        mctx.clearRect(0, 0, sheetW, sheetH);
        miniSheet.classList.add('checkerboard-bg');
      } else {
        mctx.fillStyle = '#ffffff';
        mctx.fillRect(0, 0, sheetW, sheetH);
        miniSheet.classList.remove('checkerboard-bg');
      }

      // mainViewerCanvas는 이미 drawPaperWithImage로 모든 회전/편집/여백이 완벽히 합성된 용지 캔버스이므로
      // miniCanvas에 1:1 완벽 축약 복사하여 2열과 3열의 100% 비주얼 일체화를 보장합니다!
      mctx.drawImage(srcCanvas, 0, 0, sheetW, sheetH);

      // 모바일 미니 프리뷰 상의 투시 핀 위치 실시간 동기화 (이미지 확대/축소 시 핀 핸들도 함께 자동 확대)
      if (isPerspectiveActive) {
        updateCornerPins();
      }
    }

    // [핵심] 통합 듀얼 저장 라우터 (PDF 저장 vs Img 저장)
    async function executeActionSave(targetType) {
      if (targetType === 'img') {
        await executeSaveSplitImages();
      } else {
        await executeSaveMergedPdf();
      }
      toggleMobileControl(false);
    }

    // 선택된 항목들을 고화질 이미지로 개별/ZIP 분할 저장 (PDF/이미지 혼합 완벽 지원)
    async function executeSaveSplitImages() {
      if (docState.items.length === 0) return;
      const selectedIndices = [];
      docState.checkList.forEach((chk, i) => { if (chk && docState.items[i]) selectedIndices.push(i); });
      if (selectedIndices.length === 0) return;

      const btnSavePdf = document.getElementById('btnSavePdf');
      const btnSaveImg = document.getElementById('btnSaveImg');
      if (btnSavePdf) btnSavePdf.disabled = true;
      if (btnSaveImg) btnSaveImg.disabled = true;
      document.getElementById('btnAbort').style.display = 'inline-block';
      document.getElementById('progWrap').style.display = 'block';
      isAborted = false;
      const exportBlobs = [];

      try {
        for (let idx = 0; idx < selectedIndices.length; idx++) {
          if (isAborted) {
            document.getElementById('statusText').textContent = '변환이 중단되었습니다.';
            break;
          }

          const pageIndex = selectedIndices[idx];
          const p = docState.items[pageIndex];
          const cfg = getEffectiveItemSettings(pageIndex);
          const cScale = cfg.contentScale || 1.0;
          const { rotImg, isPageRot90, isImgRot90 } = getResolvedRotations(cfg);

          const pct = Math.round(((idx + 1) / selectedIndices.length) * 100);
          document.getElementById('progFill').style.width = `${pct}%`;
          document.getElementById('statusText').textContent = `이미지 변환 중: [${idx + 1} / ${selectedIndices.length}] (${pct}%)...`;

          await new Promise(r => setTimeout(r, 0));

          const tempCanvas = document.createElement('canvas');
          let origW = 0, origH = 0;
          let baseScaleW = 0, baseScaleH = 0;

          if (p.type === 'pdf') {
            const page = await p.doc.getPage(p.pageNum);
            const vp = await renderPdfPageToCanvas(page, cfg.scale, rotImg, tempCanvas);

            const origVp = page.getViewport({ scale: 1.0, rotation: 0 });
            origW = origVp.width;
            origH = origVp.height;
            baseScaleW = vp.width;
            baseScaleH = vp.height;
          } else {
            const rotRad = (rotImg * Math.PI) / 180;
            const srcRotW = isImgRot90 ? p.height : p.width;
            const srcRotH = isImgRot90 ? p.width : p.height;
            tempCanvas.width = srcRotW;
            tempCanvas.height = srcRotH;
            const tctx = tempCanvas.getContext('2d');
            const isTransparent = (cfg.format === 'png') && (cfg.transparentBg !== false);
            if (isTransparent) {
              tctx.clearRect(0, 0, srcRotW, srcRotH);
            } else {
              tctx.fillStyle = '#ffffff';
              tctx.fillRect(0, 0, srcRotW, srcRotH);
            }
            tctx.translate(srcRotW / 2, srcRotH / 2);
            tctx.rotate(rotRad);
            tctx.drawImage(p.imgObj, -p.width / 2, -p.height / 2);

            origW = p.width;
            origH = p.height;
            baseScaleW = srcRotW;
            baseScaleH = srcRotH;
          }

          const imgF = (p.type === 'pdf') ? 1 : getImagePageFactor(origW, origH);
          const baseOrigW = isPageRot90 ? origH : origW;
          const baseOrigH = isPageRot90 ? origW : origH;
          const scaleMul = (p.type === 'pdf') ? cfg.scale : imgF;
          const refW = baseOrigW * scaleMul, refH = baseOrigH * scaleMul;
          const isOrigLandscape = origW > origH;
          const orientOpt = cfg.orient || 'auto';
          const baseLandscape = orientOpt === 'l' || (orientOpt === 'auto' && isOrigLandscape);
          const isLandscape = isPageRot90 ? !baseLandscape : baseLandscape;
          const paper = resolvePaperGeometry(cfg.fit || cfg.pageSize || 'original', isLandscape, refW, refH, cfg.customW, cfg.customH);

          // 2단계: 최종 용지 캔버스 생성
          let finalCanvas = document.createElement('canvas');
          let fctx = finalCanvas.getContext('2d');

          let paperW, paperH;
          if (cfg.fit === 'original' || cfg.pageSize === 'original') {
            paperW = baseOrigW * scaleMul;
            paperH = baseOrigH * scaleMul;
          } else if (cfg.fit === 'custom' || cfg.pageSize === 'custom') {
            paperW = paper.widthPx;
            paperH = paper.heightPx;
          } else {
            if (paper.isLandscape) {
              paperW = Math.max(refW, Math.round(refH * paper.ratio));
              paperH = Math.round(paperW / paper.ratio);
            } else {
              paperH = Math.max(refH, Math.round(refW / paper.ratio));
              paperW = Math.round(paperH * paper.ratio);
            }
          }

          finalCanvas.width = paperW;
          finalCanvas.height = paperH;

          // 용지 배경 채우기 (흰색 또는 PNG 투명 처리)
          const isTransparent = (cfg.format === 'png') && (cfg.transparentBg !== false);
          if (isTransparent) {
            fctx.clearRect(0, 0, paperW, paperH);
          } else {
            fctx.fillStyle = '#ffffff';
            fctx.fillRect(0, 0, paperW, paperH);
          }

          const scaleX = cfg.scaleX !== undefined ? cfg.scaleX : 1.0;
          const brightness = cfg.brightness !== undefined ? cfg.brightness : 100;
          const contrast = cfg.contrast !== undefined ? cfg.contrast : 100;
          const offsetX = cfg.offsetX !== undefined ? cfg.offsetX : 0;
          const offsetY = cfg.offsetY !== undefined ? cfg.offsetY : 0;

          // 내용물 맞춤 크기 계산
          const baseScale = Math.min(paperW / baseScaleW, paperH / baseScaleH);
          const drawW = baseScaleW * baseScale * cScale * scaleX;
          const drawH = baseScaleH * baseScale * cScale;
          const shiftX = paperW * (offsetX / 100);
          const shiftY = paperH * (offsetY / 100);
          const posX = (paperW - drawW) / 2 + shiftX;
          const posY = (paperH - drawH) / 2 + shiftY;

          fctx.save();
          fctx.beginPath();
          fctx.rect(0, 0, paperW, paperH);
          fctx.clip();
          if (brightness !== 100 || contrast !== 100) {
            fctx.filter = `brightness(${brightness}%) contrast(${contrast}%)`;
          }
          drawPerspectiveQuad(fctx, tempCanvas, posX, posY, drawW, drawH, cfg.corners, cfg.trapExp || cfg.trapezoid);
          fctx.restore();
          tempCanvas.width = 0; tempCanvas.height = 0;

          let blob;
          const fmt = cfg.format || 'png';
          if (fmt === 'png') {
            blob = await new Promise(r => finalCanvas.toBlob(r, 'image/png'));
          } else if (fmt === 'jpeg') {
            blob = await new Promise(r => finalCanvas.toBlob(r, 'image/jpeg', 0.95));
          } else if (fmt === 'webp') {
            blob = await new Promise(r => finalCanvas.toBlob(r, 'image/webp', 0.95));
          } else if (fmt === 'bmp') {
            blob = CustomEncoders.canvasToBMP(fctx, finalCanvas.width, finalCanvas.height);
          } else if (fmt === 'ico') {
            blob = await CustomEncoders.canvasToICO(finalCanvas);
          } else if (fmt === 'tiff') {
            blob = CustomEncoders.canvasToTIFF(fctx, finalCanvas.width, finalCanvas.height);
          }

          finalCanvas.width = 0; finalCanvas.height = 0;

          const baseName = docState.fileName || 'document';
          const fileName = `${baseName}_p${String(idx + 1).padStart(3, '0')}.${fmt}`;
          exportBlobs.push({ name: fileName, blob });
        }

        if (!isAborted) {
          if (exportBlobs.length === 1) {
            // 단일 파일 다운로드
            const item = exportBlobs[0];
            const url = URL.createObjectURL(item.blob);
            const a = document.createElement('a');
            a.download = item.name;
            a.href = url;
            a.click();
            setTimeout(() => URL.revokeObjectURL(url), 2000);
            document.getElementById('statusText').textContent = '완료! 이미지 1장 저장됨.';
          } else {
            // 다중 파일 ZIP 압축 다운로드
            document.getElementById('statusText').textContent = 'ZIP 파일 생성 중...';
            const zip = new JSZip();
            exportBlobs.forEach(item => zip.file(item.name, item.blob));
            const zipBlob = await zip.generateAsync({ type: 'blob' });

            const url = URL.createObjectURL(zipBlob);
            const a = document.createElement('a');
            const baseName = docState.fileName || 'document';
            a.download = `${baseName}_images.zip`;
            a.href = url;
            a.click();
            setTimeout(() => URL.revokeObjectURL(url), 2000);

            document.getElementById('statusText').textContent = `완료! ${exportBlobs.length}장 이미지 저장됨.`;
          }
        }
      } catch (err) {
        console.error(err);
        document.getElementById('statusText').textContent = `오류: ${err.message}`;
      } finally {
        updateThumbCounts();
        document.getElementById('btnAbort').style.display = 'none';
      }
    }

    // 선택된 항목들을 순서대로 하나의 PDF 문서로 병합 저장 (PDF/이미지 혼합 완벽 지원)
    async function executeSaveMergedPdf() {
      if (docState.items.length === 0) return;
      const selectedIndices = [];
      docState.checkList.forEach((chk, i) => { if (chk && docState.items[i]) selectedIndices.push(i); });
      if (selectedIndices.length === 0) return;

      const btnSavePdf = document.getElementById('btnSavePdf');
      const btnSaveImg = document.getElementById('btnSaveImg');
      if (btnSavePdf) btnSavePdf.disabled = true;
      if (btnSaveImg) btnSaveImg.disabled = true;
      document.getElementById('btnAbort').style.display = 'inline-block';
      document.getElementById('progWrap').style.display = 'block';
      isAborted = false;

      const { jsPDF } = window.jspdf;
      let newPdfDoc = null;

      try {
        for (let idx = 0; idx < selectedIndices.length; idx++) {
          if (isAborted) {
            document.getElementById('statusText').textContent = 'PDF 생성이 중단되었습니다.';
            break;
          }

          const pageIndex = selectedIndices[idx];
          const p = docState.items[pageIndex];
          const cfg = getEffectiveItemSettings(pageIndex);

          const pct = Math.round(((idx + 1) / selectedIndices.length) * 100);
          document.getElementById('progFill').style.width = `${pct}%`;
          document.getElementById('statusText').textContent = `PDF 생성 중: [${idx + 1} / ${selectedIndices.length}] (${pct}%)...`;

          await new Promise(r => setTimeout(r, 0));

          const tempCanvas = document.createElement('canvas');
          let origW = 0, origH = 0;
          let baseScaleW = 0, baseScaleH = 0;

          if (p.type === 'pdf') {
            const page = await p.doc.getPage(p.pageNum);
            const vp = await renderPdfPageToCanvas(page, 3.0, rotImg, tempCanvas);

            const origVp = page.getViewport({ scale: 1.0, rotation: 0 });
            origW = origVp.width;
            origH = origVp.height;
            baseScaleW = vp.width;
            baseScaleH = vp.height;
          } else {
            const rotRad = (rotImg * Math.PI) / 180;
            const srcRotW = isImgRot90 ? p.height : p.width;
            const srcRotH = isImgRot90 ? p.width : p.height;
            tempCanvas.width = srcRotW;
            tempCanvas.height = srcRotH;
            const tctx = tempCanvas.getContext('2d');
            tctx.fillStyle = '#ffffff';
            tctx.fillRect(0, 0, srcRotW, srcRotH);
            tctx.translate(srcRotW / 2, srcRotH / 2);
            tctx.rotate(rotRad);
            tctx.drawImage(p.imgObj, -p.width / 2, -p.height / 2);

            origW = p.width;
            origH = p.height;
            baseScaleW = srcRotW;
            baseScaleH = srcRotH;
          }

          const imgF = (p.type === 'pdf') ? 1 : getImagePageFactor(origW, origH);
          const baseOrigW = isPageRot90 ? origH : origW;
          const baseOrigH = isPageRot90 ? origW : origH;
          const scaleMul = (p.type === 'pdf') ? 3.0 : imgF;
          const refW = baseOrigW * scaleMul, refH = baseOrigH * scaleMul;
          const isOrigLandscape = origW > origH;
          const orientOpt = cfg.orient || 'auto';
          const baseLandscape = orientOpt === 'l' || (orientOpt === 'auto' && isOrigLandscape);
          const isLandscape = isPageRot90 ? !baseLandscape : baseLandscape;
          const paper = resolvePaperGeometry(cfg.fit || cfg.pageSize || 'original', isLandscape, refW, refH, cfg.customW, cfg.customH);

          let paperW, paperH;
          if (cfg.fit === 'original' || cfg.pageSize === 'original') {
            paperW = baseOrigW * scaleMul;
            paperH = baseOrigH * scaleMul;
          } else if (cfg.fit === 'custom' || cfg.pageSize === 'custom') {
            paperW = paper.widthPx;
            paperH = paper.heightPx;
          } else {
            if (paper.isLandscape) {
              paperW = Math.max(refW, Math.round(refH * paper.ratio));
              paperH = Math.round(paperW / paper.ratio);
            } else {
              paperH = Math.max(refH, Math.round(refW / paper.ratio));
              paperW = Math.round(paperH * paper.ratio);
            }
          }

          let finalCanvas = document.createElement('canvas');
          let fctx = finalCanvas.getContext('2d');
          finalCanvas.width = paperW;
          finalCanvas.height = paperH;
          fctx.fillStyle = '#ffffff';
          fctx.fillRect(0, 0, paperW, paperH);

          const scaleX = cfg.scaleX !== undefined ? cfg.scaleX : 1.0;
          const brightness = cfg.brightness !== undefined ? cfg.brightness : 100;
          const contrast = cfg.contrast !== undefined ? cfg.contrast : 100;
          const offsetX = cfg.offsetX !== undefined ? cfg.offsetX : 0;
          const offsetY = cfg.offsetY !== undefined ? cfg.offsetY : 0;

          const baseScale = Math.min(paperW / baseScaleW, paperH / baseScaleH);
          const drawW = baseScaleW * baseScale * cScale * scaleX;
          const drawH = baseScaleH * baseScale * cScale;
          const shiftX = paperW * (offsetX / 100);
          const shiftY = paperH * (offsetY / 100);
          const posX = (paperW - drawW) / 2 + shiftX;
          const posY = (paperH - drawH) / 2 + shiftY;

          fctx.save();
          fctx.beginPath();
          fctx.rect(0, 0, paperW, paperH);
          fctx.clip();
          if (brightness !== 100 || contrast !== 100) {
            fctx.filter = `brightness(${brightness}%) contrast(${contrast}%)`;
          }
          drawPerspectiveQuad(fctx, tempCanvas, posX, posY, drawW, drawH, cfg.corners, cfg.trapExp || cfg.trapezoid);
          fctx.restore();
          tempCanvas.width = 0; tempCanvas.height = 0;

          // 무손실 PNG 데이터 추출
          const imgDataUrl = finalCanvas.toDataURL('image/png');
          finalCanvas.width = 0; finalCanvas.height = 0;

          const orientation = isLandscape ? 'l' : 'p';
          if (idx === 0) {
            newPdfDoc = new jsPDF({
              orientation: orientation,
              unit: 'px',
              format: [paperW, paperH],
              compress: true
            });
          } else {
            newPdfDoc.addPage([paperW, paperH], orientation);
          }

          newPdfDoc.addImage(imgDataUrl, 'PNG', 0, 0, paperW, paperH, undefined, 'FAST');
        }

        if (!isAborted && newPdfDoc) {
          const baseName = docState.fileName || 'document';

        document.getElementById('btnAbort').style.display = 'none';
