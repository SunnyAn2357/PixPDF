<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 배경 그라데이션 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042024"/>
      <stop offset="50%" stop-color="#0d3b40"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <!-- 앰비언트 글로우 -->
    <radialGradient id="ambientGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0d9488" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#042024" stop-opacity="0"/>
    </radialGradient>

    <!-- 문서 본체 그라데이션 -->
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="10%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- PDF 라벨 그라데이션 -->
    <linearGradient id="pdfBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- 이미지 뷰포트 그라데이션 (선셋/마운틴) -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#818cf8"/>
      <stop offset="85%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="mountain1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="mountain2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <!-- 접힌 귀(Dog-ear) 그라데이션 -->
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- 픽셀 큐브 그라데이션 -->
    <linearGradient id="pixelGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="pixelGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="pixelGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- 상단 글래스 하이라이트 -->
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- 그림자 필터 -->
    <filter id="shadowLarge" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#021417" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#021417" flood-opacity="0.4"/>
    </filter>
    <filter id="glowPixel" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2dd4bf" flood-opacity="0.5"/>
    </filter>
    <filter id="foldShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-3" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
    
    <clipPath id="viewportClip">
      <rect x="142" y="166" width="186" height="156" rx="10"/>
    </clipPath>
    <clipPath id="docBodyClip">
      <path d="M 116 88 L 302 88 L 362 148 L 362 420 A 18 18 0 0 1 344 438 L 134 438 A 18 18 0 0 1 116 420 Z"/>
    </clipPath>
  </defs>

  <!-- 1. 앱 스퀴클 (둥근 사각형) 배경 -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#ambientGlow)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="110.5" ry="110.5" fill="none" stroke="rgba(255, 255, 255, 0.18)" stroke-width="3"/>

  <!-- 2. 문서 시트 본체 (PDF 백그라운드) -->
  <g filter="url(#shadowLarge)">
    <!-- 종이 본체 -->
    <path d="M 116 88 L 302 88 L 362 148 L 362 420 A 18 18 0 0 1 344 438 L 134 438 A 18 18 0 0 1 116 420 Z" fill="url(#docGrad)"/>
    
    <!-- 접힌 귀 (Top-Right Dog-Ear Fold) -->
    <path d="M 302 88 L 302 136 A 12 12 0 0 0 314 148 L 362 148 Z" fill="url(#foldGrad)" filter="url(#foldShadow)"/>
    <path d="M 302 88 L 362 148 L 302 148 Z" fill="#f8fafc"/>
  </g>

  <!-- 3. 문서 헤더: PDF 뱃지 및 문서 라인 장식 -->
  <g clip-path="url(#docBodyClip)">
    <!-- 상단 PDF 미니 태그 -->
    <rect x="142" y="118" width="68" height="28" rx="6" fill="url(#pdfBadgeGrad)"/>
    <text x="176" y="137" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">PDF</text>
    
    <!-- 장식용 헤더 라인 -->
    <rect x="222" y="124" width="70" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="222" y="136" width="45" height="6" rx="3" fill="#e2e8f0"/>

    <!-- 4. 문서 내부 '이미지 뷰포트' (풍경 일러스트) -->
    <rect x="140" y="164" width="190" height="160" rx="12" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
    <g clip-path="url(#viewportClip)">
      <rect x="142" y="166" width="186" height="156" fill="url(#skyGrad)"/>
      <!-- 태양 / 조리개 -->
      <circle cx="270" cy="208" r="22" fill="url(#sunGrad)" opacity="0.95"/>
      <!-- 산 1 (보라) -->
      <path d="M 180 322 L 236 244 L 290 322 Z" fill="url(#mountain1)"/>
      <!-- 산 2 (청록) -->
      <path d="M 132 322 L 188 226 L 246 322 Z" fill="url(#mountain2)"/>
      <path d="M 242 322 L 284 262 L 334 322 Z" fill="#047857"/>
    </g>

    <!-- 문서 하단 텍스트 라인 장식 -->
    <rect x="142" y="348" width="186" height="8" rx="4" fill="#94a3b8"/>
    <rect x="142" y="366" width="140" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="142" y="384" width="90" height="8" rx="4" fill="#e2e8f0"/>
  </g>

  <!-- 5. 픽셀 분해 & 양방향 변환 이펙트 (Pix / Matrix Transformation) -->
  <g filter="url(#glowPixel)">
    <!-- 흩날리며 변환되는 홀로그래픽 픽셀 타일들 -->
    <rect x="330" y="276" width="34" height="34" rx="7" fill="url(#pixelGrad1)"/>
    <rect x="372" y="248" width="30" height="30" rx="6" fill="url(#pixelGrad2)"/>
    <rect x="348" y="222" width="24" height="24" rx="5" fill="url(#pixelGrad3)"/>
    <rect x="378" y="294" width="22" height="22" rx="5" fill="#38bdf8"/>
    <rect x="410" y="266" width="18" height="18" rx="4" fill="#34d399"/>
    <rect x="408" y="226" width="14" height="14" rx="3" fill="#facc15"/>
    <rect x="334" y="322" width="18" height="18" rx="4" fill="#2dd4bf" opacity="0.85"/>
  </g>

  <!-- 6. 양방향 순환 변환 화살표 (Dual Conversion Loop Badge) -->
  <g filter="url(#glowPixel)">
    <circle cx="360" cy="380" r="32" fill="#042024" stroke="#2dd4bf" stroke-width="3"/>
    <!-- 상하 순환 곡선 화살표 -->
    <path d="M 346 374 A 14 14 0 0 1 374 372" fill="none" stroke="#2dd4bf" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="378,367 378,377 368,374" fill="#2dd4bf"/>
    <path d="M 374 386 A 14 14 0 0 1 346 388" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="342,393 342,383 352,386" fill="#38bdf8"/>
  </g>

  <!-- 7. 상단 글래스 하이라이트 (Gloss Reflection) -->
  <path d="M 18 128 C 18 68, 68 18, 128 18 L 384 18 C 220 50, 40 180, 18 360 Z" fill="url(#glassSheen)"/>
</svg>
