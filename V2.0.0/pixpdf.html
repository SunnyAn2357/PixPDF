    // -------------------------------------------------------------
    // [핵심] 전역 스마트 드래그 앤 드롭 라우터 (거슬리는 초록 오버레이 제거)
    // -------------------------------------------------------------
    window.addEventListener('dragover', (e) => {
      e.preventDefault();
    });

    window.addEventListener('drop', async (e) => {
      e.preventDefault();
      if (!e.dataTransfer.files || e.dataTransfer.files.length === 0) return;

      const files = Array.from(e.dataTransfer.files);
      
      // 드롭된 위치 파악
      const colThumbElem = document.getElementById('colThumb');
      const isOverThumb = colThumbElem.contains(e.target);

      if (isOverThumb) {
        // 1열 썸네일 영역에 떨어진 경우 (위치 정밀 삽입)
        await processFiles(files, -1, 'thumb-area');
      } else {
        // 가운데 창이나 오른쪽 창 등 화면 어디든 떨어진 경우
        await processFiles(files, -1, 'center-area');
      }
    });

    // 통합 파일 처리기 (PDF ↔ 이미지 상호 삽입 및 피커 연동)
    async function processFiles(files, customInsertIndex = -1, targetArea = 'center-area') {
      initHistoryAnchor();
      const pdfFile = files.find(f => f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf'));
      const imgFiles = files.filter(f => f.type.startsWith('image/') || /\.(png|jpe?g|webp|bmp)$/i.test(f.name));

      // [엄격한 파일 드롭 & 모드 라우팅 규칙]
      // 1) PDF와 이미지가 섞여서 동시에 드롭된 경우 전체 무시 (작업 취소)
      if (pdfFile && imgFiles.length > 0) {
        return;
      }

      // 2) 이미지 편집창에는 절대 PDF 진입 불가
      if (appMode === 'img2pdf' && pdfFile) {
        return;
      }

      // 3) 앱 초기 상태(PDF 목록 비어있음)에서 이미지만 들어온 경우 자동으로 이미지 편집창으로 전환
      if (!pdfFile && imgFiles.length > 0 && appMode === 'pdf2img' && pdfState.pages.length === 0) {
        setAppMode('img2pdf');
        customInsertIndex = -1;
      }

      // 1. PDF 모드일 때 파일 처리
      if (appMode === 'pdf2img') {
        if (pdfFile) {
          document.getElementById('statusText').textContent = 'PDF 문서를 로드하는 중...';
          try {
            const arrayBuf = await pdfFile.arrayBuffer();
            const loadedDoc = await pdfjsLib.getDocument({ data: arrayBuf }).promise;
            const total = loadedDoc.numPages;

            if (pdfState.pages.length === 0) {
              // [최초의 PDF 문서 로드]: 전체 페이지를 기본 순서대로 등록
              pdfState.doc = loadedDoc;
              pdfState.fileName = pdfFile.name.replace(/\.[^/.]+$/, "");
              pdfState.pages = Array.from({ length: total }, (_, i) => ({
                type: 'pdf',
                doc: loadedDoc,
                pageNum: i + 1,
                name: `${pdfFile.name} (p.${i + 1})`,
                settings: {
                  ...pdfState.globalSettings,
                  rotTarget: { ...pdfState.globalSettings.rotTarget }
                }
              }));
              pdfState.checkList = new Array(total).fill(true);
              pdfState.currentIndex = 0;
              document.getElementById('chkSelectAll').checked = true;
              document.getElementById('statusText').textContent = `${total}페이지 문서 대기 중`;

              await refreshWorkspaceDisplay();
              await loadMainViewer(0);
            } else {
              // [이미 문서가 열려 있는 상태에서 추가 PDF를 삽입하는 경우]
              if (total === 1) {
                // 단일 1페이지 문서는 피커 팝업 없이 즉시 삽입!
                const newPage = {
                  type: 'pdf',
                  doc: loadedDoc,
                  pageNum: 1,
                  name: `${pdfFile.name} (p.1)`,
                  settings: {
                    ...pdfState.globalSettings,
                    rotTarget: { ...pdfState.globalSettings.rotTarget }
                  }
                };
                const insertAt = customInsertIndex >= 0 ? customInsertIndex : (pdfState.currentIndex + 1);
                pdfState.pages.splice(insertAt, 0, newPage);
                pdfState.checkList.splice(insertAt, 0, true);
                pdfState.currentIndex = insertAt;
                await refreshWorkspaceDisplay();
                await loadMainViewer(insertAt);
                document.getElementById('statusText').textContent = '1페이지 PDF 삽입 완료';
              } else {
                // 다중 페이지 PDF 문서는 사용자가 필요한 페이지만 선택할 수 있도록 피커 모달 오픈!
                openPdfPicker(loadedDoc, pdfFile, customInsertIndex);
              }
            }
          } catch (err) {
            console.error(err);
            document.getElementById('statusText').textContent = 'PDF 문서를 읽을 수 없습니다.';
          }
          return;
        }

        if (imgFiles.length > 0) {
          // PDF 문서 중간 또는 끝에 이미지 파일 삽입!
          document.getElementById('statusText').textContent = '이미지를 PDF 페이지로 삽입하는 중...';
          const newPages = [];
          for (const file of imgFiles) {
            const imgObj = await loadImageSafe(file);
            newPages.push({
              type: 'image',
              imgObj: imgObj,
              file: file,
              name: file.name,
              width: imgObj.width,
              height: imgObj.height,
              settings: {
                ...pdfState.globalSettings,
                rotTarget: { ...pdfState.globalSettings.rotTarget }
              }
            });
          }

          const newChecks = new Array(newPages.length).fill(true);
          const isFirst = (pdfState.pages.length === 0);
          let targetIdx = 0;

          if (isFirst) {
            pdfState.pages.push(...newPages);
            pdfState.checkList.push(...newChecks);
            targetIdx = 0;
          } else {
            const insertAt = customInsertIndex >= 0 ? customInsertIndex : (pdfState.currentIndex + 1);
            pdfState.pages.splice(insertAt, 0, ...newPages);
            pdfState.checkList.splice(insertAt, 0, ...newChecks);
            targetIdx = insertAt;
          }

          pdfState.currentIndex = targetIdx;
          await refreshWorkspaceDisplay();
          await loadMainViewer(targetIdx);
          document.getElementById('statusText').textContent = `${newPages.length}개 이미지가 삽입되었습니다.`;
          return;
        }
      } else {
        // 2. 이미지 모드일 때 파일 처리
        if (pdfFile) return; // 이미지 편집창에는 PDF를 절대 넣지 않음

        if (imgFiles.length > 0) {
          document.getElementById('statusText').textContent = '이미지를 읽어오는 중...';
          const newItems = [];
          for (const file of imgFiles) {
            try {
              const imgObj = await loadImageSafe(file);
              newItems.push({
                file: file,
                imgObj: imgObj,
                name: file.name,
                width: imgObj.width,
                height: imgObj.height,
                settings: {
                  ...imgState.globalSettings,
                  rotTarget: { ...imgState.globalSettings.rotTarget }
                }
              });
            } catch (err) {
              console.error('이미지 로드 오류:', file.name, err);
            }
          }

          if (newItems.length === 0) {
            document.getElementById('statusText').textContent = '유효한 이미지를 불러오지 못했습니다.';
            await refreshWorkspaceDisplay();
            return;
          }

          const newChecks = new Array(newItems.length).fill(true);
          const isFirstLoad = (imgState.items.length === 0);
          let targetViewIdx = 0;

          if (isFirstLoad) {
            imgState.items.push(...newItems);
            imgState.checkList.push(...newChecks);
            targetViewIdx = 0;
          } else {
            if (customInsertIndex >= 0) {
              imgState.items.splice(customInsertIndex, 0, ...newItems);
              imgState.checkList.splice(customInsertIndex, 0, ...newChecks);
              targetViewIdx = customInsertIndex;
            } else {
              const insertPos = imgState.currentIndex + 1;
              imgState.items.splice(insertPos, 0, ...newItems);
              imgState.checkList.splice(insertPos, 0, ...newChecks);
              targetViewIdx = insertPos;
            }
          }

          imgState.currentIndex = isFirstLoad ? 0 : targetViewIdx;
          await refreshWorkspaceDisplay();
          await loadMainViewer(imgState.currentIndex);
          document.getElementById('statusText').textContent = `${imgState.items.length}개 이미지 준비 완료`;
        }
      }
    }

    async function loadImageSafe(file) {
      if (typeof createImageBitmap === 'function') {
        try {
          const bmp = await createImageBitmap(file);
          return bmp;
        } catch (e) {
          console.warn('createImageBitmap failed, fallback to FileReader', e);
        }
      }
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = (err) => reject(err || new Error("이미지 로드 실패"));
          img.src = reader.result;
        };
        reader.onerror = (err) => reject(err || new Error("파일 읽기 실패"));
        reader.readAsDataURL(file);
      });
    }

    // 1열 PDF 썸네일 렌더링 (순서 변경, 개별 삭제, 드래그 드롭 위치 삽입 지원)
    async function renderPdfThumbnailList() {
      const container = document.getElementById('thumbList');
      container.innerHTML = '';
      if (pdfState.pages.length === 0) {
        updateThumbCounts();
        return;
      }

      pdfState.pages.forEach((pageItem, idx) => {
        const card = document.createElement('div');
        card.className = `thumb-card ${idx === pdfState.currentIndex ? 'active' : ''}`;
        card.id = `thumb-card-${idx}`;
        card.draggable = true;
        card.onclick = (e) => {
          if (e.target.closest('input[type="checkbox"]') || e.target.closest('button')) return;
          loadMainViewer(idx);
          if (window.innerWidth <= 768) {
            toggleMobileControl(true);
          }
        };

        card.addEventListener('dragstart', (e) => {
          draggedCardIndex = idx;
          card.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', idx);
        });

        card.addEventListener('dragend', () => {
          card.classList.remove('dragging');
          clearThumbDropLines();
        });

        card.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.stopPropagation();
          const rect = card.getBoundingClientRect();
          const relY = e.clientY - rect.top;
          clearThumbDropLines();
          if (relY < rect.height / 2) {
            card.classList.add('drag-over-top');
          } else {
            card.classList.add('drag-over-bottom');
          }
        });

        card.addEventListener('dragleave', (e) => {
          e.stopPropagation();
          card.classList.remove('drag-over-top', 'drag-over-bottom');
        });

        // 카드 사이에 드롭 (새 파일 삽입 또는 순서 이동)
        card.addEventListener('drop', async (e) => {
          e.preventDefault();
          e.stopPropagation();
          const rect = card.getBoundingClientRect();
          const isTop = (e.clientY - rect.top) < rect.height / 2;
          let insertAt = isTop ? idx : idx + 1;
          clearThumbDropLines();

          if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
            // [왼쪽 창에서 위치를 정해서 삽입!]
            await processFiles(Array.from(e.dataTransfer.files), insertAt, 'thumb-slot');
          } else if (draggedCardIndex !== null && draggedCardIndex !== idx) {
            // 내부 카드 순서 이동 (아이템 및 체크 상태 동시 이동)
            const movedItem = pdfState.pages.splice(draggedCardIndex, 1)[0];
            const movedChk = pdfState.checkList.splice(draggedCardIndex, 1)[0];
            if (draggedCardIndex < insertAt) insertAt--;
            pdfState.pages.splice(insertAt, 0, movedItem);
            pdfState.checkList.splice(insertAt, 0, movedChk);
            pdfState.currentIndex = insertAt;
            await renderPdfThumbnailList();
            loadMainViewer(insertAt);
          }
          draggedCardIndex = null;
        });

        const header = document.createElement('div');
        header.className = 'thumb-card-header';

        const titleSpan = document.createElement('span');
        const badgeType = pageItem.type === 'image' ? ' 🖼️' : '';
        titleSpan.textContent = `#${idx + 1}${badgeType}`;
        header.appendChild(titleSpan);

        const headerRight = document.createElement('div');
        headerRight.style.display = 'flex';
        headerRight.style.alignItems = 'center';
        headerRight.style.gap = '8px';

        const btnRow = document.createElement('div');
        btnRow.className = 'thumb-btn-row';

        const btnUp = document.createElement('button');
        btnUp.className = 'btn-icon-sm';
        btnUp.textContent = '▲';
        btnUp.title = '위로 이동';
        btnUp.onclick = (e) => { e.stopPropagation(); movePdfPageOrder(idx, -1); };

        const btnDown = document.createElement('button');
        btnDown.className = 'btn-icon-sm';
        btnDown.textContent = '▼';
        btnDown.title = '아래로 이동';
        btnDown.onclick = (e) => { e.stopPropagation(); movePdfPageOrder(idx, 1); };

        const btnDel = document.createElement('button');
        btnDel.className = 'btn-icon-sm';
        btnDel.textContent = '✕';
        btnDel.title = '삭제';
        btnDel.onclick = (e) => { e.stopPropagation(); removePdfPageItem(idx); };

        btnRow.appendChild(btnUp);
        btnRow.appendChild(btnDown);
        btnRow.appendChild(btnDel);
        headerRight.appendChild(btnRow);

        const touchWrap = document.createElement('label');
        touchWrap.className = 'chk-touch-wrap';
        touchWrap.onclick = (e) => e.stopPropagation();

        const chk = document.createElement('input');
        chk.type = 'checkbox';
        chk.checked = pdfState.checkList[idx] !== false;
        chk.onchange = () => {
          pdfState.checkList[idx] = chk.checked;
          updateThumbCounts();
        };
        touchWrap.appendChild(chk);
        headerRight.appendChild(touchWrap);

        header.appendChild(headerRight);
        card.appendChild(header);

        const thumbCanvasWrap = document.createElement('div');
        thumbCanvasWrap.className = 'thumb-canvas-wrap';
        const thumbCanvas = document.createElement('canvas');
        thumbCanvas.id = `thumb-canvas-pdf-${idx}`;
        thumbCanvasWrap.appendChild(thumbCanvas);
        card.appendChild(thumbCanvasWrap);
        container.appendChild(card);

        // 비동기 경량 썸네일 렌더링
        (async () => {
          const cfg = getEffectivePdfSettings(idx);
          const { rotImg, isImgRot90 } = getResolvedRotations(cfg);
          if (pageItem.type === 'pdf') {
            const page = await pageItem.doc.getPage(pageItem.pageNum);
            await renderPdfPageToCanvas(page, 0.65, rotImg, thumbCanvas);
          } else {
            const rotRad = (rotImg * Math.PI) / 180;
            const baseTw = 360;
            const baseTh = Math.round((pageItem.height / pageItem.width) * baseTw);
            const tw = isImgRot90 ? baseTh : baseTw;
            const th = isImgRot90 ? baseTw : baseTh;
            thumbCanvas.width = tw;
            thumbCanvas.height = th;
            const tctx = thumbCanvas.getContext('2d');
            tctx.save();
            tctx.translate(tw / 2, th / 2);
            tctx.rotate(rotRad);
            tctx.drawImage(pageItem.imgObj, -baseTw / 2, -baseTh / 2, baseTw, baseTh);
            tctx.restore();
          }
          updateViewerEdits(idx);
        })();
      });

      updateThumbCounts();
    }

    async function movePdfPageOrder(index, delta) {
      const target = index + delta;
      if (target < 0 || target >= pdfState.pages.length) return;
      const tempItem = pdfState.pages[index];
      const tempChk = pdfState.checkList[index];
      pdfState.pages[index] = pdfState.pages[target];
      pdfState.checkList[index] = pdfState.checkList[target];
      pdfState.pages[target] = tempItem;
      pdfState.checkList[target] = tempChk;
      pdfState.currentIndex = target;
      await renderPdfThumbnailList();
      loadMainViewer(target);
    }

    async function removePdfPageItem(index) {
      pdfState.pages.splice(index, 1);
      pdfState.checkList.splice(index, 1);
      if (pdfState.currentIndex >= pdfState.pages.length) {
        pdfState.currentIndex = Math.max(0, pdfState.pages.length - 1);
      }
      await renderPdfThumbnailList();
      if (pdfState.pages.length > 0) {
        loadMainViewer(pdfState.currentIndex);
      } else {
        refreshWorkspaceDisplay();
      }
    }

    // -------------------------------------------------------------
    // [PDF 페이지 선택 모달 (Picker Modal) 제어 함수들]
    // -------------------------------------------------------------
    function openPdfPicker(pdfDoc, file, targetInsertIndex = -1) {
      pickerState.doc = pdfDoc;
      pickerState.file = file;
      pickerState.total = pdfDoc.numPages;
      pickerState.selected = new Array(pdfDoc.numPages).fill(true);
      pickerState.targetInsertIndex = targetInsertIndex;

      const modal = document.getElementById('modalPdfPicker');
      const title = document.getElementById('pickerModalTitle');
      const posText = document.getElementById('pickerTargetPosText');
      const chkAll = document.getElementById('chkPickerSelectAll');
      const txtRange = document.getElementById('txtPickerRange');

      title.textContent = `📑 [${file.name}] 페이지 선택 (${pdfDoc.numPages}페이지)`;
      chkAll.checked = true;
      txtRange.value = '';

      if (targetInsertIndex >= 0 && targetInsertIndex < pdfState.pages.length) {
        posText.textContent = `삽입 위치: #${targetInsertIndex + 1} 앞`;
      } else {
        posText.textContent = `삽입 위치: 문서 끝`;
      }

      modal.classList.add('show');
      updatePickerCount();
      renderPickerThumbnails();
      try { history.pushState({ appLayer: 'pdfPicker' }, ''); } catch (e) {}
    }

    function closePdfPickerModal(syncHistory = true) {
      const modal = document.getElementById('modalPdfPicker');
      if (modal && modal.classList.contains('show')) {
        modal.classList.remove('show');
        if (syncHistory && history.state && (history.state.appLayer === 'pdfPicker' || history.state.modal === 'pdfPicker')) {
          isClosingLayerProgrammatically = true;
          history.back();
        }
      }
      pickerState.doc = null;
      pickerState.file = null;
    }

    function onPickerModalBackdropClick(e) {
      if (e.target.id === 'modalPdfPicker') {
        closePdfPickerModal(true);
      }
    }

    function updatePickerCount() {
      const selectedCount = pickerState.selected.filter(Boolean).length;
      const countText = document.getElementById('pickerCountText');
      const chkAll = document.getElementById('chkPickerSelectAll');
      if (countText) countText.textContent = `(${selectedCount} / ${pickerState.total} 선택됨)`;
      if (chkAll) chkAll.checked = (pickerState.total > 0 && selectedCount === pickerState.total);
    }

    const chkPickerSelectAllElem = document.getElementById('chkPickerSelectAll');
    if (chkPickerSelectAllElem) {
      chkPickerSelectAllElem.addEventListener('change', (e) => {
        const checked = e.target.checked;
        pickerState.selected = pickerState.selected.map(() => checked);
        const chks = document.querySelectorAll('.picker-card input[type="checkbox"]');
        chks.forEach((c, idx) => {
          c.checked = checked;
          const card = document.getElementById(`picker-card-${idx}`);
          if (card) card.classList.toggle('selected', checked);
        });
        updatePickerCount();
      });
    }

    function applyPickerRangeFilter() {
      const input = document.getElementById('txtPickerRange');
      if (!input) return;
      const val = input.value.trim();
      if (!val) return;

      const selectedSet = new Set();
      const parts = val.split(',');
      for (const part of parts) {
        const trimmed = part.trim();
        if (!trimmed) continue;
        if (trimmed.includes('-')) {
          const [startStr, endStr] = trimmed.split('-');
          const start = parseInt(startStr, 10);
          const end = parseInt(endStr, 10);
          if (!isNaN(start) && !isNaN(end)) {
            const min = Math.max(1, Math.min(start, end));
            const max = Math.min(pickerState.total, Math.max(start, end));
            for (let p = min; p <= max; p++) selectedSet.add(p);
          }
        } else {
          const p = parseInt(trimmed, 10);
          if (!isNaN(p) && p >= 1 && p <= pickerState.total) {
            selectedSet.add(p);
          }
        }
      }

      pickerState.selected = pickerState.selected.map((_, i) => selectedSet.has(i + 1));
      pickerState.selected.forEach((isSelected, idx) => {
        const chk = document.getElementById(`picker-chk-${idx}`);
        if (chk) chk.checked = isSelected;
        const card = document.getElementById(`picker-card-${idx}`);
        if (card) card.classList.toggle('selected', isSelected);
      });
      updatePickerCount();
    }

    async function renderPickerThumbnails() {
      const grid = document.getElementById('pickerGrid');
      grid.innerHTML = '';
      const total = pickerState.total;
      const doc = pickerState.doc;
      if (!doc) return;

      for (let i = 1; i <= total; i++) {
        const card = document.createElement('div');
        card.className = `picker-card ${pickerState.selected[i - 1] ? 'selected' : ''}`;
        card.id = `picker-card-${i - 1}`;

        const numBadge = document.createElement('span');
        numBadge.className = 'picker-card-num';
        numBadge.textContent = `#${i}`;
        card.appendChild(numBadge);

        const chk = document.createElement('input');
        chk.type = 'checkbox';
        chk.id = `picker-chk-${i - 1}`;
        chk.className = 'picker-card-chk';
        chk.checked = pickerState.selected[i - 1];
        chk.onclick = (e) => e.stopPropagation();
        chk.onchange = () => {
          pickerState.selected[i - 1] = chk.checked;
          card.classList.toggle('selected', chk.checked);
          updatePickerCount();
        };
        card.appendChild(chk);

        card.onclick = () => {
          chk.checked = !chk.checked;
          pickerState.selected[i - 1] = chk.checked;
          card.classList.toggle('selected', chk.checked);
          updatePickerCount();
        };

        // 경량 썸네일 캔버스 (scale 0.25 로 메모리 보호)
        const canvas = document.createElement('canvas');
        canvas.className = 'picker-thumb-canvas';
        card.appendChild(canvas);
        grid.appendChild(card);

        // 비동기 렌더링
        (async () => {
          try {
            const page = await doc.getPage(i);
            const vp = page.getViewport({ scale: 0.25 });
            canvas.width = vp.width;
            canvas.height = vp.height;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, vp.width, vp.height);
            await page.render({ canvasContext: ctx, viewport: vp }).promise;
          } catch (e) {
            console.error(e);
          }
        })();

        if (i % 6 === 0) {
          await new Promise(r => setTimeout(r, 0));
        }
      }
    }

    async function confirmPickerInsert() {
      const selectedNums = [];
      pickerState.selected.forEach((sel, i) => {
        if (sel) selectedNums.push(i + 1);
      });

      if (selectedNums.length === 0) {
        alert('삽입할 페이지를 1개 이상 선택해 주세요.');
        return;
      }

      const newPages = selectedNums.map(pageNum => ({
        type: 'pdf',
        doc: pickerState.doc,
        pageNum: pageNum,
        name: `${pickerState.file.name} (p.${pageNum})`,
        settings: {
          ...pdfState.globalSettings,
          rotTarget: { ...pdfState.globalSettings.rotTarget }
        }
      }));

      const newChecks = new Array(newPages.length).fill(true);
      const targetPos = pickerState.targetInsertIndex;

      if (targetPos >= 0 && targetPos <= pdfState.pages.length) {
        pdfState.pages.splice(targetPos, 0, ...newPages);
        pdfState.checkList.splice(targetPos, 0, ...newChecks);
        pdfState.currentIndex = targetPos;
      } else {
        const insertPos = pdfState.pages.length;
        pdfState.pages.splice(insertPos, 0, ...newPages);
        pdfState.checkList.splice(insertPos, 0, ...newChecks);
        pdfState.currentIndex = insertPos;
      }

      closePdfPickerModal();
      await refreshWorkspaceDisplay();
      await loadMainViewer(pdfState.currentIndex);
      document.getElementById('statusText').textContent = `${newPages.length}개 페이지가 삽입되었습니다.`;
    }

    document.getElementById('chkSelectAll').addEventListener('change', (e) => {
      const checked = e.target.checked;
      if (appMode === 'pdf2img') {
        pdfState.checkList = pdfState.checkList.map(() => checked);
      } else {
        imgState.checkList = imgState.checkList.map(() => checked);
      }
      document.querySelectorAll('#thumbList input[type="checkbox"]').forEach(c => c.checked = checked);
      updateThumbCounts();
    });

    function updateThumbCounts() {
      const btnSavePdf = document.getElementById('btnSavePdf');
      const btnSaveImg = document.getElementById('btnSaveImg');
      const btnAction = document.getElementById('btnAction');

      if (appMode === 'pdf2img') {
        if (pdfState.pages.length === 0) {
          document.getElementById('thumbCount').textContent = '0 항목';
          document.getElementById('chkSelectAll').checked = false;
          if (btnSavePdf) btnSavePdf.disabled = true;
          if (btnSaveImg) btnSaveImg.disabled = true;
          if (btnAction) btnAction.disabled = true;
          return;
        }
        const selected = pdfState.checkList.filter(Boolean).length;
        const total = pdfState.pages.length;
        document.getElementById('thumbCount').textContent = `${selected} / ${total} 선택`;
        document.getElementById('chkSelectAll').checked = (total > 0 && selected === total);
        const isDisabled = selected === 0;
        if (btnSavePdf) btnSavePdf.disabled = isDisabled;
        if (btnSaveImg) btnSaveImg.disabled = isDisabled;
        if (btnAction) btnAction.disabled = isDisabled;
      } else {
        if (imgState.items.length === 0) {
          document.getElementById('thumbCount').textContent = '0 항목';
          document.getElementById('chkSelectAll').checked = false;
          if (btnSavePdf) btnSavePdf.disabled = true;
          if (btnSaveImg) btnSaveImg.disabled = true;
          if (btnAction) btnAction.disabled = true;
          return;
        }
        const selected = imgState.checkList.filter(Boolean).length;
        const total = imgState.checkList.length;
        document.getElementById('thumbCount').textContent = `${selected} / ${total} 선택`;
        document.getElementById('chkSelectAll').checked = (total > 0 && selected === total);
        const isDisabled = selected === 0;
        if (btnSavePdf) btnSavePdf.disabled = isDisabled;
        if (btnSaveImg) btnSaveImg.disabled = isDisabled;
        if (btnAction) btnAction.disabled = isDisabled;
      }

      // 모바일 플로팅 버튼(FAB) 상태 갱신 (데스크톱에서는 CSS display: none !important 유지)
      const totalCount = appMode === 'pdf2img' ? pdfState.pages.length : imgState.items.length;
      const fab = document.getElementById('mobileFab');
      if (fab) {
        fab.classList.toggle('has-files', totalCount > 0);
        fab.style.display = '';
        fab.textContent = '⚙️ 편집 & 저장';
      }
    }

    // 1열 이미지 썸네일 렌더링 (체크박스 및 드래그 앤 드롭 위치 지정 삽입 지원)
    function renderImageThumbnailList() {
      const container = document.getElementById('thumbList');
      container.innerHTML = '';

      imgState.items.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = `thumb-card ${idx === imgState.currentIndex ? 'active' : ''}`;
        card.id = `thumb-card-${idx}`;
        card.draggable = true;
        card.onclick = (e) => {
          if (e.target.closest('input[type="checkbox"]') || e.target.closest('button')) return;
          loadMainViewer(idx);
          if (window.innerWidth <= 768) {
            toggleMobileControl(true);
          }
        };

        card.addEventListener('dragstart', (e) => {
          draggedCardIndex = idx;
          card.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', idx);
        });

        card.addEventListener('dragend', () => {
          card.classList.remove('dragging');
          clearThumbDropLines();
        });

        // 마우스 위치에 따른 상단/하단 진한 가이드 라인
        card.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.stopPropagation();
          const rect = card.getBoundingClientRect();
          const relY = e.clientY - rect.top;
          clearThumbDropLines();
          if (relY < rect.height / 2) {
            card.classList.add('drag-over-top');
          } else {
            card.classList.add('drag-over-bottom');
          }
        });

        card.addEventListener('dragleave', (e) => {
          e.stopPropagation();
          card.classList.remove('drag-over-top', 'drag-over-bottom');
        });

        // 카드 사이에 드롭 (새 파일 삽입 또는 순서 이동)
        card.addEventListener('drop', async (e) => {
          e.preventDefault();
          e.stopPropagation();
          const rect = card.getBoundingClientRect();
          const isTop = (e.clientY - rect.top) < rect.height / 2;
          let insertAt = isTop ? idx : idx + 1;
          clearThumbDropLines();

          if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
            // [왼쪽 창에서 위치를 정해서 삽입!]
            await processFiles(Array.from(e.dataTransfer.files), insertAt, 'thumb-slot');
          } else if (draggedCardIndex !== null && draggedCardIndex !== idx) {
            // 내부 카드 순서 이동 (아이템 및 체크 상태 동시 이동)
            const movedItem = imgState.items.splice(draggedCardIndex, 1)[0];
            const movedChk = imgState.checkList.splice(draggedCardIndex, 1)[0];
            if (draggedCardIndex < insertAt) insertAt--;
            imgState.items.splice(insertAt, 0, movedItem);
            imgState.checkList.splice(insertAt, 0, movedChk);
            imgState.currentIndex = insertAt;
            renderImageThumbnailList();
            loadMainViewer(insertAt);
          }
          draggedCardIndex = null;
        });

        const header = document.createElement('div');
        header.className = 'thumb-card-header';
        
        const titleSpan = document.createElement('span');
        titleSpan.textContent = `#${idx + 1}`;
        header.appendChild(titleSpan);

        const headerRight = document.createElement('div');
        headerRight.style.display = 'flex';
        headerRight.style.alignItems = 'center';
        headerRight.style.gap = '8px';

        const btnRow = document.createElement('div');
        btnRow.className = 'thumb-btn-row';

        const btnUp = document.createElement('button');
        btnUp.className = 'btn-icon-sm';
        btnUp.textContent = '▲';
        btnUp.title = '위로 이동';
        btnUp.onclick = (e) => { e.stopPropagation(); moveImageOrder(idx, -1); };

        const btnDown = document.createElement('button');
        btnDown.className = 'btn-icon-sm';
        btnDown.textContent = '▼';
        btnDown.title = '아래로 이동';
        btnDown.onclick = (e) => { e.stopPropagation(); moveImageOrder(idx, 1); };

        const btnDel = document.createElement('button');
        btnDel.className = 'btn-icon-sm';
        btnDel.textContent = '✕';
        btnDel.title = '삭제';
        btnDel.onclick = (e) => { e.stopPropagation(); removeImageItem(idx); };

        btnRow.appendChild(btnUp);
        btnRow.appendChild(btnDown);
        btnRow.appendChild(btnDel);
        headerRight.appendChild(btnRow);

        // 이미지 선택 체크박스 (클릭 영역 1.5배 확대 래퍼 적용)
        const touchWrap = document.createElement('label');
        touchWrap.className = 'chk-touch-wrap';
        touchWrap.onclick = (e) => e.stopPropagation();

        const chk = document.createElement('input');
        chk.type = 'checkbox';
        chk.checked = imgState.checkList[idx] !== false;
        chk.onchange = () => {
          imgState.checkList[idx] = chk.checked;
          updateThumbCounts();
        };
        touchWrap.appendChild(chk);
        headerRight.appendChild(touchWrap);

        header.appendChild(headerRight);
        card.appendChild(header);

        const cfg = getEffectiveImgSettings(idx);
        const thumbCanvasWrap = document.createElement('div');
        thumbCanvasWrap.className = 'thumb-canvas-wrap';
        const isTransparent = ((cfg.format || 'png') === 'png') && (cfg.transparentBg !== false);
        if (isTransparent) thumbCanvasWrap.classList.add('checkerboard-bg');

        const thumbCanvas = document.createElement('canvas');
        thumbCanvas.id = `thumb-canvas-img-${idx}`;
        drawPaperWithImage(thumbCanvas, item, cfg, { isThumbnail: true });

        thumbCanvasWrap.appendChild(thumbCanvas);
        card.appendChild(thumbCanvasWrap);

        container.appendChild(card);
      });

      updateThumbCounts();
    }

    function clearThumbDropLines() {
      document.querySelectorAll('.thumb-card').forEach(c => {
        c.classList.remove('drag-over-top', 'drag-over-bottom');
      });
    }

    function moveImageOrder(index, delta) {
      const target = index + delta;
      if (target < 0 || target >= imgState.items.length) return;
      const tempItem = imgState.items[index];
      const tempChk = imgState.checkList[index];
      imgState.items[index] = imgState.items[target];
      imgState.checkList[index] = imgState.checkList[target];
      imgState.items[target] = tempItem;
      imgState.checkList[target] = tempChk;
      imgState.currentIndex = target;
      renderImageThumbnailList();
      loadMainViewer(target);
    }

    function removeImageItem(index) {
      imgState.items.splice(index, 1);
      imgState.checkList.splice(index, 1);
      if (imgState.currentIndex >= imgState.items.length) {
        imgState.currentIndex = Math.max(0, imgState.items.length - 1);
      }
      renderImageThumbnailList();
      if (imgState.items.length > 0) {
        loadMainViewer(imgState.currentIndex);
      } else {
        refreshWorkspaceDisplay();
      }
    }

    // 2열 메인 뷰어 캔버스 렌더링 (용지 규격 + 여백 + 회전 + 맞춤 비율 정밀 반영)
    let currentRenderTask = null;
    async function renderMainViewerCanvas(index) {
      const canvas = document.getElementById('mainViewerCanvas');
      if (!canvas) return;
      const wrap = document.getElementById('viewerWrap');

      if (appMode === 'pdf2img' && pdfState.pages[index]) {
        const p = pdfState.pages[index];
        const cfg = getEffectivePdfSettings(index);
        const { rotImg } = getResolvedRotations(cfg);

        if (p.type === 'pdf') {
          const b = cfg.brightness !== undefined ? cfg.brightness : 100;
          const c = cfg.contrast !== undefined ? cfg.contrast : 100;
          canvas.style.filter = (b !== 100 || c !== 100) ? `brightness(${b}%) contrast(${c}%)` : 'none';
          const page = await p.doc.getPage(p.pageNum);
          await renderPdfPageToCanvas(page, 1.5, rotImg, canvas);
          if (wrap) wrap.classList.remove('checkerboard-bg');
        } else {
          canvas.style.filter = 'none';
          canvas.style.transform = 'none';
          drawPaperWithImage(canvas, p, cfg, { isThumbnail: false });
          const isTransparent = ((cfg.format || 'png') === 'png') && (cfg.transparentBg !== false);
          if (wrap) wrap.classList.toggle('checkerboard-bg', isTransparent);
        }
      } else if (appMode === 'img2pdf' && imgState.items[index]) {
        const item = imgState.items[index];
        const cfg = getEffectiveImgSettings(index);
        canvas.style.filter = 'none';
        canvas.style.transform = 'none';
        drawPaperWithImage(canvas, item, cfg, { isThumbnail: false });
        const isTransparent = ((cfg.format || 'png') === 'png') && (cfg.transparentBg !== false);
        if (wrap) wrap.classList.toggle('checkerboard-bg', isTransparent);
      }
    }

    // 2열 메인 뷰어 로드
    async function loadMainViewer(index) {
      const isPdf = appMode === 'pdf2img';
      const total = isPdf ? pdfState.pages.length : imgState.items.length;
      if (total === 0) return;

      if (isPdf) {
        pdfState.currentIndex = index;
      } else {
        imgState.currentIndex = index;
      }

      const pageText = `${index + 1} / ${total}`;
      const vpi = document.getElementById('viewerPageIndicator');
      if (vpi) vpi.textContent = pageText;
      const mpi = document.getElementById('mobilePageIndicator');
      if (mpi) mpi.textContent = pageText;

      document.querySelectorAll('.thumb-card').forEach((c, i) => c.classList.toggle('active', i === index));
      const targetCard = document.getElementById(`thumb-card-${index}`);
      if (targetCard) targetCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

      document.getElementById('viewerEmptyMsg').style.display = 'none';
      const wrap = document.getElementById('viewerWrap');
      wrap.style.display = 'block';

      // 1. 우측 컨트롤을 현재 페이지 상태(개별 or 글로벌)로 완전 동기화
      syncControlsForCurrentPage();

      // 2. 메인 뷰어 캔버스 렌더링 (회전 각도 정밀 반영)
      await renderMainViewerCanvas(index);

      // 3. 줌 및 미니 프리뷰 갱신
      applyZoom();
      updateViewerEdits(index);
      updateMiniPreview();
    }

    function navigateViewer(delta) {
      const max = appMode === 'pdf2img' ? pdfState.pages.length : imgState.items.length;
      if (max === 0) return;
      const curIdx = appMode === 'pdf2img' ? pdfState.currentIndex : imgState.currentIndex;
      let next = curIdx + delta;
      if (next < 0) next = 0;
      if (next >= max) next = max - 1;
      loadMainViewer(next);
    }

    function adjustZoom(delta) {
      const curZoom = appMode === 'pdf2img' ? pdfState.zoom : imgState.zoom;
      const nextZoom = Math.max(0.3, Math.min(3.0, curZoom + delta));
      if (appMode === 'pdf2img') pdfState.zoom = nextZoom;
      else imgState.zoom = nextZoom;
      applyZoom();
    }
    function resetZoom() {
      if (appMode === 'pdf2img') pdfState.zoom = 1.0;
      else imgState.zoom = 1.0;
      applyZoom();
    }
    function applyZoom() {
      const curZoom = appMode === 'pdf2img' ? pdfState.zoom : imgState.zoom;
      const wrap = document.getElementById('viewerWrap');
      wrap.style.transform = `scale(${curZoom})`;
    }

    function updateViewerEdits(targetIdx) {
      const isPdf = appMode === 'pdf2img';
      const curIdx = targetIdx !== undefined ? targetIdx : (isPdf ? pdfState.currentIndex : imgState.currentIndex);
      const cfg = isPdf ? getEffectivePdfSettings(curIdx) : getEffectiveImgSettings(curIdx);
      if (!cfg) return;

      const activeCurIdx = isPdf ? pdfState.currentIndex : imgState.currentIndex;
      const mvc = document.getElementById('mainViewerCanvas');
      const wrap = document.getElementById('viewerWrap');
      const tc = isPdf ? document.getElementById(`thumb-canvas-pdf-${curIdx}`) : document.getElementById(`thumb-canvas-img-${curIdx}`);

      if (isPdf && pdfState.pages[curIdx] && pdfState.pages[curIdx].type === 'pdf') {
        const b = cfg.brightness !== undefined ? cfg.brightness : 100;
        const c = cfg.contrast !== undefined ? cfg.contrast : 100;
        const filterStr = (b !== 100 || c !== 100) ? `brightness(${b}%) contrast(${c}%)` : 'none';
        const cScale = cfg.contentScale || 1.0;
        const scaleX = cfg.scaleX !== undefined ? cfg.scaleX : 1.0;
        const ox = cfg.offsetX !== undefined ? cfg.offsetX : 0;
        const oy = cfg.offsetY !== undefined ? cfg.offsetY : 0;
        const transformStr = (cScale === 1.0 && scaleX === 1.0 && ox === 0 && oy === 0)
          ? 'none'
          : `translate(${ox}%, ${oy}%) scale(${cScale * scaleX}, ${cScale})`;

        if (curIdx === activeCurIdx && mvc) {
          mvc.style.filter = filterStr;
          mvc.style.transform = transformStr;
          mvc.style.transformOrigin = 'center center';
        }
        if (tc) {
          tc.style.filter = filterStr;
          tc.style.transform = transformStr;
          tc.style.transformOrigin = 'center center';
        }
      } else {
        if (curIdx === activeCurIdx && mvc) {
          mvc.style.filter = 'none';
          mvc.style.transform = 'none';
          renderMainViewerCanvas(curIdx);
        }
        if (tc) {
          tc.style.filter = 'none';
          tc.style.transform = 'none';
          updateThumbnailCanvas(curIdx);
        }
      }
    }

    function updateMainViewerFilters() {
      updateViewerEdits();
    }

    function adjustPreviewScale(delta) {
      const isPdf = appMode === 'pdf2img';
      const curIdx = isPdf ? pdfState.currentIndex : imgState.currentIndex;
      const cfg = isPdf ? getEffectivePdfSettings(curIdx) : getEffectiveImgSettings(curIdx);
      const curScale = cfg.contentScale || 1.0;
      cfg.contentScale = Math.max(0.2, Math.min(3.0, Math.round((curScale + delta) * 100) / 100));
      updateViewerEdits();
      updateMiniPreview();
    }

    function resetPreviewScale() {
      const isPdf = appMode === 'pdf2img';
      const curIdx = isPdf ? pdfState.currentIndex : imgState.currentIndex;
      const cfg = isPdf ? getEffectivePdfSettings(curIdx) : getEffectiveImgSettings(curIdx);
      cfg.contentScale = 1.0;
      updateViewerEdits();
      updateMiniPreview();
    }

    function adjustScaleX(delta) {
      const isPdf = appMode === 'pdf2img';
      const curIdx = isPdf ? pdfState.currentIndex : imgState.currentIndex;
      const cfg = isPdf ? getEffectivePdfSettings(curIdx) : getEffectiveImgSettings(curIdx);
      const cur = cfg.scaleX !== undefined ? cfg.scaleX : 1.0;
      cfg.scaleX = Math.max(0.2, Math.min(3.0, Math.round((cur + delta) * 100) / 100));
      updateViewerEdits();
      updateMiniPreview();
    }

    function resetScaleX() {
      const isPdf = appMode === 'pdf2img';
      const curIdx = isPdf ? pdfState.currentIndex : imgState.currentIndex;
      const cfg = isPdf ? getEffectivePdfSettings(curIdx) : getEffectiveImgSettings(curIdx);
      cfg.scaleX = 1.0;
      updateViewerEdits();
      updateMiniPreview();
    }

    function adjustTrapezoid(delta) {
      const isPdf = appMode === 'pdf2img';
      const curIdx = isPdf ? pdfState.currentIndex : imgState.currentIndex;
      const cfg = isPdf ? getEffectivePdfSettings(curIdx) : getEffectiveImgSettings(curIdx);
      const cur = cfg.trapezoid !== undefined ? cfg.trapezoid : 0;
      cfg.trapezoid = Math.max(-0.6, Math.min(0.6, Math.round((cur + delta) * 10) / 10));
      updateViewerEdits();
      updateMiniPreview();
    }

    function resetTrapezoid() {
      const isPdf = appMode === 'pdf2img';
      const curIdx = isPdf ? pdfState.currentIndex : imgState.currentIndex;
      const cfg = isPdf ? getEffectivePdfSettings(curIdx) : getEffectiveImgSettings(curIdx);
      cfg.trapezoid = 0;
      updateViewerEdits();
      updateMiniPreview();
    }

    function adjustBrightness(delta) {
      const isPdf = appMode === 'pdf2img';
      const curIdx = isPdf ? pdfState.currentIndex : imgState.currentIndex;
      const cfg = isPdf ? getEffectivePdfSettings(curIdx) : getEffectiveImgSettings(curIdx);
      const cur = cfg.brightness !== undefined ? cfg.brightness : 100;
      cfg.brightness = Math.max(20, Math.min(250, cur + delta));
      updateViewerEdits();
      updateMiniPreview();
    }

    function resetBrightness() {
      const isPdf = appMode === 'pdf2img';
      const curIdx = isPdf ? pdfState.currentIndex : imgState.currentIndex;
      const cfg = isPdf ? getEffectivePdfSettings(curIdx) : getEffectiveImgSettings(curIdx);
      cfg.brightness = 100;
      updateViewerEdits();
      updateMiniPreview();
    }

    function adjustContrast(delta) {
      const isPdf = appMode === 'pdf2img';
      const curIdx = isPdf ? pdfState.currentIndex : imgState.currentIndex;
      const cfg = isPdf ? getEffectivePdfSettings(curIdx) : getEffectiveImgSettings(curIdx);
      const cur = cfg.contrast !== undefined ? cfg.contrast : 100;
      cfg.contrast = Math.max(20, Math.min(250, cur + delta));
      updateViewerEdits();
      updateMiniPreview();
    }

    function resetContrast() {
      const isPdf = appMode === 'pdf2img';
      const curIdx = isPdf ? pdfState.currentIndex : imgState.currentIndex;
      const cfg = isPdf ? getEffectivePdfSettings(curIdx) : getEffectiveImgSettings(curIdx);
      cfg.contrast = 100;
      updateViewerEdits();
      updateMiniPreview();
    }

    function adjustImageOffset(dx, dy) {
      const isPdf = appMode === 'pdf2img';
      const curIdx = isPdf ? pdfState.currentIndex : imgState.currentIndex;
      const cfg = isPdf ? getEffectivePdfSettings(curIdx) : getEffectiveImgSettings(curIdx);
      const curX = cfg.offsetX !== undefined ? cfg.offsetX : 0;
      const curY = cfg.offsetY !== undefined ? cfg.offsetY : 0;
      cfg.offsetX = Math.max(-50, Math.min(50, curX + dx));
      cfg.offsetY = Math.max(-50, Math.min(50, curY + dy));
      updateViewerEdits();
      updateMiniPreview();
    }

    function resetImageOffset() {
      const isPdf = appMode === 'pdf2img';
      const curIdx = isPdf ? pdfState.currentIndex : imgState.currentIndex;
      const cfg = isPdf ? getEffectivePdfSettings(curIdx) : getEffectiveImgSettings(curIdx);
      cfg.offsetX = 0;
      cfg.offsetY = 0;
      updateViewerEdits();
      updateMiniPreview();
    }

    // [핵심] 정해진 용지 크기를 고정 유지하고 내부 내용물만 확대/축소/비율/필터/오프셋 편집
    function updateMiniPreview() {
      const miniCanvas = document.getElementById('miniCanvas');
      if (!miniCanvas) return;
      const mctx = miniCanvas.getContext('2d');
      const miniSheet = document.getElementById('miniSheet');
      const miniEmpty = document.getElementById('miniEmpty');
      const info = document.getElementById('miniInfo');

      const srcCanvas = document.getElementById('mainViewerCanvas');
      if (!srcCanvas || srcCanvas.width === 0 || srcCanvas.height === 0) {
        if (miniSheet) miniSheet.style.display = 'none';
        if (miniEmpty) miniEmpty.style.display = 'flex';
        if (info) info.textContent = '선택 항목 기준 윤곽';
        return;
      }

      if (miniSheet) miniSheet.style.display = 'block';
      if (miniEmpty) miniEmpty.style.display = 'none';

      const maxBoxW = 125;
      const maxBoxH = 150;

      if (appMode === 'pdf2img') {
        const curIdx = pdfState.currentIndex;
        const cfg = getEffectivePdfSettings(curIdx);
        const { rot, isPageRot90, isImgRot90, target } = getResolvedRotations(cfg);
        const fitKey = cfg.fit;
        const cScale = cfg.contentScale || 1.0;
        const scaleX = cfg.scaleX !== undefined ? cfg.scaleX : 1.0;
        const brightness = cfg.brightness !== undefined ? cfg.brightness : 100;
        const contrast = cfg.contrast !== undefined ? cfg.contrast : 100;
        const offsetX = cfg.offsetX !== undefined ? cfg.offsetX : 0;
        const offsetY = cfg.offsetY !== undefined ? cfg.offsetY : 0;

        const customW = cfg.customW;
        const customH = cfg.customH;

        // srcCanvas는 이미 rotImg 회전이 적용된 캔버스
        const imgOrigW = srcCanvas.width;
        const imgOrigH = srcCanvas.height;

        // 0도 기준 원본 방향 판별
        const isOrigLandscape = isImgRot90 ? (imgOrigH > imgOrigW) : (imgOrigW > imgOrigH);
        const orientOpt = cfg.orient || 'auto';
        const baseLandscape = orientOpt === 'l' || (orientOpt === 'auto' && isOrigLandscape);
        // 페이지 회전 여부에 따른 최종 용지 방향
        const isLandscape = isPageRot90 ? !baseLandscape : baseLandscape;
        const paper = resolvePaperGeometry(fitKey, isLandscape, imgOrigW, imgOrigH, customW, customH);

        if (fitKey === 'original' && isPageRot90 && !isImgRot90) {
          paper.ratio = imgOrigH / imgOrigW;
          paper.isLandscape = !baseLandscape;
          paper.name = `원본 규격 (${paper.isLandscape ? '가로' : '세로'})`;
        }

        // 미리보기 박스(maxBoxW x maxBoxH) 안에 들어갈 시트 크기 계산
        let sheetW, sheetH;
        if (paper.ratio >= (maxBoxW / maxBoxH)) {
          sheetW = maxBoxW;
          sheetH = Math.round(maxBoxW / paper.ratio);
        } else {
          sheetH = maxBoxH;
          sheetW = Math.round(maxBoxH * paper.ratio);
        }

        // 종이 용지 CSS 크기 확정 (용지는 확대/축소에도 절대 변하지 않음!)
        miniSheet.style.width = `${sheetW}px`;
        miniSheet.style.height = `${sheetH}px`;
        miniSheet.style.aspectRatio = `${paper.widthPx} / ${paper.heightPx}`;

        const rotTargetsText = [];
        if (target.page) rotTargetsText.push('페이지');
        if (target.image) rotTargetsText.push('이미지');
        const rotLabelStr = rotTargetsText.length > 0 ? ` [${rotTargetsText.join('+')} ${rot}°]` : ` [0°]`;
        let editDetails = `${Math.round(cScale * 100)}%`;
        if (scaleX !== 1.0) editDetails += ` · 가로${Math.round(scaleX * 100)}%`;
        if (cfg.trapezoid) {
          const trapVal = Math.round(cfg.trapezoid * 10);
          editDetails += trapVal > 0 ? ` · 대두+${trapVal}` : ` · 소두${Math.abs(trapVal)}`;
        }
        if (brightness !== 100) editDetails += ` · 밝기${brightness}%`;
        if (contrast !== 100) editDetails += ` · 명암${contrast}%`;
        info.textContent = `${paper.name}${rotLabelStr} · ${editDetails}`;
        info.title = `${paper.name}${rotLabelStr} · 크기 ${Math.round(cScale * 100)}% (가로 ${Math.round(scaleX * 100)}%, 사다리꼴 ${cfg.trapezoid || 0}, 밝기 ${brightness}%, 대비 ${contrast}%, 이동 ${offsetX}%,${offsetY}%)`;

        // 고해상도 Canvas 렌더링
        const dpr = 2; // 선명한 캔버스
        miniCanvas.width = sheetW * dpr;
        miniCanvas.height = sheetH * dpr;
        mctx.setTransform(1, 0, 0, 1, 0, 0);
        mctx.scale(dpr, dpr);

        // 하얀색 용지 바탕 또는 투명 처리
        const isTransparent = ((cfg.format || 'png') === 'png') && (cfg.transparentBg !== false);
        if (isTransparent) {
          mctx.clearRect(0, 0, sheetW, sheetH);
          miniSheet.classList.add('checkerboard-bg');
        } else {
          mctx.fillStyle = '#ffffff';
          mctx.fillRect(0, 0, sheetW, sheetH);
          miniSheet.classList.remove('checkerboard-bg');
        }

        // 용지 안에 들어갈 이미지 기본 크기 (fit)
        const fitScale = Math.min(sheetW / imgOrigW, sheetH / imgOrigH);
        const baseDrawW = imgOrigW * fitScale;
        const baseDrawH = imgOrigH * fitScale;

        // 사용자 내용물 확대/축소 배율 및 가로 비율, 오프셋 적용
        const finalDrawW = baseDrawW * cScale * scaleX;
        const finalDrawH = baseDrawH * cScale;
        const shiftX = sheetW * (offsetX / 100);
        const shiftY = sheetH * (offsetY / 100);
        const posX = (sheetW - finalDrawW) / 2 + shiftX;
        const posY = (sheetH - finalDrawH) / 2 + shiftY;

        mctx.save();
        mctx.beginPath();
        mctx.rect(0, 0, sheetW, sheetH);
        mctx.clip();
        if (brightness !== 100 || contrast !== 100) {
          mctx.filter = `brightness(${brightness}%) contrast(${contrast}%)`;
        }
        drawImageWithTrapezoid(mctx, srcCanvas, posX, posY, finalDrawW, finalDrawH, cfg.trapezoid);
        mctx.restore();

      } else {
        // [Img to PDF] 모드
        const curIdx = imgState.currentIndex;
        const cfg = getEffectiveImgSettings(curIdx);
        const item = imgState.items[curIdx];
        const { rot, isPageRot90, target } = getResolvedRotations(cfg);
        const sizeModeKey = cfg.pageSize;
        const orientOpt = cfg.orient;
        const marginPx = cfg.margin;
        const cScale = cfg.contentScale || 1.0;
        const scaleX = cfg.scaleX !== undefined ? cfg.scaleX : 1.0;
        const brightness = cfg.brightness !== undefined ? cfg.brightness : 100;
        const contrast = cfg.contrast !== undefined ? cfg.contrast : 100;
        const offsetX = cfg.offsetX !== undefined ? cfg.offsetX : 0;
        const offsetY = cfg.offsetY !== undefined ? cfg.offsetY : 0;

        const customW = cfg.customW;
        const customH = cfg.customH;

        // srcCanvas는 이미 rotImg 회전이 적용된 캔버스임
        const imgOrigW = srcCanvas.width;
        const imgOrigH = srcCanvas.height;

        const isOrigImgLandscape = item ? (item.width > item.height) : (imgOrigW > imgOrigH);
        const baseLandscape = orientOpt === 'l' || (orientOpt === 'auto' && isOrigImgLandscape);
        const isLandscape = isPageRot90 ? !baseLandscape : baseLandscape;
        const paper = resolvePaperGeometry(sizeModeKey, isLandscape, imgOrigW + marginPx * 2, imgOrigH + marginPx * 2, customW, customH);

        let sheetW, sheetH;
        if (paper.ratio >= (maxBoxW / maxBoxH)) {
          sheetW = maxBoxW;
          sheetH = Math.round(maxBoxW / paper.ratio);
        } else {
          sheetH = maxBoxH;
          sheetW = Math.round(maxBoxH * paper.ratio);
        }

        // 종이 용지 크기 확정 (절대 불변)
        miniSheet.style.width = `${sheetW}px`;
        miniSheet.style.height = `${sheetH}px`;
        miniSheet.style.aspectRatio = `${paper.widthPx} / ${paper.heightPx}`;

        const rotTargetsText = [];
        if (target.page) rotTargetsText.push('페이지');
        if (target.image) rotTargetsText.push('이미지');
        const rotLabelStr = rotTargetsText.length > 0 ? ` [${rotTargetsText.join('+')} ${rot}°]` : ` [0°]`;
        let editDetails = `${Math.round(cScale * 100)}%`;
        if (scaleX !== 1.0) editDetails += ` · 가로${Math.round(scaleX * 100)}%`;
        if (cfg.trapezoid) {
          const trapVal = Math.round(cfg.trapezoid * 10);
          editDetails += trapVal > 0 ? ` · 대두+${trapVal}` : ` · 소두${Math.abs(trapVal)}`;
        }
        if (brightness !== 100) editDetails += ` · 밝기${brightness}%`;
        if (contrast !== 100) editDetails += ` · 명암${contrast}%`;
        info.textContent = `${paper.name}${rotLabelStr} · ${editDetails}`;
        info.title = `${paper.name}${rotLabelStr} (여백 ${marginPx}px) · 내용물 ${Math.round(cScale * 100)}% (가로 ${Math.round(scaleX * 100)}%, 사다리꼴 ${cfg.trapezoid || 0}, 밝기 ${brightness}%, 대비 ${contrast}%, 이동 ${offsetX}%,${offsetY}%)`;

        const dpr = 2;
        miniCanvas.width = sheetW * dpr;
        miniCanvas.height = sheetH * dpr;
        mctx.setTransform(1, 0, 0, 1, 0, 0);
        mctx.scale(dpr, dpr);

        // 하얀색 용지 바탕 또는 투명 처리
        const isTransparent = (cfg.transparentBg !== false);
        if (isTransparent) {
          mctx.clearRect(0, 0, sheetW, sheetH);
          miniSheet.classList.add('checkerboard-bg');
        } else {
          mctx.fillStyle = '#ffffff';
          mctx.fillRect(0, 0, sheetW, sheetH);
          miniSheet.classList.remove('checkerboard-bg');
        }

        // 여백 비율 계산 (미리보기 크기에 맞춘 여백)
        const scaleFactor = sheetW / paper.widthPx;
        const viewMargin = Math.round(marginPx * scaleFactor);

        const innerW = Math.max(10, sheetW - (viewMargin * 2));
        const innerH = Math.max(10, sheetH - (viewMargin * 2));

        const fitScale = Math.min(innerW / imgOrigW, innerH / imgOrigH);
        const baseDrawW = imgOrigW * fitScale;
        const baseDrawH = imgOrigH * fitScale;

        const finalDrawW = baseDrawW * cScale * scaleX;
        const finalDrawH = baseDrawH * cScale;
        const shiftX = sheetW * (offsetX / 100);
        const shiftY = sheetH * (offsetY / 100);
        const posX = (sheetW - finalDrawW) / 2 + shiftX;
        const posY = (sheetH - finalDrawH) / 2 + shiftY;

        mctx.save();
        mctx.beginPath();
        mctx.rect(0, 0, sheetW, sheetH);
        mctx.clip();
        if (brightness !== 100 || contrast !== 100) {
          mctx.filter = `brightness(${brightness}%) contrast(${contrast}%)`;
        }
        mctx.drawImage(srcCanvas, posX, posY, finalDrawW, finalDrawH);
        mctx.restore();
      }
    }

    // [핵심] 통합 듀얼 저장 라우터 (PDF 저장 vs Img 저장)
    async function executeActionSave(targetType) {
      if (appMode === 'pdf2img') {
        if (targetType === 'img') {
          await executePdfToImages();
        } else {
          await executePdfToPdf();
        }
      } else {
        if (targetType === 'pdf') {
          await executeImagesToPdf();
        } else {
          await executeImagesToImages();
        }
      }
      toggleMobileControl(false);
    }

    // PDF ➡️ 이미지 분할 & ZIP 자동 저장 (개별 페이지 오버라이드 및 삽입 이미지 완벽 반영)
    async function executePdfToImages() {
      if (pdfState.pages.length === 0) return;
      const selectedIndices = [];
      pdfState.checkList.forEach((chk, i) => { if (chk && pdfState.pages[i]) selectedIndices.push(i); });
      if (selectedIndices.length === 0) return;

      const btnSavePdf = document.getElementById('btnSavePdf');
      const btnSaveImg = document.getElementById('btnSaveImg');
      if (btnSavePdf) btnSavePdf.disabled = true;
      if (btnSaveImg) btnSaveImg.disabled = true;
      document.getElementById('btnAbort').style.display = 'inline-block';
      document.getElementById('progWrap').style.display = 'block';
      isAborted = false;
      zipBlobs = [];

      try {
        for (let idx = 0; idx < selectedIndices.length; idx++) {
          if (isAborted) {
            document.getElementById('statusText').textContent = '변환이 중단되었습니다.';
            break;
          }

          const pageIndex = selectedIndices[idx];
          const p = pdfState.pages[pageIndex];
          const cfg = getEffectivePdfSettings(pageIndex);
          const cScale = cfg.contentScale || 1.0;
          const { rotImg, isPageRot90, isImgRot90 } = getResolvedRotations(cfg);

          const pct = Math.round(((idx + 1) / selectedIndices.length) * 100);
          document.getElementById('progFill').style.width = `${pct}%`;
          document.getElementById('statusText').textContent = `이미지 변환 중: [${idx + 1} / ${selectedIndices.length}] (${pct}%)...`;

          await new Promise(r => setTimeout(r, 0));

          const tempCanvas = document.createElement('canvas');
          let origW = 0, origH = 0;
          let baseScaleW = 0, baseScaleH = 0;

          if (p.type === 'pdf') {
            const page = await p.doc.getPage(p.pageNum);
            const vp = await renderPdfPageToCanvas(page, cfg.scale, rotImg, tempCanvas);

            const origVp = page.getViewport({ scale: 1.0, rotation: 0 });
            origW = origVp.width;
            origH = origVp.height;
            baseScaleW = vp.width;
            baseScaleH = vp.height;
          } else {
            const rotRad = (rotImg * Math.PI) / 180;
            const srcRotW = isImgRot90 ? p.height : p.width;
            const srcRotH = isImgRot90 ? p.width : p.height;
            tempCanvas.width = srcRotW;
            tempCanvas.height = srcRotH;
            const tctx = tempCanvas.getContext('2d');
            const isTransparent = (cfg.format === 'png') && (cfg.transparentBg !== false);
            if (isTransparent) {
              tctx.clearRect(0, 0, srcRotW, srcRotH);
            } else {
              tctx.fillStyle = '#ffffff';
              tctx.fillRect(0, 0, srcRotW, srcRotH);
            }
            tctx.translate(srcRotW / 2, srcRotH / 2);
            tctx.rotate(rotRad);
            tctx.drawImage(p.imgObj, -p.width / 2, -p.height / 2);

            origW = p.width;
            origH = p.height;
            baseScaleW = srcRotW;
            baseScaleH = srcRotH;
          }

          const imgF = (p.type === 'pdf') ? 1 : getImagePageFactor(origW, origH);
          const refW = baseScaleW * imgF, refH = baseScaleH * imgF;
          const isOrigLandscape = origW > origH;
          const orientOpt = cfg.orient || 'auto';
          const baseLandscape = orientOpt === 'l' || (orientOpt === 'auto' && isOrigLandscape);
          const isLandscape = isPageRot90 ? !baseLandscape : baseLandscape;
          const paper = resolvePaperGeometry(cfg.fit, isLandscape, refW, refH, cfg.customW, cfg.customH);

          // 2단계: 최종 용지 캔버스 생성
          let finalCanvas = document.createElement('canvas');
          let fctx = finalCanvas.getContext('2d');

          let paperW, paperH;
          if (cfg.fit === 'original') {
            paperW = isPageRot90 ? (origH * (p.type === 'pdf' ? cfg.scale : imgF)) : (origW * (p.type === 'pdf' ? cfg.scale : imgF));
            paperH = isPageRot90 ? (origW * (p.type === 'pdf' ? cfg.scale : imgF)) : (origH * (p.type === 'pdf' ? cfg.scale : imgF));
          } else if (cfg.fit === 'custom') {
            paperW = paper.widthPx;
            paperH = paper.heightPx;
          } else {
            if (paper.isLandscape) {
              paperW = Math.max(refW, Math.round(refH * paper.ratio));
              paperH = Math.round(paperW / paper.ratio);
            } else {
              paperH = Math.max(refH, Math.round(refW / paper.ratio));
              paperW = Math.round(paperH * paper.ratio);
            }
          }

          finalCanvas.width = paperW;
          finalCanvas.height = paperH;

          // 용지 배경 채우기 (흰색 또는 PNG 투명 처리)
          const isTransparent = (cfg.format === 'png') && (cfg.transparentBg !== false);
          if (isTransparent) {
            fctx.clearRect(0, 0, paperW, paperH);
          } else {
            fctx.fillStyle = '#ffffff';
            fctx.fillRect(0, 0, paperW, paperH);
          }

          const scaleX = cfg.scaleX !== undefined ? cfg.scaleX : 1.0;
          const brightness = cfg.brightness !== undefined ? cfg.brightness : 100;
          const contrast = cfg.contrast !== undefined ? cfg.contrast : 100;
          const offsetX = cfg.offsetX !== undefined ? cfg.offsetX : 0;
          const offsetY = cfg.offsetY !== undefined ? cfg.offsetY : 0;

          // 내용물 맞춤 크기 계산
          const baseScale = Math.min(paperW / baseScaleW, paperH / baseScaleH);
          const drawW = baseScaleW * baseScale * cScale * scaleX;
          const drawH = baseScaleH * baseScale * cScale;
          const shiftX = paperW * (offsetX / 100);
          const shiftY = paperH * (offsetY / 100);
          const posX = (paperW - drawW) / 2 + shiftX;
          const posY = (paperH - drawH) / 2 + shiftY;

          fctx.save();
          fctx.beginPath();
          fctx.rect(0, 0, paperW, paperH);
          fctx.clip();
          if (brightness !== 100 || contrast !== 100) {
            fctx.filter = `brightness(${brightness}%) contrast(${contrast}%)`;
          }
          drawImageWithTrapezoid(fctx, tempCanvas, posX, posY, drawW, drawH, cfg.trapezoid);
          fctx.restore();
          tempCanvas.width = 0; tempCanvas.height = 0;

          let blob;
          const fmt = cfg.format;
          if (fmt === 'png') {
            blob = await new Promise(r => finalCanvas.toBlob(r, 'image/png'));
          } else if (fmt === 'jpeg') {
            blob = await new Promise(r => finalCanvas.toBlob(r, 'image/jpeg', 0.95));
          } else if (fmt === 'webp') {
            blob = await new Promise(r => finalCanvas.toBlob(r, 'image/webp', 0.95));
          } else if (fmt === 'bmp') {
            blob = CustomEncoders.canvasToBMP(fctx, finalCanvas.width, finalCanvas.height);
          } else if (fmt === 'ico') {
            blob = await CustomEncoders.canvasToICO(finalCanvas);
          } else if (fmt === 'tiff') {
            blob = CustomEncoders.canvasToTIFF(fctx, finalCanvas.width, finalCanvas.height);
          }

          finalCanvas.width = 0; finalCanvas.height = 0;

          const fileName = `${pdfState.fileName}_p${String(idx + 1).padStart(3, '0')}.${fmt}`;
          zipBlobs.push({ name: fileName, blob });
        }

        if (!isAborted) {
          document.getElementById('statusText').textContent = 'ZIP 파일 생성 중...';
          const zip = new JSZip();
          zipBlobs.forEach(item => zip.file(item.name, item.blob));
          const zipBlob = await zip.generateAsync({ type: 'blob' });

          const url = URL.createObjectURL(zipBlob);
          const a = document.createElement('a');
          a.download = `${pdfState.fileName}_images.zip`;
          a.href = url;
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 2000);

          document.getElementById('statusText').textContent = `완료! ${zipBlobs.length}장 이미지 저장됨.`;
        }
      } catch (err) {
        console.error(err);
        document.getElementById('statusText').textContent = `오류: ${err.message}`;
      } finally {
        updateThumbCounts();
        document.getElementById('btnAbort').style.display = 'none';
      }
    }

    // PDF ➡️ 선택된 페이지만 새 PDF로 재구성 및 저장
    async function executePdfToPdf() {
      if (pdfState.pages.length === 0) return;
      const selectedIndices = [];
      pdfState.checkList.forEach((chk, i) => { if (chk && pdfState.pages[i]) selectedIndices.push(i); });
      if (selectedIndices.length === 0) return;

      const btnSavePdf = document.getElementById('btnSavePdf');
      const btnSaveImg = document.getElementById('btnSaveImg');
      if (btnSavePdf) btnSavePdf.disabled = true;
      if (btnSaveImg) btnSaveImg.disabled = true;
      document.getElementById('btnAbort').style.display = 'inline-block';
      document.getElementById('progWrap').style.display = 'block';
      isAborted = false;

      const { jsPDF } = window.jspdf;
      let newPdfDoc = null;

      try {
        for (let idx = 0; idx < selectedIndices.length; idx++) {
          if (isAborted) {
            document.getElementById('statusText').textContent = 'PDF 생성이 중단되었습니다.';
            break;
          }

          const pageIndex = selectedIndices[idx];
          const p = pdfState.pages[pageIndex];
          const cfg = getEffectivePdfSettings(pageIndex);
          const cScale = cfg.contentScale || 1.0;
          const { rotImg, isPageRot90, isImgRot90 } = getResolvedRotations(cfg);

          const pct = Math.round(((idx + 1) / selectedIndices.length) * 100);
          document.getElementById('progFill').style.width = `${pct}%`;
          document.getElementById('statusText').textContent = `PDF 생성 중: [${idx + 1} / ${selectedIndices.length}] (${pct}%)...`;

          await new Promise(r => setTimeout(r, 0));

          const tempCanvas = document.createElement('canvas');
          let origW = 0, origH = 0;
          let baseScaleW = 0, baseScaleH = 0;

          if (p.type === 'pdf') {
            const page = await p.doc.getPage(p.pageNum);
            const vp = await renderPdfPageToCanvas(page, 3.0, rotImg, tempCanvas);

            const origVp = page.getViewport({ scale: 1.0, rotation: 0 });
            origW = origVp.width;
            origH = origVp.height;
            baseScaleW = vp.width;
            baseScaleH = vp.height;
          } else {
            const rotRad = (rotImg * Math.PI) / 180;
            const srcRotW = isImgRot90 ? p.height : p.width;
            const srcRotH = isImgRot90 ? p.width : p.height;
            tempCanvas.width = srcRotW;
            tempCanvas.height = srcRotH;
            const tctx = tempCanvas.getContext('2d');
            tctx.fillStyle = '#ffffff';
            tctx.fillRect(0, 0, srcRotW, srcRotH);
            tctx.translate(srcRotW / 2, srcRotH / 2);
            tctx.rotate(rotRad);
            tctx.drawImage(p.imgObj, -p.width / 2, -p.height / 2);

            origW = p.width;
            origH = p.height;
            baseScaleW = srcRotW;
            baseScaleH = srcRotH;
          }

          const imgF = (p.type === 'pdf') ? 1 : getImagePageFactor(origW, origH);
          const refW = baseScaleW * imgF, refH = baseScaleH * imgF;
          const isOrigLandscape = origW > origH;
          const orientOpt = cfg.orient || 'auto';
          const baseLandscape = orientOpt === 'l' || (orientOpt === 'auto' && isOrigLandscape);
          const isLandscape = isPageRot90 ? !baseLandscape : baseLandscape;
          const paper = resolvePaperGeometry(cfg.fit, isLandscape, refW, refH, cfg.customW, cfg.customH);

          let paperW, paperH;
          if (cfg.fit === 'original') {
            paperW = isPageRot90 ? (origH * (p.type === 'pdf' ? 3.0 : imgF)) : (origW * (p.type === 'pdf' ? 3.0 : imgF));
            paperH = isPageRot90 ? (origW * (p.type === 'pdf' ? 3.0 : imgF)) : (origH * (p.type === 'pdf' ? 3.0 : imgF));
          } else if (cfg.fit === 'custom') {
            paperW = paper.widthPx;
            paperH = paper.heightPx;
          } else {
            if (paper.isLandscape) {
              paperW = Math.max(refW, Math.round(refH * paper.ratio));
              paperH = Math.round(paperW / paper.ratio);
            } else {
              paperH = Math.max(refH, Math.round(refW / paper.ratio));
              paperW = Math.round(paperH * paper.ratio);
            }
          }

          let finalCanvas = document.createElement('canvas');
          let fctx = finalCanvas.getContext('2d');
          finalCanvas.width = paperW;
          finalCanvas.height = paperH;
          fctx.fillStyle = '#ffffff';
          fctx.fillRect(0, 0, paperW, paperH);

          const scaleX = cfg.scaleX !== undefined ? cfg.scaleX : 1.0;
          const brightness = cfg.brightness !== undefined ? cfg.brightness : 100;
          const contrast = cfg.contrast !== undefined ? cfg.contrast : 100;
          const offsetX = cfg.offsetX !== undefined ? cfg.offsetX : 0;
          const offsetY = cfg.offsetY !== undefined ? cfg.offsetY : 0;

          const baseScale = Math.min(paperW / baseScaleW, paperH / baseScaleH);
          const drawW = baseScaleW * baseScale * cScale * scaleX;
          const drawH = baseScaleH * baseScale * cScale;
          const shiftX = paperW * (offsetX / 100);
          const shiftY = paperH * (offsetY / 100);
          const posX = (paperW - drawW) / 2 + shiftX;
          const posY = (paperH - drawH) / 2 + shiftY;

          fctx.save();
          fctx.beginPath();
          fctx.rect(0, 0, paperW, paperH);
          fctx.clip();
          if (brightness !== 100 || contrast !== 100) {
            fctx.filter = `brightness(${brightness}%) contrast(${contrast}%)`;
          }
          drawImageWithTrapezoid(fctx, tempCanvas, posX, posY, drawW, drawH, cfg.trapezoid);
          fctx.restore();
          tempCanvas.width = 0; tempCanvas.height = 0;

          // 무손실 PNG 데이터 추출
          const imgDataUrl = finalCanvas.toDataURL('image/png');
          finalCanvas.width = 0; finalCanvas.height = 0;

          const orientation = isLandscape ? 'l' : 'p';
          if (idx === 0) {
            newPdfDoc = new jsPDF({
              orientation: orientation,
              unit: 'px',
              format: [paperW, paperH],
              compress: true
            });
          } else {
            newPdfDoc.addPage([paperW, paperH], orientation);
          }

          newPdfDoc.addImage(imgDataUrl, 'PNG', 0, 0, paperW, paperH, undefined, 'FAST');
        }

        if (!isAborted && newPdfDoc) {
          newPdfDoc.save(`${pdfState.fileName}_edited.pdf`);
          document.getElementById('statusText').textContent = `완료! ${selectedIndices.length}페이지 PDF 저장됨.`;
        }
      } catch (err) {
        console.error(err);
        document.getElementById('statusText').textContent = `PDF 생성 오류: ${err.message}`;
      } finally {
        updateThumbCounts();
        document.getElementById('btnAbort').style.display = 'none';
      }
    }

          const pWidth = paper.widthPx;

          const targetMargin = (cfg.pageSize === 'original' || cfg.pageSize === 'custom') ? cfg.margin : Math.round(cfg.margin * 3.5);

          const fitScale = Math.min(innerW / srcRotW, innerH / srcRotH);
          const finalDrawW = srcRotW * fitScale * cScale * scaleX;
          const finalDrawH = srcRotH * fitScale * cScale;
          const shiftX = pWidth * (offsetX / 100);
          const shiftY = pHeight * (offsetY / 100);
          const posX = (pWidth - finalDrawW) / 2 + shiftX;
          const posY = (pHeight - finalDrawH) / 2 + shiftY;

          fctx.save();

          drawImageWithTrapezoid(fctx, tempCanvas, posX, posY, finalDrawW, finalDrawH, cfg.trapezoid);
          fctx.restore();
          tempCanvas.width = 0; tempCanvas.height = 0;

          let imgDataUrl;

        }

        updateThumbCounts();
        document.getElementById('btnAbort').style.display = 'none';
      }
    }
