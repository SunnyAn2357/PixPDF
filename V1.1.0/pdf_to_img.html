<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF ↔ 이미지 양방향 변환기 v1.1.0</title>
  <!-- 클라이언트 로컬 전용 라이브러리 (브라우저 메모리 내 100% 처리) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/utif/3.1.0/UTIF.min.js"></script>
  <style>
    :root {
      --bg: #f1f5f9;
      --panel-bg: #ffffff;
      --border: #cbd5e1;
      --border-light: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #059669;
      --success-hover: #047857;
      --danger: #dc2626;
      --active-item: #eff6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    /* 상단 헤더 */
    header {
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    h1 { font-size: 17px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 6px; }
    .badge { font-size: 11px; background: #e0f2fe; color: #0369a1; padding: 2px 7px; border-radius: 4px; font-weight: 600; }
    .tab-group { display: flex; gap: 4px; background: #e2e8f0; padding: 3px; border-radius: 6px; }
    .tab-btn {
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tab-btn.active { background: var(--panel-bg); color: var(--primary); box-shadow: 0 1px 2px rgba(0,0,0,0.05); }

    /* 메인 3단 워크스페이스 */
    .workspace {
      display: flex;
      flex: 1;
      height: calc(100vh - 53px);
      overflow: hidden;
    }

    /* 1열: 좌측 썸네일 바 */
    .col-thumb {
      width: 220px;
      background: var(--panel-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .thumb-toolbar {
      padding: 10px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      background: #fafafa;
    }
    .thumb-toolbar label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
    .thumb-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .thumb-card {
      border: 1px solid var(--border-light);
      border-radius: 6px;
      padding: 6px;
      background: #fff;
      cursor: pointer;
      transition: all 0.15s;
      position: relative;
    }
    .thumb-card:hover { border-color: var(--primary); }
    .thumb-card.active { border-color: var(--primary); background: var(--active-item); box-shadow: 0 0 0 1px var(--primary); }
    .thumb-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .thumb-card canvas, .thumb-card img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 3px;
      border: 1px solid var(--border-light);
      background: #fff;
    }
    .thumb-btn-row { display: flex; gap: 4px; }
    .btn-icon {
      padding: 2px 5px;
      font-size: 10px;
      background: #f1f5f9;
      border: 1px solid var(--border);
      border-radius: 3px;
      cursor: pointer;
    }
    .btn-icon:hover { background: #e2e8f0; }

    /* 2열: 중앙 원본 메인 뷰어 */
    .col-viewer {
      flex: 1;
      background: #cbd5e1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .viewer-toolbar {
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
    }
    .viewer-nav { display: flex; align-items: center; gap: 8px; }
    .viewer-actions { display: flex; align-items: center; gap: 6px; }
    .viewer-viewport {
      flex: 1;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .viewer-canvas-wrap {
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
      background: #ffffff;
      line-height: 0;
      transition: transform 0.15s ease;
    }
    .viewer-canvas-wrap canvas, .viewer-canvas-wrap img {
      display: block;
      max-width: 100%;
      max-height: 80vh;
      width: auto;
      height: auto;
    }
    .viewer-empty { color: var(--text-muted); font-size: 14px; text-align: center; }

    /* 3열: 우측 컨트롤 패널 */
    .col-control {
      width: 310px;
      background: var(--panel-bg);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow-y: auto;
    }
    .control-body { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .control-group { display: flex; flex-direction: column; gap: 5px; }
    .control-group label { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.3px; }
    select, input[type="text"] {
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 5px;
      font-size: 13px;
      background: #fff;
    }
    .btn-file-wrap {
      position: relative;
      overflow: hidden;
      display: inline-block;
      width: 100%;
    }
    .btn-file-wrap input[type="file"] {
      position: absolute;
      left: 0; top: 0; opacity: 0;
      width: 100%; height: 100%;
      cursor: pointer;
    }
    .btn-file {
      width: 100%;
      padding: 9px;
      background: #f8fafc;
      border: 1px dashed var(--border);
      border-radius: 6px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
      cursor: pointer;
    }
    .btn-file:hover { background: #f1f5f9; border-color: var(--primary); }

    /* 실시간 미니 프리뷰 */
    .preview-section {
      border: 1px solid var(--border-light);
      border-radius: 6px;
      padding: 10px;
      background: #fafafa;
      text-align: center;
    }
    .preview-section-title { font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; text-align: left; }
    .mini-preview-box {
      width: 150px;
      height: 150px;
      margin: 0 auto;
      border: 1px solid var(--border);
      background: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .mini-preview-sheet {
      background: #ffffff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .mini-preview-canvas { display: block; max-width: 100%; max-height: 100%; }

    /* 실행 버튼 및 진행률 */
    .action-section { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border-light); display: flex; flex-direction: column; gap: 8px; }
    .btn-action {
      width: 100%;
      padding: 11px;
      border-radius: 6px;
      border: none;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      background: var(--primary);
      transition: background 0.15s;
    }
    .btn-action:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-action:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-zip { background: var(--success); }
    .btn-zip:hover:not(:disabled) { background: var(--success-hover); }
    .btn-abort { background: var(--danger); font-size: 12px; padding: 6px; }
    .progress-bar-wrap { height: 6px; background: #e2e8f0; border-radius: 3px; overflow: hidden; display: none; }
    .progress-bar-fill { width: 0%; height: 100%; background: var(--primary); transition: width 0.1s; }
    .status-text { font-size: 11px; color: var(--text-muted); font-weight: 600; min-height: 16px; }
  </style>
</head>
<body>

  <!-- 헤더 -->
  <header>
    <div class="header-left">
      <h1>PDF ↔ 이미지 변환기 <small style="font-size:12px; font-weight:normal; color:#64748b;">v1.1.0</small></h1>
      <div class="badge">🔒 100% 로컬 브라우저 완결</div>
    </div>
    <div class="tab-group">
      <button id="tabPdf2Img" class="tab-btn active" onclick="setAppMode('pdf2img')">PDF ➡️ 이미지 분할</button>
      <button id="tabImg2Pdf" class="tab-btn" onclick="setAppMode('img2pdf')">이미지 ➡️ PDF 병합</button>
    </div>
  </header>

  <!-- 메인 3단 영역 -->
  <div class="workspace">

    <!-- 1열: 좌측 썸네일 바 -->
    <div class="col-thumb">
      <div class="thumb-toolbar">
        <label id="lblSelectAll"><input type="checkbox" id="chkSelectAll" checked> 전체 선택</label>
        <span id="thumbCount">0 항목</span>
      </div>
      <div id="thumbList" class="thumb-list">
        <!-- 썸네일 카드 동적 추가 -->
      </div>
    </div>

    <!-- 2열: 중앙 원본 메인 뷰어 -->
    <div class="col-viewer">
      <div class="viewer-toolbar">
        <div class="viewer-nav">
          <button class="btn-icon" id="btnPrevPage" onclick="navigateViewer(-1)">◀ 이전</button>
          <span id="viewerPageIndicator">- / -</span>
          <button class="btn-icon" id="btnNextPage" onclick="navigateViewer(1)">다음 ▶</button>
        </div>
        <div class="viewer-actions">
          <button class="btn-icon" onclick="adjustZoom(-0.15)">축소 (-)</button>
          <span id="zoomIndicator" style="font-size:11px; color:#64748b; width:40px; text-align:center;">100%</span>
          <button class="btn-icon" onclick="adjustZoom(0.15)">확대 (+)</button>
          <button class="btn-icon" onclick="resetZoom()">원래 크기</button>
        </div>
      </div>
      <div class="viewer-viewport" id="viewerViewport">
        <div class="viewer-canvas-wrap" id="viewerWrap">
          <canvas id="mainViewerCanvas"></canvas>
        </div>
        <div id="viewerEmptyMsg" class="viewer-empty">오른쪽 패널에서 파일을 불러와 주세요.</div>
      </div>
    </div>

    <!-- 3열: 우측 설정 및 조작 패널 -->
    <div class="col-control">
      <div class="control-body">

        <!-- 파일 로드 버튼 -->
        <div class="control-group">
          <label>문서 / 파일 선택</label>
          <div class="btn-file-wrap">
            <div id="btnFileLabel" class="btn-file">📁 PDF 파일 열기</div>
            <input type="file" id="fileInput" accept="application/pdf">
          </div>
        </div>

        <!-- 옵션: PDF ➡️ 이미지 모드 전용 -->
        <div id="optionsPdf2Img" style="display: flex; flex-direction: column; gap: 12px;">
          <div class="control-group">
            <label>출력 포맷</label>
            <select id="selFormat" onchange="updateMiniPreview()">
              <option value="png" selected>PNG (무손실 / 투명 지원)</option>
              <option value="jpeg">JPG (사진 압축 / 고효율)</option>
              <option value="webp">WebP (최신 웹 규격)</option>
              <option value="bmp">BMP (윈도우 비트맵 표준)</option>
              <option value="ico">ICO (아이콘 규격 / 256px)</option>
              <option value="tiff">TIFF (인쇄 / 출판 규격)</option>
            </select>
          </div>

          <div class="control-group">
            <label>해상도 / 화질</label>
            <select id="selScale">
              <option value="1.5">1.5x (화면용 / 용량 절약)</option>
              <option value="2.0" selected>2.0x (고해상도 A4 권장)</option>
              <option value="3.0">3.0x (초고해상도 인쇄용)</option>
            </select>
          </div>

          <div class="control-group">
            <label>용지 맞춤</label>
            <select id="selPageFit" onchange="updateMiniPreview()">
              <option value="original" selected>원본 크기 유지 (1:1)</option>
              <option value="a4">표준 A4 맞춤 (여백 자동 균등)</option>
            </select>
          </div>

          <div class="control-group">
            <label>회전 각도</label>
            <select id="selRotation" onchange="updateMiniPreview()">
              <option value="0" selected>회전 없음 (0°)</option>
              <option value="90">오른쪽 90° 회전</option>
              <option value="180">180° 상하 반전</option>
              <option value="270">왼쪽 90° 회전</option>
            </select>
          </div>
        </div>

        <!-- 옵션: 이미지 ➡️ PDF 모드 전용 -->
        <div id="optionsImg2Pdf" style="display: none; flex-direction: column; gap: 12px;">
          <div class="control-group">
            <label>용지 규격</label>
            <select id="selPdfPageSize" onchange="updateMiniPreview()">
              <option value="original" selected>이미지 원래 크기 맞춤 (1:1)</option>
              <option value="a4">표준 A4 용지 규격</option>
            </select>
          </div>

          <div class="control-group">
            <label>용지 방향</label>
            <select id="selPdfOrientation" onchange="updateMiniPreview()">
              <option value="auto" selected>자동 (이미지 가로/세로 비율)</option>
              <option value="p">세로 (Portrait)</option>
              <option value="l">가로 (Landscape)</option>
            </select>
          </div>

          <div class="control-group">
            <label>여백 설정</label>
            <select id="selPdfMargin" onchange="updateMiniPreview()">
              <option value="0" selected>여백 없음 (0px)</option>
              <option value="10">기본 여백 (10px)</option>
              <option value="20">넓은 여백 (20px)</option>
            </select>
          </div>
        </div>

        <!-- 실시간 미니 프리뷰 -->
        <div class="preview-section">
          <div class="preview-section-title">실시간 변환 윤곽 프리뷰</div>
          <div class="mini-preview-box">
            <div id="miniSheet" class="mini-preview-sheet">
              <canvas id="miniCanvas" class="mini-preview-canvas"></canvas>
            </div>
          </div>
          <div id="miniInfo" style="font-size:10px; color:#64748b; margin-top:6px;">선택 항목 기준 윤곽</div>
        </div>

        <!-- 실행 영역 -->
        <div class="action-section">
          <div class="status-text" id="statusText">준비 완료</div>
          <div class="progress-bar-wrap" id="progWrap">
            <div class="progress-bar-fill" id="progFill"></div>
          </div>
          <button id="btnAction" class="btn-action" disabled onclick="handleAction()">변환 시작</button>
          <button id="btnAbort" class="btn-action btn-abort" style="display:none;" onclick="abortAction()">변환 중단</button>
          <button id="btnDownloadZip" class="btn-action btn-zip" style="display:none;" onclick="downloadZip()">전체 ZIP 받기</button>
        </div>

      </div>
    </div>

  </div>

  <script>
    console.log("PDF ↔ 이미지 양방향 변환기 v1.1.0 초기화");
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // 전역 상태
    let appMode = 'pdf2img'; // 'pdf2img' | 'img2pdf'
    let currentPdfDoc = null;
    let originalFileName = 'document';
    let pdfPageCheckList = []; // 각 페이지 변환 대상 여부 (true/false)
    let imageFileList = []; // 다중 이미지 모드 파일 목록: [{ file, imgObj, name, width, height }]
    let currentIndex = 0; // 2열 메인 뷰어에 표시 중인 인덱스
    let zoomLevel = 1.0;
    let isAborted = false;
    let zipBlobs = []; // 변환된 결과물 보관

    // 커스텀 바이너리 인코더 (규격 및 엔디안 검증 완료)
    const CustomEncoders = {
      canvasToBMP(ctx, w, h) {
        const imgData = ctx.getImageData(0, 0, w, h).data;
        const rowSize = Math.floor((24 * w + 31) / 32) * 4;
        const pixelArraySize = rowSize * h;
        const buffer = new ArrayBuffer(54 + pixelArraySize);
        const view = new DataView(buffer);

        view.setUint16(0, 0x424D, false); // ASCII 'B', 'M'
        view.setUint32(2, 54 + pixelArraySize, true);
        view.setUint32(10, 54, true);

        view.setUint32(14, 40, true);
        view.setInt32(18, w, true);
        view.setInt32(22, h, true);
        view.setUint16(26, 1, true);
        view.setUint16(28, 24, true);
        view.setUint32(34, pixelArraySize, true);

        let offset = 54;
        for (let y = h - 1; y >= 0; y--) {
          for (let x = 0; x < w; x++) {
            const idx = (y * w + x) * 4;
            view.setUint8(offset++, imgData[idx + 2]);
            view.setUint8(offset++, imgData[idx + 1]);
            view.setUint8(offset++, imgData[idx]);
          }
          while ((offset - 54) % 4 !== 0) view.setUint8(offset++, 0);
        }
        return new Blob([buffer], { type: 'image/bmp' });
      },

      async canvasToICO(canvas) {
        const size = Math.min(256, Math.max(canvas.width, canvas.height));
        const icoCanvas = document.createElement('canvas');
        icoCanvas.width = size;
        icoCanvas.height = size;
        const ictx = icoCanvas.getContext('2d');
        ictx.drawImage(canvas, 0, 0, size, size);

        const pngBlob = await new Promise(r => icoCanvas.toBlob(r, 'image/png'));
        const pngBuf = await pngBlob.arrayBuffer();

        const totalSize = 22 + pngBuf.byteLength;
        const icoBuffer = new ArrayBuffer(totalSize);
        const view = new DataView(icoBuffer);

        view.setUint16(0, 0, true);
        view.setUint16(2, 1, true); // ICO
        view.setUint16(4, 1, true);

        view.setUint8(6, size >= 256 ? 0 : size);
        view.setUint8(7, size >= 256 ? 0 : size);
        view.setUint8(8, 0);
        view.setUint8(9, 0);
        view.setUint16(10, 1, true);
        view.setUint16(12, 32, true);
        view.setUint32(14, pngBuf.byteLength, true);
        view.setUint32(18, 22, true);

        new Uint8Array(icoBuffer, 22).set(new Uint8Array(pngBuf));
        return new Blob([icoBuffer], { type: 'image/x-icon' });
      },

      canvasToTIFF(ctx, w, h) {
        const imgData = ctx.getImageData(0, 0, w, h).data;
        const tiffBytes = UTIF.encodeImage(imgData.buffer, w, h);
        return new Blob([tiffBytes], { type: 'image/tiff' });
      }
    };

    // 모드 전환
    function setAppMode(mode) {
      appMode = mode;
      document.getElementById('tabPdf2Img').classList.toggle('active', mode === 'pdf2img');
      document.getElementById('tabImg2Pdf').classList.toggle('active', mode === 'img2pdf');
      document.getElementById('optionsPdf2Img').style.display = mode === 'pdf2img' ? 'flex' : 'none';
      document.getElementById('optionsImg2Pdf').style.display = mode === 'img2pdf' ? 'flex' : 'none';

      const fileInput = document.getElementById('fileInput');
      const btnFileLabel = document.getElementById('btnFileLabel');
      const btnAction = document.getElementById('btnAction');

      if (mode === 'pdf2img') {
        fileInput.accept = 'application/pdf';
        fileInput.multiple = false;
        btnFileLabel.textContent = '📁 PDF 파일 열기';
        btnAction.textContent = '선택 페이지 변환 시작';
        document.getElementById('lblSelectAll').style.display = 'flex';
      } else {
        fileInput.accept = 'image/png,image/jpeg,image/webp,image/bmp';
        fileInput.multiple = true;
        btnFileLabel.textContent = '🖼️ 이미지 파일 추가 (다중)';
        btnAction.textContent = 'PDF 병합 저장';
        document.getElementById('lblSelectAll').style.display = 'none';
      }

      resetWorkspace();
    }

    // 워크스페이스 초기화
    function resetWorkspace() {
      currentPdfDoc = null;
      pdfPageCheckList = [];
      imageFileList = [];
      currentIndex = 0;
      zipBlobs = [];

      document.getElementById('thumbList').innerHTML = '';
      document.getElementById('thumbCount').textContent = '0 항목';
      document.getElementById('viewerPageIndicator').textContent = '- / -';
      document.getElementById('viewerWrap').style.display = 'none';
      document.getElementById('viewerEmptyMsg').style.display = 'block';
      document.getElementById('btnAction').disabled = true;
      document.getElementById('btnDownloadZip').style.display = 'none';
      document.getElementById('btnAbort').style.display = 'none';
      document.getElementById('statusText').textContent = '파일을 선택해 주세요.';

      const miniCanvas = document.getElementById('miniCanvas');
      miniCanvas.width = 0; miniCanvas.height = 0;
    }

    // 파일 로드 핸들러
    document.getElementById('fileInput').addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      if (appMode === 'pdf2img') {
        const file = files[0];
        originalFileName = file.name.replace(/\.[^/.]+$/, "");
        document.getElementById('statusText').textContent = 'PDF 문서를 로드하는 중...';

        try {
          const arrayBuf = await file.arrayBuffer();
          currentPdfDoc = await pdfjsLib.getDocument({ data: arrayBuf }).promise;
          const total = currentPdfDoc.numPages;
          pdfPageCheckList = new Array(total).fill(true);
          document.getElementById('chkSelectAll').checked = true;
          document.getElementById('thumbCount').textContent = `${total} 페이지`;
          document.getElementById('statusText').textContent = `로드 완료: 총 ${total}페이지`;

          await renderPdfThumbnailList();
          loadMainViewer(0);
          document.getElementById('btnAction').disabled = false;
        } catch (err) {
          console.error(err);
          document.getElementById('statusText').textContent = 'PDF 문서를 읽을 수 없습니다.';
        }
      } else {
        // 이미지 다중 모드 (파워포인트처럼 기존 목록 아래로 추가)
        document.getElementById('statusText').textContent = '이미지를 읽어오는 중...';
        for (const file of files) {
          const imgObj = await loadImageSafe(file);
          imageFileList.push({
            file: file,
            imgObj: imgObj,
            name: file.name,
            width: imgObj.width,
            height: imgObj.height
          });
        }
        document.getElementById('thumbCount').textContent = `${imageFileList.length} 이미지`;
        document.getElementById('statusText').textContent = `총 ${imageFileList.length}개의 이미지가 로드되었습니다.`;

        renderImageThumbnailList();
        loadMainViewer(imageFileList.length - files.length); // 새로 추가된 첫 항목으로 이동
        document.getElementById('btnAction').disabled = false;
      }
      e.target.value = ''; // 재선택 가능하도록 리셋
    });

    // 안전 이미지 로더
    async function loadImageSafe(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("이미지 디코딩 실패")); };
        img.src = url;
      });
    }

    // [모드 1] 1열 썸네일 리스트 렌더링 (PDF 모드)
    async function renderPdfThumbnailList() {
      const container = document.getElementById('thumbList');
      container.innerHTML = '';
      const total = currentPdfDoc.numPages;

      for (let i = 1; i <= total; i++) {
        const card = document.createElement('div');
        card.className = `thumb-card ${i - 1 === currentIndex ? 'active' : ''}`;
        card.id = `thumb-card-${i - 1}`;
        card.onclick = () => loadMainViewer(i - 1);

        const header = document.createElement('div');
        header.className = 'thumb-card-header';
        header.innerHTML = `<span>#${i}</span>`;

        const chk = document.createElement('input');
        chk.type = 'checkbox';
        chk.checked = pdfPageCheckList[i - 1];
        chk.onclick = (e) => {
          e.stopPropagation();
          pdfPageCheckList[i - 1] = chk.checked;
          updateThumbCounts();
        };
        header.appendChild(chk);
        card.appendChild(header);

        // 가벼운 썸네일 캔버스
        const page = await currentPdfDoc.getPage(i);
        const vp = page.getViewport({ scale: 0.25 });
        const canvas = document.createElement('canvas');
        canvas.width = vp.width;
        canvas.height = vp.height;
        await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
        card.appendChild(canvas);

        container.appendChild(card);
      }
      updateThumbCounts();
    }

    // 전체 선택/해제 토글
    document.getElementById('chkSelectAll').addEventListener('change', (e) => {
      const checked = e.target.checked;
      pdfPageCheckList = pdfPageCheckList.map(() => checked);
      document.querySelectorAll('#thumbList input[type="checkbox"]').forEach(c => c.checked = checked);
      updateThumbCounts();
    });

    function updateThumbCounts() {
      const selected = pdfPageCheckList.filter(Boolean).length;
      document.getElementById('thumbCount').textContent = `${selected} / ${pdfPageCheckList.length} 선택`;
      document.getElementById('btnAction').disabled = selected === 0;
    }

    // [모드 2] 1열 썸네일 리스트 렌더링 (이미지 모드 - 순서 변경 포함)
    function renderImageThumbnailList() {
      const container = document.getElementById('thumbList');
      container.innerHTML = '';

      imageFileList.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = `thumb-card ${idx === currentIndex ? 'active' : ''}`;
        card.id = `thumb-card-${idx}`;
        card.onclick = () => loadMainViewer(idx);

        const header = document.createElement('div');
        header.className = 'thumb-card-header';
        header.innerHTML = `<span>#${idx + 1}</span>`;

        const btnRow = document.createElement('div');
        btnRow.className = 'thumb-btn-row';

        // 위로 이동 버튼
        const btnUp = document.createElement('button');
        btnUp.className = 'btn-icon';
        btnUp.textContent = '▲';
        btnUp.onclick = (e) => { e.stopPropagation(); moveImageOrder(idx, -1); };

        // 아래로 이동 버튼
        const btnDown = document.createElement('button');
        btnDown.className = 'btn-icon';
        btnDown.textContent = '▼';
        btnDown.onclick = (e) => { e.stopPropagation(); moveImageOrder(idx, 1); };

        // 삭제 버튼
        const btnDel = document.createElement('button');
        btnDel.className = 'btn-icon';
        btnDel.textContent = '✕';
        btnDel.onclick = (e) => { e.stopPropagation(); removeImageItem(idx); };

        btnRow.appendChild(btnUp);
        btnRow.appendChild(btnDown);
        btnRow.appendChild(btnDel);
        header.appendChild(btnRow);
        card.appendChild(header);

        // 썸네일 다운샘플링 캔버스
        const thumbCanvas = document.createElement('canvas');
        const tw = 160;
        const th = Math.round((item.height / item.width) * tw);
        thumbCanvas.width = tw;
        thumbCanvas.height = th;
        const tctx = thumbCanvas.getContext('2d');
        tctx.drawImage(item.imgObj, 0, 0, tw, th);
        card.appendChild(thumbCanvas);

        container.appendChild(card);
      });
    }

    // 이미지 순서 변경 (위/아래)
    function moveImageOrder(index, delta) {
      const target = index + delta;
      if (target < 0 || target >= imageFileList.length) return;
      const temp = imageFileList[index];
      imageFileList[index] = imageFileList[target];
      imageFileList[target] = temp;
      renderImageThumbnailList();
      loadMainViewer(target);
    }

    // 이미지 삭제
    function removeImageItem(index) {
      imageFileList.splice(index, 1);
      if (currentIndex >= imageFileList.length) currentIndex = Math.max(0, imageFileList.length - 1);
      renderImageThumbnailList();
      if (imageFileList.length > 0) {
        loadMainViewer(currentIndex);
      } else {
        resetWorkspace();
      }
    }

    // 2열 메인 뷰어 로드 (선택된 페이지만 고화질로 렌더링)
    async function loadMainViewer(index) {
      currentIndex = index;
      document.querySelectorAll('.thumb-card').forEach((c, i) => c.classList.toggle('active', i === index));
      const targetCard = document.getElementById(`thumb-card-${index}`);
      if (targetCard) targetCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

      document.getElementById('viewerEmptyMsg').style.display = 'none';
      const wrap = document.getElementById('viewerWrap');
      wrap.style.display = 'block';

      const canvas = document.getElementById('mainViewerCanvas');
      const ctx = canvas.getContext('2d');

      if (appMode === 'pdf2img' && currentPdfDoc) {
        const total = currentPdfDoc.numPages;
        document.getElementById('viewerPageIndicator').textContent = `${index + 1} / ${total} 페이지`;
        const page = await currentPdfDoc.getPage(index + 1);
        const vp = page.getViewport({ scale: 1.5 });
        canvas.width = vp.width;
        canvas.height = vp.height;
        await page.render({ canvasContext: ctx, viewport: vp }).promise;
      } else if (appMode === 'img2pdf' && imageFileList[index]) {
        const item = imageFileList[index];
        document.getElementById('viewerPageIndicator').textContent = `${index + 1} / ${imageFileList.length} 이미지`;
        canvas.width = item.width;
        canvas.height = item.height;
        ctx.drawImage(item.imgObj, 0, 0);
      }

      applyZoom();
      updateMiniPreview();
    }

    // 2열 뷰어 내비게이션
    function navigateViewer(delta) {
      const max = appMode === 'pdf2img' ? (currentPdfDoc ? currentPdfDoc.numPages : 0) : imageFileList.length;
      if (max === 0) return;
      let next = currentIndex + delta;
      if (next < 0) next = 0;
      if (next >= max) next = max - 1;
      loadMainViewer(next);
    }

    // 줌 조절
    function adjustZoom(delta) {
      zoomLevel = Math.max(0.3, Math.min(3.0, zoomLevel + delta));
      applyZoom();
    }
    function resetZoom() {
      zoomLevel = 1.0;
      applyZoom();
    }
    function applyZoom() {
      const wrap = document.getElementById('viewerWrap');
      wrap.style.transform = `scale(${zoomLevel})`;
      document.getElementById('zoomIndicator').textContent = `${Math.round(zoomLevel * 100)}%`;
    }

    // 3열 실시간 미니 프리뷰 업데이트 (회전 / A4 여백 윤곽)
    function updateMiniPreview() {
      const miniCanvas = document.getElementById('miniCanvas');
      const mctx = miniCanvas.getContext('2d');
      const miniSheet = document.getElementById('miniSheet');
      const info = document.getElementById('miniInfo');

      const srcCanvas = document.getElementById('mainViewerCanvas');
      if (!srcCanvas || srcCanvas.width === 0) return;

      if (appMode === 'pdf2img') {
        const rot = parseInt(document.getElementById('selRotation').value, 10);
        const fit = document.getElementById('selPageFit').value;

        // 원본 크기 대비 A4 비율 (1:1.414)
        if (fit === 'a4') {
          miniSheet.style.width = '100px';
          miniSheet.style.height = '141px'; // A4 세로 규격 박스
          info.textContent = `표준 A4 맞춤 (${rot}° 회전)`;
        } else {
          const ratio = srcCanvas.width / srcCanvas.height;
          if (ratio > 1) {
            miniSheet.style.width = '120px';
            miniSheet.style.height = `${Math.round(120 / ratio)}px`;
          } else {
            miniSheet.style.height = '120px';
            miniSheet.style.width = `${Math.round(120 * ratio)}px`;
          }
          info.textContent = `원본 비율 유지 (${rot}° 회전)`;
        }

        miniCanvas.width = 120;
        miniCanvas.height = 120;
        mctx.clearRect(0, 0, 120, 120);
        mctx.save();
        mctx.translate(60, 60);
        mctx.rotate((rot * Math.PI) / 180);
        mctx.drawImage(srcCanvas, -45, -45, 90, 90);
        mctx.restore();
      } else {
        const sizeMode = document.getElementById('selPdfPageSize').value;
        const orient = document.getElementById('selPdfOrientation').value;
        const margin = parseInt(document.getElementById('selPdfMargin').value, 10);

        if (sizeMode === 'a4') {
          const isLand = orient === 'l' || (orient === 'auto' && srcCanvas.width > srcCanvas.height);
          miniSheet.style.width = isLand ? '141px' : '100px';
          miniSheet.style.height = isLand ? '100px' : '141px';
          info.textContent = `A4 용지 (여백 ${margin}px)`;
        } else {
          miniSheet.style.width = '110px';
          miniSheet.style.height = '110px';
          info.textContent = `1:1 원본 맞춤 (여백 ${margin}px)`;
        }

        miniCanvas.width = 100;
        miniCanvas.height = 100;
        mctx.clearRect(0, 0, 100, 100);
        mctx.fillStyle = '#ffffff';
        mctx.fillRect(0, 0, 100, 100);
        mctx.drawImage(srcCanvas, 5, 5, 90, 90);
      }
    }

    // [변환 실행] 메인 액션
    async function handleAction() {
      if (appMode === 'pdf2img') {
        await executePdfToImages();
      } else {
        await executeImagesToPdf();
      }
    }

    // PDF ➡️ 이미지 분할 실행
    async function executePdfToImages() {
      const selectedPages = [];
      pdfPageCheckList.forEach((chk, i) => { if (chk) selectedPages.push(i + 1); });
      if (selectedPages.length === 0) return;

      const format = document.getElementById('selFormat').value;
      const scale = parseFloat(document.getElementById('selScale').value);
      const fit = document.getElementById('selPageFit').value;
      const rot = parseInt(document.getElementById('selRotation').value, 10);

      document.getElementById('btnAction').disabled = true;
      document.getElementById('btnAbort').style.display = 'inline-block';
      document.getElementById('btnDownloadZip').style.display = 'none';
      document.getElementById('progWrap').style.display = 'block';
      isAborted = false;
      zipBlobs = [];

      try {
        for (let idx = 0; idx < selectedPages.length; idx++) {
          if (isAborted) {
            document.getElementById('statusText').textContent = '변환이 중단되었습니다.';
            break;
          }

          const pageNum = selectedPages[idx];
          const pct = Math.round(((idx + 1) / selectedPages.length) * 100);
          document.getElementById('progFill').style.width = `${pct}%`;
          document.getElementById('statusText').textContent = `변환 중: [${pageNum}페이지] (${pct}%)...`;

          await new Promise(r => setTimeout(r, 0)); // 비동기 양보

          const page = await currentPdfDoc.getPage(pageNum);
          const vp = page.getViewport({ scale, rotation: rot });

          // 캔버스 생성
          let finalCanvas = document.createElement('canvas');
          let fctx = finalCanvas.getContext('2d');

          if (fit === 'a4') {
            // A4 규격 맞춤 (가로:세로 1:1.414)
            const a4Ratio = 1.414;
            let a4W, a4H;
            if (vp.width > vp.height) { // 가로형 A4
              a4W = Math.max(vp.width, vp.height * a4Ratio);
              a4H = a4W / a4Ratio;
            } else { // 세로형 A4
              a4H = Math.max(vp.height, vp.width * a4Ratio);
              a4W = a4H / a4Ratio;
            }
            finalCanvas.width = a4W;
            finalCanvas.height = a4H;
            fctx.fillStyle = '#ffffff';
            fctx.fillRect(0, 0, a4W, a4H); // 흰색 배경 채우기
            // 중앙 배치
            const offsetX = (a4W - vp.width) / 2;
            const offsetY = (a4H - vp.height) / 2;
            fctx.translate(offsetX, offsetY);
            await page.render({ canvasContext: fctx, viewport: vp }).promise;
            fctx.translate(-offsetX, -offsetY);
          } else {
            // 원본 1:1
            finalCanvas.width = vp.width;
            finalCanvas.height = vp.height;
            await page.render({ canvasContext: fctx, viewport: vp }).promise;
          }

          // 포맷 인코딩
          let blob;
          if (format === 'png') {
            blob = await new Promise(r => finalCanvas.toBlob(r, 'image/png'));
          } else if (format === 'jpeg') {
            blob = await new Promise(r => finalCanvas.toBlob(r, 'image/jpeg', 0.95));
          } else if (format === 'webp') {
            blob = await new Promise(r => finalCanvas.toBlob(r, 'image/webp', 0.95));
          } else if (format === 'bmp') {
            blob = CustomEncoders.canvasToBMP(fctx, finalCanvas.width, finalCanvas.height);
          } else if (format === 'ico') {
            blob = await CustomEncoders.canvasToICO(finalCanvas);
          } else if (format === 'tiff') {
            blob = CustomEncoders.canvasToTIFF(fctx, finalCanvas.width, finalCanvas.height);
          }

          finalCanvas.width = 0; finalCanvas.height = 0; // 메모리 해제

          const fileName = `${originalFileName}_p${String(pageNum).padStart(3, '0')}.${format}`;
          zipBlobs.push({ name: fileName, blob });
        }

        if (!isAborted) {
          document.getElementById('statusText').textContent = `완료! 총 ${zipBlobs.length}장 변환 완료.`;
          document.getElementById('btnDownloadZip').style.display = 'inline-block';
        }
      } catch (err) {
        console.error(err);
        document.getElementById('statusText').textContent = `오류: ${err.message}`;
      } finally {
        document.getElementById('btnAction').disabled = false;
        document.getElementById('btnAbort').style.display = 'none';
      }
    }

    // 이미지 ➡️ PDF 병합 실행
    async function executeImagesToPdf() {
      if (imageFileList.length === 0) return;

      document.getElementById('btnAction').disabled = true;
      document.getElementById('progWrap').style.display = 'block';

      const { jsPDF } = window.jspdf;
      const sizeMode = document.getElementById('selPdfPageSize').value;
      const orientOpt = document.getElementById('selPdfOrientation').value;
      const margin = parseInt(document.getElementById('selPdfMargin').value, 10);
      let doc = null;

      try {
        for (let i = 0; i < imageFileList.length; i++) {
          const pct = Math.round(((i + 1) / imageFileList.length) * 100);
          document.getElementById('progFill').style.width = `${pct}%`;
          document.getElementById('statusText').textContent = `PDF 병합 중: [${i + 1} / ${imageFileList.length}]...`;

          await new Promise(r => setTimeout(r, 0));

          const item = imageFileList[i];
          const w = item.width;
          const h = item.height;

          // 투명 PNG 검은색 방지 흰색 채우기
          const tempCanvas = document.createElement('canvas');
          tempCanvas.width = w;
          tempCanvas.height = h;
          const tctx = tempCanvas.getContext('2d');
          tctx.fillStyle = '#ffffff';
          tctx.fillRect(0, 0, w, h);
          tctx.drawImage(item.imgObj, 0, 0);

          const imgDataUrl = tempCanvas.toDataURL('image/jpeg', 0.95);
          tempCanvas.width = 0; tempCanvas.height = 0;

          const isLandscape = orientOpt === 'l' || (orientOpt === 'auto' && w > h);
          const orientation = isLandscape ? 'l' : 'p';
          const pWidth = w + (margin * 2);
          const pHeight = h + (margin * 2);

          if (i === 0) {
            doc = new jsPDF({
              orientation: orientation,
              unit: 'px',
              format: sizeMode === 'a4' ? 'a4' : [pWidth, pHeight]
            });
          } else {
            doc.addPage(sizeMode === 'a4' ? 'a4' : [pWidth, pHeight], orientation);
          }

          if (sizeMode === 'a4') {
            const pageW = doc.internal.pageSize.getWidth();
            const pageH = doc.internal.pageSize.getHeight();
            doc.addImage(imgDataUrl, 'JPEG', margin, margin, pageW - (margin * 2), pageH - (margin * 2));
          } else {
            doc.addImage(imgDataUrl, 'JPEG', margin, margin, w, h);
          }
        }

        doc.save(`${originalFileName}_merged.pdf`);
        document.getElementById('statusText').textContent = `성공! ${imageFileList.length}개 이미지 PDF 병합 완료.`;
      } catch (err) {
        console.error(err);
        document.getElementById('statusText').textContent = `PDF 병합 실패: ${err.message}`;
      } finally {
        document.getElementById('btnAction').disabled = false;
      }
    }

    // ZIP 다운로드
    async function downloadZip() {
      if (zipBlobs.length === 0) return;
      document.getElementById('statusText').textContent = 'ZIP 압축 중...';
      const zip = new JSZip();
      zipBlobs.forEach(item => zip.file(item.name, item.blob));
      const zipBlob = await zip.generateAsync({ type: 'blob' });

      const url = URL.createObjectURL(zipBlob);
      const a = document.createElement('a');
      a.download = `${originalFileName}_images.zip`;
      a.href = url;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 2000); // 즉시 메모리 해제
      document.getElementById('statusText').textContent = 'ZIP 파일 다운로드 완료.';
    }

    function abortAction() {
      isAborted = true;
      document.getElementById('btnAbort').disabled = true;
    }
  </script>
</body>
</html>
