name: Deploy PixPDF to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # V2.0.0 폴더의 온라인 에셋(index.html 등)을 웹 루트로 배포
          path: 'V2.0.0'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
